<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>언리얼코어 · C++ 학습지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽 목차 + 오른쪽 학습지 본문. 주제마다 학습 단계 체크, 면접 답은 접어 두고, 카드는 뒤집어 확인한다. */
:root {
  --bg: #f4f6f9;
  --paper: #ffffff;
  --fg: #1b2230;
  --muted: #5d6779;
  --line: #dde2ea;
  --accent: #2f52c9;
  --accent-soft: #e6ecfb;
  --code-bg: #eef1f6;
  --good: #1f7a4d;
  --good-soft: #e3f3ea;
  --warn: #a2560f;
  --warn-soft: #fbeedd;
  --hl: #fff0a3;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --paper: #181d26; --fg: #e3e7ee; --muted: #9aa4b5; --line: #2a3140;
    --accent: #8ea8ff; --accent-soft: #232c45; --code-bg: #202634;
    --good: #6fd3a0; --good-soft: #1c3329; --warn: #f0b36b; --warn-soft: #3a2b1a; --hl: #5b4b10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --paper: #181d26; --fg: #e3e7ee; --muted: #9aa4b5; --line: #2a3140;
  --accent: #8ea8ff; --accent-soft: #232c45; --code-bg: #202634;
  --good: #6fd3a0; --good-soft: #1c3329; --warn: #f0b36b; --warn-soft: #3a2b1a; --hl: #5b4b10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
.wrap { max-width: 1680px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
header.top h1 { font-size: 1.6rem; line-height: 1.3; margin: 0; text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
button.btn { font: inherit; font-size: .88rem; background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
/* AI 질문 패널 */
aside.chat { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); height: calc((100vh - 32px) * 2 / 3); min-height: 420px; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.chat-head h2 { font-size: 1rem; margin: 0; }
.chat-head .ctx { color: var(--muted); font-size: .78rem; }
.chat-head .acts { display: flex; gap: 6px; }
.chat-log { flex: 1; overflow-y: auto; padding: 12px 14px; display: grid; gap: 12px; align-content: start; }
.chat-empty { color: var(--muted); font-size: .88rem; }
.msg { border-radius: 8px; padding: 10px 12px; font-size: .92rem; min-width: 0; }
.msg.user { background: var(--accent-soft); }
.msg.assistant { border: 1px solid var(--line); }
.msg .who { font-size: .74rem; color: var(--muted); margin-bottom: 4px; letter-spacing: .04em; }
.msg .quote { border-left: 3px solid var(--accent); padding: 2px 0 2px 8px; margin-bottom: 6px; color: var(--muted); font-size: .83rem; white-space: pre-wrap; max-height: 7.5em; overflow: hidden; }
.msg .body p, .msg .body li { max-width: none; }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg .body pre { font-size: .8rem; }
.msg.user .body { white-space: pre-wrap; }
.chat-form { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 8px; }
.attach { display: flex; gap: 8px; align-items: start; background: var(--bg); border-radius: 6px; padding: 6px 8px; font-size: .82rem; color: var(--muted); }
.attach span { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.attach button { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 4px; }
.chat-form textarea { width: 100%; min-height: 70px; resize: vertical; font: inherit; font-size: .92rem; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.chat-form .row { display: flex; gap: 8px; align-items: center; }
.chat-form .status { flex: 1; color: var(--muted); font-size: .8rem; }
button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
button.btn:disabled { opacity: .5; cursor: default; }
mark.hl { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }
#askSel { position: absolute; z-index: 25; font: inherit; font-size: .85rem; background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
.fab { display: none; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; font: inherit; background: var(--accent); color: var(--paper); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }
#chatClose { display: none; }
.prov { display: flex; gap: 4px; margin-top: 6px; }
.prov .btn { font-size: .78rem; padding: 3px 10px; }
.gpt { display: grid; gap: 8px; background: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: .84rem; }
.gpt p { margin: 0; color: var(--muted); }
.gpt a { color: var(--accent); }
.gpt textarea { min-height: 90px; }
@media (max-width: 1279px) {
  .layout { grid-template-columns: 230px minmax(0, 1fr); }
  aside.chat { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); height: auto; border-radius: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -8px 0 24px rgba(0, 0, 0, .18); }
  aside.chat:not(.open) { display: none; }
  .fab { display: block; }
  #chatClose { display: inline-block; }
}
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; font-size: .9rem; }
nav.toc .label { font-size: .75rem; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: flex; justify-content: space-between; gap: 8px; color: var(--fg); text-decoration: none; padding: 5px 8px; border-radius: 5px; }
nav.toc a:hover { background: var(--accent-soft); }
nav.toc .prog { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
nav.toc .prog.done { color: var(--good); }
.overall { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--good); width: 0; }
main { min-width: 0; display: grid; gap: 22px; }
.intro { color: var(--muted); font-size: .92rem; }
.intro blockquote { margin: 0; padding: 0; border: 0; }
section.topic { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; min-width: 0; scroll-margin-top: 16px; }
section.topic > h2 { font-size: 1.32rem; line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
section.topic h3 { font-size: 1.02rem; margin: 26px 0 8px; color: var(--accent); letter-spacing: .01em; }
section.topic p, section.topic li { max-width: 72ch; }
section.topic ul, section.topic ol { padding-left: 1.3em; }
section.topic li + li { margin-top: 4px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 6px; padding: 10px 12px; background: var(--bg); border-radius: 8px; font-size: .86rem; }
.steps label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
.steps input:checked + span { color: var(--good); text-decoration: line-through; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--code-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.55; font-size: .85rem; }
pre code { background: none; padding: 0; overflow-wrap: normal; font-size: inherit; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .82rem; letter-spacing: .03em; }
ol.qa { list-style: none; padding: 0; counter-reset: qa; display: grid; gap: 10px; }
ol.qa > li { counter-increment: qa; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; max-width: none; }
ol.qa > li > .q { font-weight: 700; display: block; }
ol.qa > li > .q::before { content: "Q" counter(qa) ". "; color: var(--accent); }
details.ans { margin-top: 8px; }
details.ans > summary { cursor: pointer; color: var(--accent); font-size: .88rem; width: fit-content; }
details.ans[open] > summary { margin-bottom: 6px; }
details.ans .body { padding-left: 12px; border-left: 2px solid var(--accent-soft); }
.problem { border: 1px solid var(--line); border-radius: 8px; padding: 4px 16px 14px; margin-top: 14px; min-width: 0; }
.problem.ok { border-color: var(--good); background: var(--good-soft); }
.problem.no { border-color: var(--warn); background: var(--warn-soft); }
.problem > h3 { margin-top: 14px; }
.pmark { display: flex; gap: 6px; margin-top: 10px; }
.pmark button { font: inherit; font-size: .8rem; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); cursor: pointer; }
.cards-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 14px; }
.cards-bar .count { color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--paper); }
.card.known { border-color: var(--good); background: var(--good-soft); }
.card.again { border-color: var(--warn); background: var(--warn-soft); }
.card .cq { font-weight: 500; }
.card .ca { color: var(--fg); border-top: 1px dashed var(--line); padding-top: 8px; }
.card .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.card .row button { font: inherit; font-size: .8rem; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--paper); color: var(--fg); cursor: pointer; }
.empty { color: var(--muted); }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.toc { position: static; max-height: none; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  section.topic { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="pageTitle">언리얼코어 · C++ 학습지</h1>
      <p class="sub" id="pageSub">노트 2개 · 주제마다 학습 단계를 체크하고, 면접 답은 먼저 말해 본 뒤 펼친다</p>
    </div>
    <div class="controls">
      <button class="btn" id="toggleAnswers" aria-pressed="false" type="button">답 모두 펼치기</button>
    </div>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="layout">
    <nav class="toc" aria-label="주제 목차">
      <p class="label">주제</p>
      <ol id="toc"></ol>
      <div class="overall"><span id="overallText"></span><div class="bar"><i id="overallBar"></i></div></div>
    </nav>
    <main id="main"></main>
    <aside class="chat" id="chat" aria-label="AI 질문">
      <div class="chat-head">
        <div><h2>AI 질문</h2><div class="ctx" id="chatCtx"></div>
          <div class="prov" role="group" aria-label="AI 선택">
            <button class="btn" type="button" id="provClaude" aria-pressed="true">Claude</button>
            <button class="btn" type="button" id="provGpt" aria-pressed="false">ChatGPT</button>
          </div>
        </div>
        <div class="acts">
          <button class="btn" id="chatClear" type="button">대화 지우기</button>
          <button class="btn" id="chatClose" type="button">닫기</button>
        </div>
      </div>
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <form class="chat-form" id="chatForm">
        <div class="attach" id="chatAttach" hidden><span id="chatAttachText"></span><button type="button" id="chatAttachRemove" aria-label="선택한 구절 빼기">✕</button></div>
        <div class="gpt" id="gptBox" hidden>
          <p id="gptMsg">질문을 노트 맥락과 함께 복사했습니다. <a id="gptLink" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기</a>에서 붙여 넣으세요. 받은 답을 아래에 붙여 넣으면 이 대화에 남습니다.</p>
          <textarea id="gptPrompt" readonly hidden aria-label="복사할 질문"></textarea>
          <textarea id="gptAnswer" placeholder="ChatGPT의 답을 여기에 붙여 넣기"></textarea>
          <div class="row"><span class="status"></span><button class="btn" type="button" id="gptCancel">닫기</button><button class="btn primary" type="button" id="gptSave">답 저장</button></div>
        </div>
        <textarea id="chatInput" placeholder="본문에서 궁금한 부분을 드래그하거나, 바로 질문을 입력하세요. (Ctrl+Enter로 보내기)"></textarea>
        <div class="row">
          <span class="status" id="chatStatus"></span>
          <button class="btn" id="chatStop" type="button" hidden>멈추기</button>
          <button class="btn primary" id="chatSend" type="submit">보내기</button>
        </div>
      </form>
    </aside>
  </div>
</div>

<script id="notes-data" type="application/json">[{"id": "01-cpp-basics", "tab": "C++ 기초", "title": "C++ 기초 학습 노트: 게임 클라이언트 프로그래머용", "md": "# C++ 기초 학습 노트: 게임 클라이언트 프로그래머용\n\n> 이 노트는 UE5 C++로 일하는 실무자가 필기 테스트와 기술 면접을 준비할 때 읽도록 썼습니다.\n> 코드 식별자는 영어 그대로 적고, 개념어는 한국어로 적습니다. 영어 원어는 처음 나올 때 한 번만 함께 적습니다.\n> \"(확인 필요)\" 표시가 붙은 내용은 출처를 다시 확인해야 하는 내용입니다.\n> 검증 기록(2026-11-21): 1~8절의 코드 예제는 모두 MSVC 19.44(VS 2022)에서 `/utf-8 /std:c++20 /W4 /EHsc` 옵션으로 컴파일했습니다. 예제에 한글 주석이 있으므로, `/utf-8` 옵션이 없으면 소스가 코드 페이지 949로 읽혀 4·5·6·8절 예제에서 구문 오류가 납니다. clang과 GCC로는 시험하지 않았습니다. 언리얼 항목은 UE 5.8 엔진 소스를 기준으로 하며, 경로는 `Engine/Source/` 를 기준으로 적었습니다.\n\n## 목차\n\n1. 객체 수명과 RAII\n2. 값 범주와 이동 의미론\n3. 가상 함수와 vtable\n4. 템플릿 기초\n5. 메모리 배치와 캐시\n6. 스마트 포인터와 언리얼의 메모리 관리\n7. 정의되지 않은 동작(UB) 대표 사례\n8. 자료구조·알고리즘 필기 대비 요점\n9. 간격 반복 카드\n10. 필기 대비 문제\n\n---\n\n## 1. 객체 수명과 RAII\n\n### 핵심\n\n#### 지역 객체는 언제 만들어지고 언제 사라지는가\n\n함수 안에서 선언한 지역 객체는 자동 저장 기간(automatic storage duration)을 가집니다. 이런 객체는 선언한 줄에서 만들어지고, 자신이 속한 스코프(scope), 곧 블록(`{ }`)을 벗어날 때 사라집니다.\n\n여러 개를 만들었다면 **만든 순서의 반대로** 사라집니다. 먼저 만든 객체가 나중에 만든 객체보다 오래 살아 있으므로, 나중 객체가 앞 객체에 기대어 동작해도 안전합니다.\n\n#### 멤버와 기반 클래스의 생성 순서\n\n클래스 멤버는 클래스 안에 **선언한 순서대로** 만들어지고, 그 반대 순서로 사라집니다. 생성자의 초기화 목록에 적은 순서는 이 순서에 아무런 영향을 주지 않습니다. 기반 클래스 부분은 멤버보다 먼저 만들어지고, 멤버보다 나중에 사라집니다.\n\n예를 들어 `Part` 를 기반으로 하고 `Weapon` 과 `Armor` 를 멤버로 가진 `Player` 를 만들어 보겠습니다.\n\n```cpp\n#include <cstdio>\n\nstruct Part {\n    const char* Name;\n    explicit Part(const char* n) : Name(n) { std::printf(\"생성: %s\\n\", Name); }\n    ~Part() { std::printf(\"소멸: %s\\n\", Name); }\n};\n\nstruct Player : Part {\n    Part Weapon{\"Weapon\"};\n    Part Armor{\"Armor\"};\n    Player() : Part(\"Player 기반\") { std::puts(\"Player 생성자 본문\"); }\n};\n\nint main() {\n    Player p;\n    std::puts(\"-- main 끝 --\");\n}\n```\n\n위 코드에서 `Player` 객체를 만들면 기반 클래스 부분이 가장 먼저 만들어지고, 이어서 멤버가 선언한 순서대로 만들어집니다. 생성자 본문은 이 모든 일이 끝난 뒤에 실행됩니다. `main` 이 끝나면 정확히 반대 순서로 소멸자가 불립니다.\n\n출력 결과는 다음과 같습니다.\n\n```\n생성: Player 기반\n생성: Weapon\n생성: Armor\nPlayer 생성자 본문\n-- main 끝 --\n소멸: Armor\n소멸: Weapon\n소멸: Player 기반\n```\n\n#### RAII: 정리 코드를 소멸자에 맡기기\n\nRAII(Resource Acquisition Is Initialization, 자원 획득은 초기화)는 자원을 얻는 일을 객체의 생성에, 자원을 돌려주는 일을 객체의 소멸에 묶는 방식입니다. 쉽게 말하면 \"만들 때 열고, 사라질 때 닫는다\"입니다. 여기서 자원은 메모리, 파일, 락 같은 것을 말합니다.\n\n왜 이렇게 할까요? 게임 코드에는 중간에 `return` 하는 경로와 오류 경로가 많습니다. 정리 코드를 경로마다 손으로 쓰면 언젠가 반드시 한 경로를 빠뜨립니다. 소멸자는 블록을 벗어나는 **모든 경로**(정상 종료, 조기 `return`, 예외)에서 자동으로 불리므로, 정리를 빠뜨릴 수가 없습니다.\n\n아래 코드는 파일과 뮤텍스 락을 RAII로 다루는 예입니다.\n\n```cpp\n#include <cstdio>\n#include <mutex>\n\nstruct File {\n    FILE* f;\n    explicit File(const char* path) : f(std::fopen(path, \"rb\")) {}\n    ~File() { if (f) std::fclose(f); }          // 해제를 소멸자에 묶는다\n    File(const File&) = delete;                 // 이중 해제 방지\n    File& operator=(const File&) = delete;\n};\n\nstd::mutex g_Mutex;\n\nbool LoadConfig(const char* path) {\n    std::lock_guard<std::mutex> lock(g_Mutex); // ① 먼저 생성\n    File file(path);                           // ② 나중 생성\n    if (!file.f) return false;                 // 조기 반환: ② → ① 순서로 소멸\n    // ... 읽기 중 예외가 나도 같은 순서로 정리된다\n    return true;\n}\n```\n\n위 코드에서 `File` 은 생성자에서 파일을 열고 소멸자에서 파일을 닫습니다. 복사 생성자와 복사 대입 연산자를 `delete` 로 막은 이유는, 복사본이 생기면 두 객체가 같은 파일을 두 번 닫기 때문입니다.\n\n`LoadConfig` 함수에서는 락 `lock` 이 먼저 만들어지고 `file` 이 나중에 만들어집니다. 파일 열기에 실패해 일찍 `return` 하더라도 `file` 이 먼저 닫히고 그다음에 락이 풀립니다. 읽는 도중 예외가 나도 같은 순서로 정리됩니다.\n\n#### 예외 안전의 세 단계\n\n예외 안전(exception safety)은 함수가 예외를 만났을 때 프로그램 상태를 얼마나 지켜 주는지를 나타내며, 보통 세 단계로 나눕니다.\n\n- 기본 보장: 예외가 나도 자원이 새지 않고, 객체의 불변식이 유지됩니다.\n- 강한 보장: 연산이 실패하면 상태가 연산 전으로 완전히 돌아갑니다.\n- 예외 없음 보장: 함수가 예외를 절대 던지지 않습니다. `noexcept` 로 표시합니다.\n\n#### 정리\n\n지역 객체는 만든 순서의 반대로 사라지고, 클래스는 기반 클래스, 멤버(선언 순서), 생성자 본문의 순서로 만들어집니다. RAII는 이 규칙을 이용해 자원 해제를 소멸자에 맡기는 방식입니다. 그래서 조기 반환이나 예외가 있어도 정리 코드를 빠뜨리지 않습니다.\n\n### 흔한 함정\n\n- 멤버 초기화 목록을 선언 순서와 다른 순서로 써 놓고, 앞에 적은 멤버의 값을 뒤에 적은 멤버가 쓸 수 있다고 착각합니다. 실제 초기화는 선언 순서로 일어나므로, 아직 초기화되지 않은 값을 읽게 됩니다.\n- 소멸자에서 예외를 던집니다. C++11부터 소멸자는 기본적으로 `noexcept` 이므로, 예외가 소멸자 밖으로 빠져나가면 `std::terminate` 가 호출되어 프로그램이 끝납니다.\n- `std::lock_guard<std::mutex>(g_Mutex);` 처럼 이름 없는 임시 객체를 만듭니다. 임시 객체는 그 줄이 끝날 때 바로 사라지므로, 락이 걸리자마자 즉시 풀립니다.\n\n### 면접 질문\n\n1. **RAII 방식이란 무엇이고 왜 쓰나요?**\n   RAII는 자원의 수명을 객체의 수명에 묶는 기법입니다. 생성자에서 자원을 얻고 소멸자에서 자원을 놓습니다. 스코프를 벗어나는 모든 경로, 즉 정상 반환과 조기 반환과 예외에서 소멸자가 자동으로 호출되므로, 해제를 빠뜨리는 실수가 구조적으로 사라집니다. 게임 코드처럼 중간 반환과 오류 경로가 많은 코드에서 특히 효과가 큽니다.\n2. **멤버와 기반 클래스의 생성·소멸 순서는?**\n   생성은 가상 기반 클래스가 가장 먼저이고, 그다음 직접 기반 클래스가 선언 순서대로, 그다음 멤버가 선언 순서대로 만들어지며, 마지막으로 생성자 본문이 실행됩니다. 소멸은 이 순서의 정확한 역순입니다. 초기화 목록에 적은 순서는 이 순서에 영향을 주지 않습니다.\n3. **소멸자에서 예외를 던지면 안 되는 이유는?**\n   예외가 나서 스택을 되감는(stack unwinding) 도중에 또 다른 예외가 소멸자를 빠져나가면 `std::terminate` 가 호출됩니다. 게다가 C++11부터 소멸자는 암묵적으로 `noexcept` 이므로, 스택 되감기 중이 아닌 평상시에도 예외가 빠져나가면 프로그램이 종료됩니다. 그래서 소멸자 안의 실패는 예외 대신 로그나 오류 코드로 처리합니다.\n\n### 실습 과제\n\n- 생성자와 소멸자에서 자기 이름을 출력하는 클래스를 만들고, 멤버 3개와 기반 클래스 1개로 구성합니다. 출력 순서를 먼저 예측한 뒤 실행해서 확인합니다.\n- Compiler Explorer(godbolt.org)에서 위 `LoadConfig` 함수를 `-fexceptions` 옵션으로 컴파일합니다. 예외가 났을 때 정리를 맡는 랜딩 패드(landing pad) 코드가 생기는지 살펴봅니다.\n\n### 더 읽을 곳\n\n- 『A Tour of C++』(Stroustrup)의 자원 관리 장을 읽습니다.\n- cppreference.com의 \"RAII\" 항목과 \"Destructors\" 항목을 읽습니다.\n\n---\n\n## 2. 값 범주와 이동 의미론\n\n### 핵심\n\n#### 값 범주: 식이 가진 두 번째 속성\n\nC++의 모든 식은 타입과 함께 값 범주(value category)를 가집니다. 타입이 \"무엇인가\"를 나타낸다면, 값 범주는 \"그 값을 다시 써도 되는가, 곧 사라지는가\"를 나타냅니다.\n\n- lvalue: 이름이 있고 주소를 얻을 수 있는 식입니다. 예를 들어 변수 `player` 가 lvalue입니다.\n- prvalue: 곧 사라질 임시 값입니다. 예를 들어 `MakeWeapon()` 이 값으로 반환한 결과가 prvalue입니다.\n- xvalue: `std::move` 의 결과처럼 \"이 객체의 자원을 가져가도 된다\"는 표식이 붙은 식입니다.\n\nprvalue와 xvalue를 합쳐 rvalue라고 부릅니다.\n\n#### 이동 의미론: 복사 대신 자원을 넘겨받기\n\n이동 의미론(move semantics)은 객체를 복사하는 대신, 원본이 가진 내부 자원(힙 버퍼 포인터 등)을 새 객체가 넘겨받는 방식입니다. 큰 `std::vector` 나 `std::string` 을 반환할 때와 컨테이너가 재할당할 때의 비용을 크게 줄여 줍니다.\n\n여기서 주의할 점이 있습니다. `std::move` 함수는 이름과 달리 아무것도 옮기지 않습니다. `std::move` 는 인자를 rvalue 참조로 바꾸는 `static_cast` 일 뿐이고, 실제로 자원을 옮기는 일은 이동 생성자와 이동 대입 연산자가 합니다.\n\n#### 0/3/5 규칙\n\n0/3/5 규칙(Rule of 0/3/5)은 특수 멤버 함수를 언제 직접 정의할지 알려 주는 규칙입니다.\n\n- 클래스가 자원을 직접 다루지 않으면 특수 멤버를 하나도 직접 쓰지 않습니다. 이것이 0의 규칙입니다.\n- 소멸자, 복사 생성자, 복사 대입 연산자 중 하나를 직접 썼다면 세 가지를 모두 정의합니다. 이것이 3의 규칙입니다.\n- 이동까지 고려한다면 이동 생성자와 이동 대입 연산자를 더해 다섯 가지를 모두 정의합니다. 이것이 5의 규칙입니다.\n\n#### 완벽 전달과 `std::forward`\n\n`std::forward` 함수는 전달 참조(forwarding reference)로 받은 인자를, 원래의 값 범주를 그대로 유지한 채 다른 함수에 넘깁니다. 전달 참조는 템플릿 매개변수에 붙은 `T&&` 를 말합니다. 이렇게 값 범주를 보존해 넘기는 것을 완벽 전달(perfect forwarding)이라고 합니다.\n\n#### 코드로 보기\n\n아래 `Buffer` 는 힙 메모리를 직접 다루므로 특수 멤버를 직접 정의한 클래스입니다.\n\n```cpp\n#include <utility>\n#include <cstring>\n\nclass Buffer {\n    char*  Data = nullptr;\n    size_t Size = 0;\npublic:\n    explicit Buffer(size_t n) : Data(new char[n]), Size(n) {}\n    ~Buffer() { delete[] Data; }\n    Buffer(const Buffer& o) : Data(new char[o.Size]), Size(o.Size) {\n        std::memcpy(Data, o.Data, Size);\n    }\n    Buffer(Buffer&& o) noexcept                 // noexcept 가 중요(아래 함정)\n        : Data(std::exchange(o.Data, nullptr)), Size(std::exchange(o.Size, 0)) {}\n    Buffer& operator=(Buffer o) noexcept {      // 복사·이동 겸용(copy-and-swap)\n        std::swap(Data, o.Data); std::swap(Size, o.Size);\n        return *this;\n    }\n};\n\ntemplate <typename T, typename... Args>\nT* Make(Args&&... args) {\n    return new T(std::forward<Args>(args)...);  // 값 범주 보존\n}\n```\n\n위 코드에서 복사 생성자는 새 버퍼를 할당하고 내용을 그대로 복사합니다. 반면 이동 생성자는 원본의 포인터를 그대로 가져오고, `std::exchange` 로 원본의 포인터를 `nullptr` 로 바꿉니다. 그래서 원본이 나중에 소멸해도 같은 메모리를 두 번 해제하지 않습니다.\n\n대입 연산자는 매개변수를 값으로 받습니다. 호출하는 쪽에서 lvalue를 넘기면 매개변수가 복사로 만들어지고, rvalue를 넘기면 이동으로 만들어집니다. 그다음 내용을 맞바꾸기만 하면 되므로, 하나의 함수로 복사 대입과 이동 대입을 모두 처리합니다. 이 방식을 copy-and-swap이라고 합니다.\n\n`Make` 함수는 받은 인자를 `std::forward` 로 `T` 의 생성자에 그대로 넘깁니다. lvalue로 받은 인자는 lvalue로, rvalue로 받은 인자는 rvalue로 넘어갑니다.\n\n#### 정리\n\n값 범주는 식을 다시 써도 되는지를 나타내고, 이동 의미론은 rvalue에서 자원을 넘겨받아 복사 비용을 줄입니다. `std::move` 는 캐스팅일 뿐이고 실제 이동은 이동 생성자와 이동 대입 연산자가 합니다. 템플릿에서 받은 인자를 그대로 넘길 때는 `std::forward` 를 씁니다.\n\n### 흔한 함정\n\n- 이동 생성자에 `noexcept` 를 빠뜨립니다. 그러면 `std::vector` 는 재할당할 때 강한 예외 보장을 지키기 위해 이동 대신 복사를 고릅니다. 이 선택은 `std::move_if_noexcept` 가 합니다.\n- `const` 객체에 `std::move` 를 씁니다. 결과가 `const T&&` 가 되어 이동 생성자와 맞지 않으므로, 아무 경고 없이 복사가 일어납니다.\n\n  ```cpp\n  #include <cstdio>\n  #include <utility>\n\n  struct Texture {\n      Texture() = default;\n      Texture(const Texture&) { std::puts(\"복사\"); }\n      Texture(Texture&&) noexcept { std::puts(\"이동\"); }\n  };\n\n  int main() {\n      Texture a;\n      const Texture b;\n      Texture c = std::move(a);  // 이동\n      Texture d = std::move(b);  // const Texture&& 이므로 복사\n  }\n  ```\n\n  위 코드에서 `a` 는 이동되지만, `const` 인 `b` 는 `std::move` 를 거쳐도 복사 생성자가 불립니다. 출력 결과는 다음과 같습니다.\n\n  ```\n  이동\n  복사\n  ```\n\n- 지역 변수를 반환하면서 `return std::move(local);` 이라고 씁니다. 이렇게 쓰면 반환값 최적화(RVO/NRVO)가 막힐 수 있습니다. 지역 변수를 반환할 때는 그냥 `return local;` 이라고 씁니다.\n\n### 면접 질문\n\n1. **`std::move` 함수는 무엇을 하나요?**\n   `std::move` 는 인자를 rvalue 참조로 캐스팅할 뿐이고, 런타임에 하는 일은 없습니다. 캐스팅된 결과가 오버로드 해석에서 이동 생성자나 이동 대입 연산자를 선택하게 만들고, 실제 이동은 그 함수들 안에서 일어납니다. 그래서 이동 생성자가 없거나 객체가 `const` 이면 `std::move` 를 써도 복사가 일어납니다.\n2. **이동된 뒤의 객체는 어떤 상태인가요?**\n   표준 라이브러리 타입은 이동된 뒤 \"유효하지만 지정되지 않은 상태\"가 됩니다. 이 객체를 소멸시키거나 새 값을 대입하는 것은 안전합니다. 하지만 값을 읽어서 특정한 내용을 기대하면 안 됩니다.\n3. **`std::move` 와 `std::forward` 의 차이는?**\n   `std::move` 는 인자를 무조건 rvalue로 캐스팅합니다. `std::forward` 는 템플릿 인자가 lvalue 참조로 추론되었으면 lvalue로, 그렇지 않으면 rvalue로 캐스팅합니다. 그래서 rvalue 참조로 받은 인자에는 `std::move` 를 쓰고, 전달 참조로 받은 인자에는 `std::forward` 를 씁니다.\n\n### 실습 과제\n\n- 복사 생성자와 이동 생성자에서 로그를 찍는 클래스를 만들어 `std::vector` 에 넣고 `push_back` 을 여러 번 반복합니다. 이동 생성자에 `noexcept` 를 붙였을 때와 뺐을 때, 재할당 중에 어떤 생성자가 불리는지 비교합니다.\n- Compiler Explorer에서 `return local;` 과 `return std::move(local);` 의 어셈블리를 비교해 복사 생략이 일어나는지 확인합니다. GCC가 내는 `-Wpessimizing-move` 경고도 함께 확인합니다.\n\n### 더 읽을 곳\n\n- 『Effective Modern C++』(Scott Meyers)의 항목 17(특수 멤버 함수 생성 규칙), 항목 23(`std::move` 와 `std::forward`), 항목 24(전달 참조와 rvalue 참조 구분), 항목 25를 읽습니다.\n- cppreference.com의 \"Value categories\", \"Move constructors\", \"std::forward\" 항목을 읽습니다.\n\n---\n\n## 3. 가상 함수와 vtable\n\n### 핵심\n\n#### 가상 함수와 동적 디스패치\n\n가상 함수(virtual function)는 프로그램이 실행되는 동안 실제 객체 타입에 맞는 구현을 골라 호출하는 기능입니다. 이렇게 런타임에 호출 대상을 고르는 것을 동적 디스패치(dynamic dispatch)라고 합니다. 예를 들어 `Enemy*` 로 `Tick` 을 부르면, 그 포인터가 실제로 가리키는 적이 `Goblin` 인지 `Dragon` 인지에 따라 다른 `Tick` 이 실행됩니다.\n\nC++ 표준은 동적 디스패치를 어떻게 구현할지 정하지 않습니다. 하지만 주요 컴파일러는 모두 같은 방식을 씁니다. 클래스마다 가상 함수의 주소를 모은 표인 가상 함수 표(vtable)를 하나 두고, 객체마다 그 표를 가리키는 포인터(vptr)를 하나씩 둡니다.\n\n#### 가상 함수 호출의 비용\n\n가상 함수에는 세 가지 비용이 있습니다.\n\n- 객체마다 vptr이 들어가므로 객체 크기가 포인터 하나만큼 커집니다.\n- 호출할 때마다 vptr을 읽고, 표에서 함수 주소를 읽는 간접 참조가 두 번 일어납니다. 순서는 vptr → 표 → 함수입니다.\n- 컴파일 시점에 호출 대상을 모르므로 **인라인할 수 없습니다.** 세 가지 중 이 비용이 가장 큽니다.\n\n분기 예측이 맞으면 호출 하나하나는 싸게 끝납니다. 하지만 수천 개의 객체를 매 프레임 순회하면 캐시 미스와 인라인하지 못한 비용이 쌓여 눈에 띄게 느려집니다.\n\n#### 가상 소멸자\n\n다형적으로 쓰는 기반 클래스는 소멸자를 `virtual` 로 둡니다. 그렇지 않으면 기반 클래스 포인터로 파생 객체를 `delete` 할 때 정의되지 않은 동작이 됩니다.\n\n#### 생성자와 소멸자 안의 가상 호출\n\n생성자나 소멸자 안에서 가상 함수를 부르면 **지금 생성 중이거나 소멸 중인 클래스의 버전**이 불립니다. 기반 클래스의 생성자가 실행될 때는 파생 클래스 부분이 아직 만들어지지 않았고, 기반 클래스의 소멸자가 실행될 때는 파생 클래스 부분이 이미 사라졌기 때문입니다.\n\n#### `override` 와 `final`\n\n`override` 지정자를 붙이면, 시그니처가 기반 클래스의 가상 함수와 맞지 않을 때 컴파일 오류가 납니다. `final` 지정자는 그 함수를 더 이상 재정의하지 못하게 하거나, 그 클래스를 더 이상 상속하지 못하게 막습니다. 컴파일러는 `final` 을 보고 가상 호출을 직접 호출로 바꿀 수 있으므로, `final` 은 탈가상화(devirtualization)의 단서가 됩니다.\n\n#### 코드로 보기\n\n```cpp\n#include <cstdio>\n\nstruct Base {\n    Base() { Hello(); }                 // Base::Hello 가 불린다\n    virtual ~Base() = default;          // 다형적 삭제에 필요\n    virtual void Hello() const { std::puts(\"Base\"); }\n    virtual void Tick(float dt) {}\n};\n\nstruct Derived final : Base {\n    void Hello() const override { std::puts(\"Derived\"); }\n    void Tick(float dt) override {}\n    // void Tick(double dt) override;   // 오류: 재정의할 대상이 없음\n};\n\nvoid Run(Base* b) { b->Tick(0.016f); }  // 간접 호출\nvoid RunD(Derived* d) { d->Tick(0.016f); } // final 이라 직접 호출 가능\n\nint main() {\n    Base* p = new Derived();            // \"Base\" 출력\n    p->Hello();                         // \"Derived\" 출력\n    delete p;                           // 가상 소멸자 덕분에 안전\n}\n```\n\n위 코드에서 `new Derived()` 를 실행하면 먼저 `Base` 의 생성자가 실행됩니다. 이때는 `Derived` 부분이 아직 없으므로 `Hello()` 는 `Base::Hello` 를 부릅니다. 객체가 다 만들어진 뒤에 `p->Hello()` 를 부르면 그제야 `Derived::Hello` 가 불립니다.\n\n주석으로 막아 둔 `Tick(double dt) override` 는 기반 클래스의 `Tick(float)` 과 매개변수 타입이 다르므로, 주석을 풀면 컴파일 오류가 납니다. `Run` 은 `Base*` 를 받으므로 간접 호출을 해야 하지만, `RunD` 는 `final` 클래스인 `Derived*` 를 받으므로 컴파일러가 직접 호출로 바꿀 수 있습니다. `Base` 의 소멸자가 가상이므로 `delete p` 도 안전합니다.\n\n출력 결과는 다음과 같습니다.\n\n```\nBase\nDerived\n```\n\n#### 정리\n\n가상 함수는 vtable과 vptr을 거쳐 런타임에 구현을 고르며, 가장 큰 비용은 인라인이 막히는 것입니다. 다형적 기반 클래스에는 가상 소멸자를 두고, 생성자와 소멸자 안의 가상 호출은 현재 클래스의 버전으로 불린다는 점을 기억합니다. `override` 는 실수를 잡아 주고, `final` 은 탈가상화를 돕습니다.\n\n### 흔한 함정\n\n- 기반 클래스의 소멸자를 가상으로 두지 않은 채 기반 클래스 포인터로 삭제합니다. 이것은 정의되지 않은 동작이며, 실무에서는 파생 클래스 멤버가 새는 현상으로 보이는 경우가 많습니다.\n- 생성자에서 순수 가상 함수를 직접 또는 다른 함수를 거쳐 호출합니다. 이것은 정의되지 않은 동작이며, 흔히 \"pure virtual function call\" 런타임 오류로 나타납니다.\n- 매개변수 타입이나 `const` 한정자를 조금 다르게 써서, 재정의가 아니라 새 함수를 만들어 버립니다. `override` 지정자를 습관처럼 붙이면 이 실수를 컴파일 단계에서 막을 수 있습니다.\n\n### 면접 질문\n\n1. **가상 함수 호출이 일반 호출보다 느린 이유는?**\n   가상 함수를 호출하려면 vptr을 읽고 다시 표에서 함수 주소를 읽는 간접 참조를 거쳐야 합니다. 또 호출 대상을 컴파일 시점에 알 수 없으므로 인라인 최적화가 막힙니다. 표가 캐시에 없으면 메모리 접근 비용도 더해집니다. 호출 하나는 싸더라도 많은 객체를 매 프레임 순회하면 이 비용이 쌓입니다.\n2. **생성자에서 가상 함수를 부르면 어떻게 되나요?**\n   생성 중에는 객체의 동적 타입이 지금 생성 중인 클래스로 취급되므로, 그 클래스의 구현이 불립니다. 파생 클래스 부분은 아직 만들어지지 않았기 때문입니다. 그 함수가 순수 가상 함수라면 정의되지 않은 동작입니다. 언리얼에서 생성자 대신 `BeginPlay` 같은 수명주기 함수에서 초기화하는 이유와도 이어집니다.\n3. **`final` 지정자는 성능에 어떤 도움을 주나요?**\n   `final` 을 붙이면 더 파생된 재정의가 없다는 것을 컴파일러가 알게 됩니다. 그래서 정적 타입이 그 클래스일 때 가상 호출을 직접 호출로 바꾸고, 더 나아가 인라인할 수 있습니다.\n\n### 실습 과제\n\n- Compiler Explorer에서 위 `Run` 과 `RunD` 함수를 `-O2` 옵션으로 컴파일합니다. `call [rax+...]` 형태의 간접 호출과 직접 호출이 어떻게 다른지 확인합니다.\n- 같은 연산을 두 가지 방식으로 100만 회 실행하는 작은 벤치마크를 만들어 차이를 잽니다. 하나는 가상 함수를 가진 객체 배열이고, 다른 하나는 타입별로 나눈 배열과 일반 함수입니다.\n\n### 더 읽을 곳\n\n- 『Effective Modern C++』의 항목 12(재정의 함수에 `override` 선언)를 읽습니다.\n- 『Game Engine Architecture』(Jason Gregory)에서 C++ 언어 기초와 메모리 배치 부분을 읽습니다.\n- cppreference.com의 \"virtual function specifier\", \"override specifier\", \"final specifier\" 항목을 읽습니다.\n\n---\n\n## 4. 템플릿 기초\n\n### 핵심\n\n#### 템플릿과 인스턴스화\n\n템플릿(template)은 타입이나 값을 매개변수로 받는 코드 틀입니다. 템플릿 자체는 코드가 아니며, 어떤 타입으로 사용하는 지점에서 인스턴스화(instantiation)되어 그 타입에 맞는 실제 코드가 만들어집니다. 그래서 런타임 비용은 없지만, 그 대신 컴파일 시간과 바이너리 크기가 늘어납니다.\n\n함수 템플릿은 호출할 때 넘긴 인자에서 타입을 추론합니다. 클래스 템플릿도 C++17부터는 생성자 인자에서 타입을 추론할 수 있으며, 이 기능을 CTAD라고 부릅니다.\n\n#### 특수화\n\n특수화(specialization)는 특정 타입에 대해 템플릿의 구현을 따로 정해 주는 기능입니다. 모든 템플릿 매개변수를 정해 주는 전체 특수화는 함수 템플릿과 클래스 템플릿에서 모두 쓸 수 있습니다. 하지만 일부만 정해 주는 부분 특수화는 클래스 템플릿(과 변수 템플릿)에서만 쓸 수 있습니다. 함수에서는 부분 특수화 대신 오버로딩을 씁니다.\n\n#### 템플릿을 헤더에 두는 이유\n\n템플릿을 인스턴스화하려면, 그 템플릿을 사용하는 번역 단위(translation unit)에서 정의 전체가 보여야 합니다. 그래서 템플릿 정의는 보통 헤더에 둡니다. 정의를 `.cpp` 파일에 두려면, 필요한 타입마다 명시적 인스턴스화를 적어 주어야 합니다.\n\n#### `constexpr` 와 `if constexpr`\n\n`constexpr` 키워드는 함수나 변수를 컴파일 시간에 평가하는 것이 **가능하다**는 뜻입니다. 반드시 컴파일 시간에 평가한다는 뜻은 아닙니다.\n\n`if constexpr` 구문(C++17)은 조건이 거짓인 분기를 인스턴스화하지 않습니다. 그래서 타입에 따라 전혀 다른 코드를 한 함수 안에 나누어 쓸 수 있습니다.\n\n#### 코드로 보기\n\n```cpp\n#include <type_traits>\n#include <cstdio>\n\ntemplate <typename T>\nconstexpr T Square(T x) { return x * x; }\nstatic_assert(Square(4) == 16);        // 컴파일 시간에 검사\n\ntemplate <typename T>\nstruct TypeName { static const char* Get() { return \"unknown\"; } };\ntemplate <>                            // 전체 특수화\nstruct TypeName<int> { static const char* Get() { return \"int\"; } };\ntemplate <typename T>                  // 부분 특수화(포인터)\nstruct TypeName<T*> { static const char* Get() { return \"pointer\"; } };\n\ntemplate <typename T>\nvoid Print(const T& v) {\n    if constexpr (std::is_integral_v<T>)       std::printf(\"%lld\\n\", (long long)v);\n    else if constexpr (std::is_floating_point_v<T>) std::printf(\"%f\\n\", (double)v);\n    else static_assert(sizeof(T) == 0, \"지원하지 않는 타입\"); // 실제 사용 시에만 오류\n}\n```\n\n위 코드에서 `Square` 는 `constexpr` 함수이므로, `static_assert` 처럼 상수가 필요한 자리에서 컴파일 시간에 계산됩니다. `TypeName` 은 기본 템플릿이 `\"unknown\"` 을 돌려주고, `int` 에 대한 전체 특수화와 모든 포인터 타입에 대한 부분 특수화가 각각 다른 문자열을 돌려줍니다.\n\n`Print` 는 `if constexpr` 로 정수와 실수를 나누어 처리합니다. 정수도 실수도 아닌 타입으로 `Print` 를 인스턴스화하면 마지막 분기의 `static_assert` 가 컴파일 오류를 냅니다.\n\n위 코드에 다음 `main` 을 붙여 실행해 보겠습니다.\n\n```cpp\nint main() {\n    std::puts(TypeName<int>::Get());\n    std::puts(TypeName<float*>::Get());\n    std::puts(TypeName<double>::Get());\n    Print(Square(3));\n    Print(Square(1.5f));\n}\n```\n\n`int` 는 전체 특수화를, `float*` 는 포인터 부분 특수화를, `double` 은 기본 템플릿을 고릅니다. `Square(3)` 은 `int` 이므로 정수 분기로, `Square(1.5f)` 는 `float` 이므로 실수 분기로 갑니다.\n\n출력 결과는 다음과 같습니다.\n\n```\nint\npointer\nunknown\n9\n2.250000\n```\n\n#### 정리\n\n템플릿은 사용 지점에서 인스턴스화되므로 런타임 비용이 없는 대신 컴파일 시간과 바이너리 크기가 늘어납니다. 부분 특수화는 클래스 템플릿에서만 가능하고, 함수는 오버로딩으로 대신합니다. 템플릿 정의는 사용하는 곳에서 보여야 하므로 보통 헤더에 둡니다.\n\n### 흔한 함정\n\n- 템플릿 정의를 `.cpp` 파일에만 두고 다른 파일에서 사용하다가 링크 오류(undefined reference)를 만납니다.\n- 함수 템플릿의 전체 특수화와 오버로드가 섞여 있으면, 어느 쪽이 선택될지 예상과 다를 수 있습니다. 함수에서는 특수화보다 오버로드를 먼저 고려합니다.\n- `constexpr` 함수가 항상 컴파일 시간에 계산된다고 착각합니다. 컴파일 시간 계산은 상수 식이 필요한 문맥에서만 보장됩니다. 컴파일 시간 계산을 강제하려면 C++20의 `consteval` 키워드를 씁니다.\n- 위 코드의 `static_assert(sizeof(T) == 0, ...)` 패턴은, 템플릿 안에 `static_assert(false)` 를 직접 쓰면 안 되던 시절의 우회책입니다. 조건이 `T` 에 종속되어 있어 인스턴스화될 때만 평가되므로 실제로는 잘 동작합니다. 하지만 표준에 따르면 이것은 \"어떤 `T` 에도 거짓인 템플릿\"이어서, 진단이 필요 없는 ill-formed 코드였습니다. 컴파일러가 잡아내지 않았을 뿐입니다.\n\n  이 제약은 P2593R1로 풀렸고, P2593R1은 결함 보고 CWG2518에 합쳐졌습니다. 결함 보고이므로 C++23 전용이 아니라 이전 표준 모드에도 적용됩니다. GCC 13, Clang 17, MSVC 19.40부터는 템플릿 안에 `static_assert(false, \"...\")` 를 직접 쓸 수 있습니다. MSVC 19.44에서는 `/std:c++17` 로도 통과하는 것을 확인했습니다.\n\n  구형 컴파일러를 지원해야 한다면 `sizeof(T) == 0` 이나 `always_false<T>` 가 여전히 필요합니다. 출처는 open-std.org의 P2593R1 문서와, cppreference \"C++23 compiler support\" 페이지의 CWG2518 행입니다.\n\n### 면접 질문\n\n1. **템플릿을 헤더에 두는 이유는?**\n   컴파일러가 템플릿을 사용하는 지점에서 정의를 보고 그 타입에 맞는 코드를 만들어야 하기 때문입니다. 정의가 다른 번역 단위에만 있으면 사용하는 쪽에서 인스턴스화가 일어나지 않아 링크 오류가 납니다. 정의를 `.cpp` 에 두고 싶다면 필요한 타입마다 명시적 인스턴스화를 적어 우회할 수 있습니다.\n2. **`if constexpr` 구문과 일반 `if` 문의 차이는?**\n   일반 `if` 문은 조건과 상관없이 양쪽 분기가 모두 컴파일될 수 있어야 합니다. 반면 `if constexpr` 구문은 템플릿 안에서 버려진 분기를 인스턴스화하지 않습니다. 그래서 타입 특성에 따라 그 타입에만 있는 멤버를 호출하는 코드를 한 함수 안에 쓸 수 있습니다.\n3. **템플릿과 가상 함수 중 무엇을 고르나요?**\n   타입이 컴파일 시간에 정해진다면 템플릿, 곧 정적 다형성을 써서 인라인과 최적화의 이점을 얻습니다. 런타임에 타입이 바뀌거나, 서로 다른 타입의 객체를 한 컨테이너에 담아야 한다면 가상 함수를 씁니다. 다만 템플릿은 타입마다 코드가 생기므로 코드 팽창과 컴파일 시간 비용이 있다는 점도 함께 고려합니다.\n\n### 실습 과제\n\n- Compiler Explorer에서 `Square<int>`, `Square<float>`, `Square<double>` 를 각각 호출해 어떤 함수 심볼이 생기는지 확인합니다. 그리고 `-O2` 옵션에서 호출이 상수로 접히는지 봅니다.\n- 템플릿 정의를 `.cpp` 파일로 옮겨 링크 오류를 재현합니다. 그다음 `template int Square<int>(int);` 라는 명시적 인스턴스화를 적어 오류를 고칩니다.\n\n### 더 읽을 곳\n\n- 『A Tour of C++』의 템플릿 장과 개념(concepts) 장을 읽습니다.\n- 『Effective Modern C++』의 항목 15(`constexpr` 사용)를 읽습니다.\n- cppreference.com의 \"Templates\", \"Partial template specialization\", \"if statement\" 항목을 읽습니다.\n\n---\n\n## 5. 메모리 배치와 캐시\n\n### 핵심\n\n#### 스택과 힙\n\n스택(stack)은 함수가 호출될 때마다 지역 변수를 위한 공간을 잡는 메모리 영역입니다. 할당할 때 스택 포인터만 움직이면 되므로 비용이 매우 적습니다. 대신 크기가 작아서 스레드 하나에 수 MB 정도이고, 정확한 크기는 플랫폼마다 다릅니다.\n\n힙(heap)은 실행 중에 필요한 만큼 요청해서 받아 쓰는 메모리 영역입니다. 할당할 때마다 할당기를 호출하는 비용이 들고, 할당과 해제를 반복하면 단편화가 생깁니다. 그래서 게임 루프의 핫패스(매 프레임 실행되는 코드)에서는 메모리를 미리 확보해 두거나 풀(pool)을 써서 힙 할당을 피합니다.\n\n#### 정렬과 패딩\n\n정렬(alignment)은 타입마다 정해진 \"이 타입의 값은 몇의 배수 주소에 놓여야 한다\"는 요구입니다. 이를 자연 정렬 요구라고 부릅니다. 예를 들어 `int32_t` 는 보통 4의 배수 주소에 놓입니다.\n\n컴파일러는 이 요구를 맞추려고 멤버 사이와 구조체 끝에 빈 바이트를 넣습니다. 이 빈 바이트를 패딩(padding)이라고 하며, `sizeof` 연산 결과에는 패딩이 포함됩니다. 다음 코드로 확인해 보겠습니다.\n\n```cpp\n#include <cstdio>\n#include <cstdint>\n#include <cstddef>\n\nstruct Bad  { char a; int32_t b; char c; };\nstruct Good { int32_t b; char a; char c; };\n\nint main() {\n    std::printf(\"Bad : size %zu, b at %zu, c at %zu\\n\",\n                sizeof(Bad), offsetof(Bad, b), offsetof(Bad, c));\n    std::printf(\"Good: size %zu, a at %zu, c at %zu\\n\",\n                sizeof(Good), offsetof(Good, a), offsetof(Good, c));\n}\n```\n\n위 코드에서 `Bad` 는 `char a` 뒤에 3바이트 패딩이 들어가서 `b` 가 4번 위치에서 시작합니다. `c` 뒤에도 3바이트의 끝 패딩이 붙어 전체 크기가 12바이트가 됩니다. `Good` 은 큰 멤버 `b` 를 먼저 두었으므로 `a` 와 `c` 가 바로 이어지고, 끝 패딩 2바이트만 붙어 8바이트가 됩니다.\n\n출력 결과는 다음과 같습니다(MSVC, x64).\n\n```\nBad : size 12, b at 4, c at 8\nGood: size 8, a at 4, c at 5\n```\n\n끝 패딩은 왜 필요할까요? 구조체를 배열로 늘어놓으면 다음 원소도 정렬 경계에서 시작해야 하기 때문입니다. 정리하면, 멤버를 정렬 요구가 큰 것부터 배치하면 패딩이 줄어듭니다.\n\n#### 캐시 라인\n\n캐시 라인(cache line)은 메모리와 CPU 캐시 사이에서 데이터가 오가는 최소 단위입니다. 일반적인 x86-64 CPU에서는 64바이트입니다. 쉽게 말하면 변수 하나만 읽어도 그 변수가 속한 64바이트 묶음 전체가 캐시로 들어옵니다.\n\n하지만 모든 플랫폼이 64바이트인 것은 아닙니다. Apple Silicon(M1)에서는 macOS가 `sysctl hw.cachelinesize` 값을 128로 보고합니다. 다만 코어별 L1 캐시의 라인은 64바이트라는 보고도 있어서, 캐시 수준마다 크기가 다를 수 있습니다. 이 내용의 1차 자료인 Apple 최적화 가이드는 확인하지 못했습니다.\n\nApple 문서도 이 값을 하드코딩하지 말고 `sysctl` 로 조회하라고 권합니다. 그래서 여러 플랫폼으로 옮길 코드에서는 `std::hardware_destructive_interference_size` 상수를 쓰거나 플랫폼에 값을 조회합니다.\n\n#### 구조체 배열(AoS)과 배열 구조체(SoA)\n\n구조체 배열(AoS, Array of Structures)은 개체 하나의 필드를 모두 구조체 하나로 묶고, 그 구조체를 배열로 늘어놓는 방식입니다. 배열 구조체(SoA, Structure of Arrays)는 필드마다 따로 배열을 두는 방식입니다.\n\n예를 들어 많은 적의 위치만 갱신하는 루프를 생각해 보겠습니다. AoS 방식에서는 위치를 읽을 때 체력과 이름까지 같은 캐시 라인에 실려 와서 캐시 공간이 낭비됩니다. SoA 방식에서는 위치 배열만 읽으므로 캐시 라인이 필요한 데이터로 꽉 찹니다. 연속된 값에 같은 연산을 적용하므로 SIMD 명령을 쓰기에도 유리합니다.\n\n반대로 개체 하나의 여러 필드를 함께 다루는 일이 많으면 AoS 방식이 편합니다. 아래 \"짧은 코드 예\"의 `EnemyAoS` 와 `EnemiesSoA` 가 두 방식을 보여 줍니다.\n\n#### 거짓 공유\n\n거짓 공유(false sharing)는 서로 다른 스레드가 **같은 캐시 라인 안의 서로 다른 변수**에 쓸 때 생기는 성능 저하입니다. 두 스레드가 논리적으로 공유하는 데이터는 없습니다. 하지만 캐시는 라인 단위로 일관성을 맞추므로, 한 스레드가 쓸 때마다 다른 코어에 있는 같은 라인이 무효화됩니다. 이 캐시 일관성 트래픽 때문에 성능이 떨어집니다.\n\n해결 방법은 스레드별 데이터를 캐시 라인 경계로 띄워 놓는 것입니다. 아래 코드의 `alignas(64)` 를 붙인 `PerThreadCounter` 가 그 예입니다.\n\n#### 정리\n\n스택 할당은 싸고 힙 할당은 비싸므로, 핫패스에서는 힙 할당을 미리 끝내 둡니다. 구조체 크기에는 패딩이 포함되며, 큰 멤버부터 배치하면 패딩이 줄어듭니다. 캐시는 라인 단위로 움직이므로, 데이터를 접근 패턴에 맞게 배치하고(AoS와 SoA) 스레드별 데이터는 라인 경계로 나눕니다.\n\n### 짧은 코드 예\n\n```cpp\n#include <cstdint>\n#include <new>      // std::hardware_destructive_interference_size (C++17)\n\nstruct Bad  { char a; int32_t b; char c; };   // 흔히 12바이트 (1+3패딩+4+1+3패딩)\nstruct Good { int32_t b; char a; char c; };   // 흔히 8바이트\nstatic_assert(alignof(Bad) == alignof(int32_t));\n\n// AoS: 위치만 갱신해도 체력과 이름까지 캐시에 끌려온다\nstruct EnemyAoS { float X, Y, Z; float Health; char Name[16]; };\n\n// SoA: 위치 갱신 루프는 위치 배열만 읽는다\nstruct EnemiesSoA {\n    float* X; float* Y; float* Z;\n    float* Health;\n};\n\n// 거짓 공유 방지: 스레드별 카운터를 캐시 라인 단위로 분리한다\n// 64는 x86-64를 가정한 값이다. 이식하려면 std::hardware_destructive_interference_size 를 쓴다\nstruct alignas(64) PerThreadCounter { uint64_t Value; };   // MSVC는 C4324(정렬 패딩) 경고를 내지만 의도한 패딩이다\n```\n\n위 코드에서 `static_assert` 는 `Bad` 의 정렬이 가장 큰 멤버인 `int32_t` 의 정렬과 같다는 것을 컴파일할 때 확인합니다. `PerThreadCounter` 는 `alignas(64)` 때문에 원소 하나가 캐시 라인 하나를 차지하므로, 배열로 만들어 스레드마다 한 칸씩 나눠 주면 거짓 공유가 생기지 않습니다.\n\n### 흔한 함정\n\n- 구조체 크기를 멤버 크기의 합으로 계산합니다. 실제로는 패딩과 끝 정렬 때문에 더 큽니다. 끝 정렬은 배열에서 다음 원소가 정렬 경계에서 시작하도록 붙는 패딩입니다. 정확한 크기는 구현 정의이므로 `static_assert` 로 고정해 둡니다.\n- 포인터를 따라가는 연결 리스트나 트리를 매 프레임 순회합니다. 복잡도가 같아도 캐시 미스 때문에 연속 배열보다 몇 배 느릴 수 있습니다.\n- `std::hardware_destructive_interference_size` 상수(`<new>`, C++17)를 어디서나 쓸 수 있다고 가정합니다. 이 상수는 지원이 늦게 시작되었습니다. MSVC STL은 19.11, libstdc++는 12(GCC 12), libc++는 19부터 지원하며, libc++ 15는 부분 지원입니다.\n  - 값은 구현 정의입니다. MSVC는 x86, x64, ARM64에서 64로 고정되어 있고, GCC는 `-mtune` 설정에 따라 값이 달라집니다.\n  - 그래서 GCC에서는 이 값을 헤더나 구조체 배치에 노출하면 번역 단위끼리 ABI가 어긋날 수 있습니다. GCC는 이를 알리는 `-Winterference-size` 경고를 기본으로 켜 둡니다.\n  - 기능 검사 매크로는 `__cpp_lib_hardware_interference_size` 입니다.\n  - 출처: cppreference \"C++17 compiler support\", GCC 12 changes, GCC Warning Options, microsoft/STL `stl/inc/new`.\n\n### 면접 질문\n\n1. **구조체에 패딩이 생기는 이유와 줄이는 방법은 무엇인가요?**\n   CPU는 정렬된 주소에서 값을 효율적으로 읽고, 일부 아키텍처는 정렬된 주소에서만 읽을 수 있습니다. 그래서 컴파일러는 각 멤버를 정렬 경계에 맞추려고 멤버 사이와 구조체 끝에 패딩을 넣습니다. 끝 패딩은 구조체를 배열로 놓았을 때 다음 원소도 정렬되게 하려는 것입니다. 패딩을 줄이려면 멤버를 정렬 요구가 큰 순서로 배치합니다.\n2. **AoS와 SoA 중 게임에서는 무엇을 쓰나요?**\n   파티클이나 군중 이동처럼 많은 개체에 같은 연산을 일괄로 하는 시스템에는 SoA 방식이 캐시와 SIMD 측면에서 유리합니다. 개체 하나의 여러 필드를 함께 다루는 로직에는 AoS 방식이 단순합니다. 결국 접근 패턴을 보고 고르며, 한 프로그램 안에서 두 방식을 섞어 쓰기도 합니다.\n3. **거짓 공유란 무엇인가요?**\n   서로 다른 코어가 같은 캐시 라인 안의 서로 다른 변수를 갱신할 때, 그 라인 전체가 코어 사이를 계속 오가며 무효화되는 현상입니다. 논리적으로 공유하는 데이터가 없는데도 성능이 떨어지기 때문에 \"거짓\" 공유라고 부릅니다. 각 변수를 캐시 라인 크기로 정렬하거나 패딩을 넣어 서로 다른 라인에 두는 방법으로 해결합니다.\n\n### 실습 과제\n\n- 여러 구조체의 `sizeof`, `alignof`, `offsetof` 값을 출력해서 미리 예측한 값과 비교합니다.\n- 개체 100만 개의 위치만 갱신하는 루프를 AoS 방식과 SoA 방식으로 각각 작성하고 시간을 잽니다. 이어서 스레드 4개가 서로 붙어 있는 `uint64_t` 카운터를 증가시키는 경우와, 카운터를 `alignas(64)` 로 분리한 경우의 시간을 비교합니다.\n\n### 더 읽을 곳\n\n- 『Game Engine Architecture』(Jason Gregory): 메모리 관리, 캐시, 병렬 처리 관련 장\n- cppreference.com: \"alignas specifier\", \"alignof operator\", \"std::hardware_destructive_interference_size\"\n\n---\n\n## 6. 스마트 포인터와 언리얼의 메모리 관리\n\n### 핵심\n\n#### `std::unique_ptr`: 단독 소유\n\n`std::unique_ptr` 는 객체를 혼자 소유한다는 뜻을 표현하는 스마트 포인터입니다. 복사할 수 없고 이동만 할 수 있으므로, 소유자가 언제나 하나뿐입니다. 기본 삭제자를 쓰면 크기와 비용이 일반 포인터와 거의 같습니다.\n\n그래서 소유권이 필요할 때 가장 먼저 고르는 기본 선택지입니다. 예를 들어 `Weapon` 이 자기 탄창 객체를 혼자 가진다면 `std::unique_ptr` 로 충분합니다.\n\n#### `std::shared_ptr`: 공동 소유와 제어 블록\n\n`std::shared_ptr` 는 여러 소유자가 객체를 함께 소유한다는 뜻을 표현합니다. 이를 위해 객체와 별도로 **제어 블록(control block)**을 둡니다. 제어 블록에는 강한 참조 수, 약한 참조 수, 삭제자, 할당기가 들어 있습니다.\n\n`shared_ptr` 를 복사하거나 없앨 때마다 참조 수가 바뀌는데, 이 증감은 원자적 연산입니다. 여러 스레드에서 안전하게 쓰려는 장치이지만 그만큼 비용이 듭니다. `std::make_shared` 함수는 객체와 제어 블록을 한 번의 할당에 함께 담습니다.\n\n#### `std::weak_ptr`: 소유하지 않고 관찰하기\n\n`std::weak_ptr` 는 객체를 소유하지 않고 관찰만 하는 포인터입니다. 객체를 쓰려면 `lock()` 을 호출하고, 객체가 아직 살아 있으면 `shared_ptr` 를 얻습니다. 다음 코드는 적을 조준 대상으로 관찰하는 예입니다.\n\n```cpp\n#include <cstdio>\n#include <memory>\n\nstruct Enemy { ~Enemy() { std::puts(\"Enemy destroyed\"); } };\n\nint main() {\n    std::weak_ptr<Enemy> target;\n    {\n        auto enemy = std::make_shared<Enemy>();\n        target = enemy;\n        if (auto p = target.lock()) std::puts(\"target alive\");\n    }\n    if (!target.lock()) std::puts(\"target gone\");\n}\n```\n\n위 코드에서 `target` 은 적을 관찰만 하므로 적의 수명을 늘리지 않습니다. 블록을 벗어나 `enemy` 가 사라지면 강한 참조가 0이 되어 적이 소멸하고, 그 뒤의 `lock()` 은 빈 포인터를 돌려줍니다.\n\n출력 결과는 다음과 같습니다.\n\n```\ntarget alive\nEnemy destroyed\ntarget gone\n```\n\n`weak_ptr` 는 순환 참조를 끊는 데도 씁니다. 두 객체가 서로를 `shared_ptr` 로 쥐고 있으면 참조 수가 0이 되지 않습니다. 이때 한쪽 방향을 `weak_ptr` 로 바꾸면 순환이 끊어집니다.\n\n#### 언리얼의 `UObject` 와 가비지 컬렉션\n\n하지만 언리얼의 `UObject` 계열 클래스에는 std 스마트 포인터를 쓰지 않습니다. `UObject` 는 엔진의 가비지 컬렉션(GC, garbage collection)이 관리합니다. GC는 루트 집합에서 출발해 `UPROPERTY` 매크로로 노출된 참조를 따라가며 어떤 객체에 도달할 수 있는지 추적합니다.\n\n여기에 std 스마트 포인터로 수명을 따로 쥐면, 객체의 수명을 GC와 참조 카운팅이 동시에 결정하려고 해서 소유권이 충돌합니다. 그래서 `UObject` 를 참조할 때는 `UPROPERTY` 와 `TObjectPtr` 를 함께 쓰고, 소유하지 않는 관찰에는 `TWeakObjectPtr` 를 씁니다.\n\n#### 비-`UObject` 객체용 언리얼 스마트 포인터\n\n`UObject` 가 아닌 일반 C++ 객체에는 언리얼판 스마트 포인터를 씁니다. `TUniquePtr`, `TSharedPtr`, `TSharedRef`, `TWeakPtr` 가 있으며, 의미는 std 대응물과 같습니다. `TSharedRef` 는 널이 될 수 없다는 점이 다릅니다.\n\n언리얼판은 스레드 안전 모드를 템플릿 인자(`ESPMode`)로 고릅니다. 값은 `NotThreadSafe` 와 `ThreadSafe` 두 가지입니다. UE 5.8에서 `TSharedRef`, `TSharedPtr`, `TWeakPtr`, `TSharedFromThis` 의 기본값은 참조 수를 원자적으로 증감하는 `ThreadSafe` 입니다(`Runtime/Core/Public/Templates/SharedPointerFwd.h:11-18`, `:24-27`). 기본값이 어느 버전에서 바뀌었는지는 소스로 확인할 수 없어서 적지 않습니다.\n\n한 스레드에서만 쓰는 핫패스라면 `ESPMode::NotThreadSafe` 를 명시해서 원자 연산 비용을 뺄 수 있습니다.\n\n#### 정리\n\nstd에서는 `unique_ptr` 를 기본으로 쓰고, 공동 소유가 꼭 필요할 때만 `shared_ptr` 를 쓰며, 관찰과 순환 끊기에는 `weak_ptr` 를 씁니다. 언리얼의 `UObject` 는 GC가 수명을 관리하므로 `UPROPERTY` 와 `TObjectPtr`, `TWeakObjectPtr` 를 씁니다. `UObject` 가 아닌 데이터에는 `TUniquePtr`, `TSharedPtr` 같은 언리얼판 스마트 포인터를 씁니다.\n\n### 짧은 코드 예\n\n```cpp\n#include <memory>\n\nstruct Node {\n    std::shared_ptr<Node> Next;   // 강한 참조\n    std::weak_ptr<Node>   Prev;   // 약한 참조: 순환을 끊는다\n};\n\nvoid Demo() {\n    auto a = std::make_shared<Node>();   // 할당 1회(객체 + 제어 블록)\n    auto b = std::make_shared<Node>();\n    a->Next = b;\n    b->Prev = a;                         // shared_ptr 였다면 둘 다 누수\n    if (auto p = b->Prev.lock()) { /* 살아 있을 때만 사용 */ }\n\n    std::unique_ptr<int[]> buf = std::make_unique<int[]>(256);\n    auto moved = std::move(buf);         // 소유권 이전, buf 는 비게 된다\n}\n\n// 언리얼 대응(개념 예)\n// UPROPERTY() TObjectPtr<AActor> Target;     // GC가 추적하는 강한 참조\n// TWeakObjectPtr<AActor> Observed;           // 파괴되면 무효로 판정\n// TSharedPtr<FMyData> Data = MakeShared<FMyData>();  // 비-UObject\n```\n\n위 코드에서 `a` 는 `Next` 로 `b` 를 강하게 참조하고, `b` 는 `Prev` 로 `a` 를 약하게 참조합니다. `Prev` 까지 `shared_ptr` 였다면 두 노드가 서로를 붙잡아 함수가 끝나도 둘 다 해제되지 않습니다. 마지막 두 줄은 `unique_ptr` 의 소유권이 `std::move` 로 옮겨 가고 `buf` 가 빈 포인터가 되는 모습을 보여 줍니다.\n\n### 흔한 함정\n\n- 같은 원시 포인터로 `shared_ptr` 를 두 번 만듭니다. 그러면 제어 블록이 둘 생기고, 각각 참조 수가 0이 될 때 같은 객체를 해제하므로 이중 해제가 일어납니다. 클래스 안에서 자기 자신을 공유하려면 `std::enable_shared_from_this` 를 씁니다.\n- `std::make_shared` 로 만든 객체는 약한 참조가 남아 있는 동안 **메모리 블록 전체**가 해제되지 않는다는 점을 잊습니다. 소멸자는 강한 참조가 0이 될 때 불리지만, 객체와 제어 블록이 한 블록에 있으므로 메모리는 약한 참조까지 0이 되어야 돌아옵니다. 큰 객체를 오래 사는 `weak_ptr` 가 관찰한다면 이 점을 고려합니다.\n- 언리얼에서 `UPROPERTY` 매크로 없이 `UObject*` 원시 포인터 멤버만 들고 있습니다. GC는 이 참조를 알지 못하므로 객체를 수거하고, 멤버는 댕글링 포인터가 됩니다.\n\n### 면접 질문\n\n1. **`shared_ptr` 의 제어 블록에는 무엇이 들어 있고, 어떤 비용이 있나요?**\n   제어 블록에는 강한 참조 수, 약한 참조 수, 삭제자, 할당기가 들어 있습니다. `shared_ptr` 를 복사할 때마다 참조 수가 원자적으로 증감하므로, 무심코 값으로 넘기면 그 비용이 쌓입니다. `make_shared` 를 쓰지 않으면 객체와 제어 블록을 따로 할당하는 비용도 생깁니다. 그래서 소유가 필요 없는 함수에는 참조나 원시 포인터로 넘깁니다.\n2. **순환 참조는 어떻게 생기고, 어떻게 막나요?**\n   두 객체가 서로를 `shared_ptr` 로 쥐면 강한 참조 수가 0이 되지 않아 둘 다 해제되지 않습니다. 이를 막으려면 먼저 어느 쪽이 소유하는지 방향을 정합니다. 그리고 역방향 참조는 `weak_ptr` 로 바꿔서 순환을 끊습니다. 역방향으로 접근할 때는 `lock()` 으로 객체가 살아 있는지 확인한 뒤 씁니다.\n3. **언리얼은 왜 `UObject` 에 std 스마트 포인터를 쓰지 않나요?**\n   `UObject` 의 수명은 리플렉션 정보를 이용하는 GC가 도달 가능성으로 결정합니다. 여기에 참조 카운팅이 따로 수명을 쥐면 두 체계가 같은 객체의 수명을 두고 충돌합니다. 그래서 `UObject` 에는 `UPROPERTY` 참조와 `TWeakObjectPtr` 를 씁니다. GC 밖에 있는 일반 C++ 데이터에는 `TSharedPtr` 와 `TUniquePtr` 를 씁니다.\n\n### 실습 과제\n\n- `sizeof(std::unique_ptr<int>)`, `sizeof(std::shared_ptr<int>)` 와, 사용자 정의 삭제자(람다, 함수 포인터)를 단 `unique_ptr` 의 크기를 출력해서 비교합니다.\n- 소멸자에서 로그를 찍는 두 클래스로 순환 참조를 만들어 소멸자가 불리지 않는 것을 확인합니다. 그다음 한쪽을 `weak_ptr` 로 바꿔서 고칩니다.\n\n### 더 읽을 곳\n\n- 『Effective Modern C++』: 항목 18(`unique_ptr`), 항목 19(`shared_ptr`), 항목 20(`weak_ptr`), 항목 21(`make_unique`·`make_shared` 선호)\n- cppreference.com: \"std::shared_ptr\", \"std::weak_ptr\", \"std::enable_shared_from_this\"\n- 언리얼 공식 문서의 스마트 포인터 라이브러리, 가비지 컬렉션 항목: 엔진 버전마다 내용이 바뀌므로 해당 버전의 문서를 봅니다.\n\n---\n\n## 7. 정의되지 않은 동작(UB) 대표 사례\n\n### 핵심\n\n#### 정의되지 않은 동작이란\n\n정의되지 않은 동작(UB, undefined behavior)은 표준이 결과를 전혀 정하지 않은 경우입니다. 쉽게 말하면 \"이상한 값이 나온다\"로 끝나지 않습니다. 컴파일러는 **그런 일이 일어나지 않는다고 가정하고** 최적화하므로, 관련 없어 보이는 코드까지 망가질 수 있습니다.\n\n#### 대표 사례\n\n자주 만나는 UB는 다음과 같습니다.\n\n- 댕글링(dangling) 참조나 포인터를 사용하는 경우입니다. 이미 사라진 객체를 가리키는 참조나 포인터를 말합니다.\n- 초기화하지 않은 지역 변수를 읽는 경우입니다.\n- 부호 있는 정수가 오버플로하는 경우입니다.\n- 반복자 무효화(iterator invalidation) 뒤에 그 반복자를 사용하는 경우입니다.\n- 배열이나 컨테이너의 범위 밖에 접근하는 경우입니다.\n- 데이터 경쟁(data race)이 일어나는 경우입니다.\n- 엄격한 별칭 규칙(strict aliasing)을 위반하는 경우입니다.\n\n#### 부호 없는 정수와 부호 있는 정수\n\n부호 없는 정수는 범위를 넘으면 모듈로 산술에 따라 0부터 다시 시작합니다(wrap-around). 그래서 부호 없는 정수의 오버플로는 정의된 동작입니다. 하지만 부호 있는 정수의 오버플로는 UB입니다.\n\n#### 왜 중요할까요?\n\n디버그 빌드에서는 멀쩡하다가 최적화를 켠 출시 빌드에서만 터지는 버그 중 상당수가 UB입니다. 최적화 수준에 따라 컴파일러가 UB를 가정해 코드를 바꾸는 정도가 달라지기 때문입니다. 그래서 새니타이저(sanitizer)를 써서 개발 단계에서 일찍 잡습니다.\n\n#### 정리\n\nUB는 표준이 결과를 정하지 않은 동작이고, 컴파일러는 UB가 없다고 가정하고 최적화합니다. 댕글링, 초기화하지 않은 값 읽기, 부호 있는 정수 오버플로, 반복자 무효화가 대표 사례입니다. 출시 빌드에서만 나타나는 버그가 많으므로 새니타이저로 일찍 찾습니다.\n\n### 짧은 코드 예\n\n```cpp\n#include <vector>\n#include <string>\n\nconst std::string& Dangling() {\n    std::string s = \"temp\";\n    return s;                    // UB: 소멸된 지역 객체의 참조를 반환한다\n}\n\nint Uninit() {\n    int x;                       // 초기화되지 않았다\n    return x + 1;                // UB: 불확정 값을 읽는다\n}\n\nbool Overflow(int i) {\n    return i + 1 > i;            // 오버플로가 없다고 가정하므로 항상 true 로 최적화될 수 있다\n}\n\nvoid Invalidate(std::vector<int>& v) {\n    for (auto it = v.begin(); it != v.end(); ++it) {\n        if (*it == 0) v.push_back(1);  // UB: 재할당되면 it 가 무효가 된다\n    }\n    // 올바른 삭제 패턴: it = v.erase(it); 로 갱신하거나 erase-remove 관용구를 쓴다\n}\n```\n\n위 코드에서 `Dangling` 은 함수가 끝나면서 사라진 `s` 의 참조를 돌려줍니다. `Overflow` 는 부호 있는 정수 오버플로가 일어나지 않는다고 가정하면 `i + 1 > i` 가 늘 참이므로, 컴파일러가 함수 전체를 `true` 반환으로 바꿀 수 있습니다. `Invalidate` 는 순회 도중 `push_back` 으로 재할당이 일어나면 `it` 가 해제된 메모리를 가리키게 됩니다.\n\n### 흔한 함정\n\n- 람다가 지역 변수를 참조로 캡처(`[&]`)한 채 비동기 작업이나 델리게이트에 등록됩니다. 람다가 함수가 끝난 뒤에 실행되면, 캡처한 참조는 이미 사라진 변수를 가리킵니다(댕글링).\n- 범위 기반 `for` 문으로 컨테이너를 돌면서 원소를 추가하거나 삭제합니다. `std::vector` 는 재할당이 일어나면 모든 반복자가 무효가 되고, `erase` 하면 삭제 지점 이후의 반복자가 무효가 됩니다. `std::unordered_map` 은 재해시(rehash)가 일어나면 반복자가 무효가 되지만, 원소에 대한 참조와 포인터는 유지됩니다.\n- \"내 컴퓨터에서는 돌아간다\"는 이유로 UB를 정상 동작으로 여깁니다. 컴파일러나 옵션이 바뀌면 결과도 바뀝니다.\n\n### 면접 질문\n\n1. **UB가 단순한 오류보다 위험한 이유는 무엇인가요?**\n   컴파일러는 UB가 없다고 가정하고 코드를 변형합니다. 그래서 UB가 있는 줄뿐 아니라 그 앞뒤 코드까지 예측할 수 없게 바뀔 수 있습니다. 증상이 원인과 먼 곳에서 나타나기 때문에 디버깅도 어렵습니다. 또 디버그 빌드에서는 멀쩡하다가 최적화 빌드에서만 드러나는 경우가 많습니다.\n2. **`std::vector` 를 순회하면서 원소를 삭제하려면 어떻게 해야 하나요?**\n   `erase` 가 돌려주는 다음 원소의 반복자로 반복자를 갱신하거나, `std::remove_if` 뒤에 `erase` 를 한 번 호출하는 erase-remove 관용구를 씁니다. C++20부터는 `std::erase_if` 함수를 쓸 수 있습니다. 순서가 중요하지 않다면 지울 원소를 마지막 원소와 바꾼 뒤 끝에서 빼는 방법도 있습니다. 언리얼의 `RemoveAtSwap` 도 같은 발상입니다.\n3. **UB는 어떻게 찾나요?**\n   먼저 컴파일러 경고를 최대로 켭니다. 그리고 테스트 빌드에서 AddressSanitizer로 메모리 오류를, UndefinedBehaviorSanitizer로 오버플로 같은 UB를, ThreadSanitizer로 데이터 경쟁을 찾습니다. 정적 분석 도구도 보조 수단으로 씁니다.\n\n### 실습 과제\n\n- Compiler Explorer에서 `Overflow` 함수를 `-O2` 로 컴파일해서 `return 1` 로 접히는지 확인합니다. 그다음 매개변수를 `unsigned` 로 바꿨을 때와 비교합니다.\n- 위 예제들을 `-fsanitize=address,undefined` 로 빌드하고 실행해서 새니타이저가 보고하는 형식을 익힙니다.\n\n### 더 읽을 곳\n\n- cppreference.com: \"Undefined behavior\", \"Iterator invalidation\"(각 컨테이너 문서의 무효화 규칙 표)\n- 『Effective Modern C++』: 람다 캡처 관련 항목(항목 31 기본 캡처 모드 피하기)\n\n---\n\n## 8. 자료구조·알고리즘 필기 대비 요점\n\n### 핵심\n\n#### 복잡도\n\n빅오(Big-O) 표기는 입력이 커질 때 실행 시간이 늘어나는 비율을 나타냅니다. 하지만 상수 계수와 캐시 효과는 표기에서 숨겨집니다. 그래서 n이 작거나 메모리 접근 패턴이 다르면, O(n) 선형 탐색이 O(log n) 트리 탐색보다 빠를 수 있습니다.\n\n상각(amortized) 복잡도도 구분해야 합니다. 상각 복잡도는 연산을 여러 번 했을 때의 평균 비용입니다. 예를 들어 동적 배열의 끝에 삽입하는 연산은 가끔 재할당이 일어나지만, 평균으로 보면 상각 O(1)입니다.\n\n#### 해시맵과 트리\n\n해시맵(`std::unordered_map`)은 평균 O(1)에 조회하지만 최악에는 O(n)이고, 원소의 순서가 없습니다. 균형 이진 탐색 트리(`std::map`, 보통 레드-블랙 트리)는 O(log n)에 조회합니다. 대신 키 순서대로 순회할 수 있고 범위 질의도 할 수 있습니다.\n\n#### 정렬\n\n`std::sort` 함수는 평균과 최악 모두 O(n log n)을 보장하며, 이 보장은 C++11부터입니다. 하지만 안정 정렬이 아닙니다. 같은 키를 가진 원소의 원래 순서를 지켜야 하면 `std::stable_sort` 함수를 씁니다.\n\n전체를 정렬할 필요가 없을 때도 있습니다. 상위 k개만 필요하면 `std::partial_sort` 를 쓰고, k번째 원소만 필요하면 평균 O(n)인 `std::nth_element` 를 씁니다.\n\n#### 그래프 탐색\n\n너비 우선 탐색(BFS, breadth-first search)은 큐를 써서 가까운 정점부터 넓혀 가며, 가중치 없는 그래프의 최단 거리를 구합니다. 깊이 우선 탐색(DFS, depth-first search)은 스택이나 재귀를 써서 한 경로를 끝까지 따라가며, 연결 요소 찾기, 사이클 검출, 위상 정렬에 씁니다. 두 탐색 모두 인접 리스트로 표현한 그래프에서 O(V+E)입니다.\n\n#### 우선순위 큐\n\n우선순위 큐(priority queue)는 보통 이진 힙으로 구현합니다. 삽입과 추출은 O(log n)이고, 최댓값 확인은 O(1)입니다. `std::priority_queue` 클래스는 기본이 최대 힙입니다.\n\n우선순위 큐는 다익스트라(Dijkstra) 최단 경로 알고리즘과 A* 경로 탐색의 열린 목록에 씁니다. 이진 힙을 쓰는 다익스트라의 복잡도는 O((V+E) log V)입니다.\n\n#### 정리\n\n빅오는 증가율만 보여 주므로 작은 n과 캐시 효과는 따로 따져야 합니다. 순서가 필요하면 트리, 단순 조회가 대부분이면 해시맵을 씁니다. `std::sort` 는 안정 정렬이 아니며, BFS는 가중치 없는 최단 거리, 우선순위 큐는 다익스트라에 씁니다.\n\n### 언리얼 컨테이너 대응(한 줄씩)\n\n| std | 언리얼 | 한 줄 메모 |\n|---|---|---|\n| `std::vector` | `TArray` | 연속 메모리에 놓이는 동적 배열입니다. `RemoveAtSwap` 함수로 순서를 포기하고 O(1)에 삭제할 수 있습니다. (`Array.h:2416`) |\n| `std::unordered_map` | `TMap` | 해시 기반 키-값 컨테이너입니다. 내부는 `TSet` 위에 구현되어 있고 순서를 보장하지 않습니다. (`Map.h.inl:41`) |\n| `std::unordered_set` | `TSet` | 해시 집합입니다. 추가, 삭제, 검색은 평균 O(1)입니다. (`Set.h:12-38`, `SparseSet.h.inl:41`) |\n| `std::map` | `TSortedMap` | 트리가 아니라 키로 정렬된 배열입니다. 검색은 O(log n), 추가와 삭제는 O(n)입니다. (`SortedMap.h:11-16`) |\n| `std::priority_queue` | `TArray` + `Heapify`/`HeapPush`/`HeapPop` | 별도 클래스 없이 배열의 힙 함수로 구현합니다. (`Array.h:3876`, `:3907`, `:3984`) |\n| `std::queue` | `TQueue` | 잠금 없는 연결 리스트 큐이며, 스레드 사이에 데이터를 넘길 때 씁니다. (`Queue.h:5-26`) |\n\n엔진 경로는 `Engine/Source/Runtime/Core/Public/Containers/` 기준입니다.\n\n#### `TArray`\n\n`TArray` 는 `std::vector` 처럼 원소를 연속 메모리에 두는 동적 배열입니다. `RemoveAtSwap` 은 지울 원소 자리에 마지막 원소를 옮겨 놓고 끝을 줄이므로 O(1)에 삭제합니다. 대신 원소의 순서가 바뀝니다.\n\n#### `TMap`\n\n`TMap` 은 해시 기반의 키-값 컨테이너이며, 내부적으로 `TSet` 위에 구현되어 있습니다. `std::unordered_map` 과 마찬가지로 순서를 보장하지 않습니다.\n\n#### `TSet`\n\n`TSet` 은 기본 설정에서 원소를 `TSparseArray` 에 두고, 해시 버킷으로 원소들을 엮습니다. `TSparseArray` 는 연속 배열과 빈 칸 목록으로 이루어진 배열입니다. 원소를 삭제하면 배열에 구멍이 생기고, 다음에 원소를 추가할 때 그 자리를 다시 씁니다.\n\nUE 5.8에는 `TCompactSet` 이라는 다른 구현도 있습니다. 이 구현은 Target 규칙 `bUseCompactSetAsDefault` 로 켭니다.\n\n#### `TSortedMap`\n\n`TSortedMap` 은 키로 정렬된 `TArray<TPair>` 에 이진 탐색을 더한 컨테이너입니다. 트리가 아니므로 검색은 O(log n)이지만, 추가와 삭제는 뒤 원소를 밀어야 해서 O(n)입니다. 메모리는 `TMap` 의 절반 정도를 씁니다. 그래서 원소가 적고 조회가 많을 때 씁니다.\n\n#### 힙 함수\n\n언리얼에는 `std::priority_queue` 에 해당하는 별도 클래스가 없습니다. 대신 `TArray` 의 `Heapify`, `HeapPush`, `HeapPop` 함수로 배열을 힙처럼 다룹니다.\n\n#### `TQueue`\n\n`TQueue` 는 잠금 없는 연결 리스트 큐입니다. 모드는 `Spsc`(기본), `Mpsc`, `SingleThreaded` 세 가지이며, 어느 모드든 소비자는 언제나 하나입니다. 스레드 사이에 데이터를 넘기는 용도이므로, 일반적인 BFS에는 `TArray` 나 링 버퍼로 충분합니다.\n\n### 짧은 코드 예\n\n```cpp\n#include <vector>\n#include <queue>\n#include <utility>\n#include <limits>\n\n// BFS: 격자·가중치 없는 그래프 최단 거리\nstd::vector<int> Bfs(const std::vector<std::vector<int>>& adj, int start) {\n    std::vector<int> dist(adj.size(), -1);\n    std::queue<int> q;\n    dist[start] = 0; q.push(start);\n    while (!q.empty()) {\n        int u = q.front(); q.pop();\n        for (int v : adj[u])\n            if (dist[v] < 0) { dist[v] = dist[u] + 1; q.push(v); }\n    }\n    return dist;\n}\n\n// 다익스트라: (거리, 정점) 최소 힙\nusing Edge = std::pair<int, int>; // (정점, 가중치)\nstd::vector<long long> Dijkstra(const std::vector<std::vector<Edge>>& g, int s) {\n    std::vector<long long> d(g.size(), std::numeric_limits<long long>::max());\n    std::priority_queue<std::pair<long long,int>, std::vector<std::pair<long long,int>>,\n                        std::greater<>> pq;\n    d[s] = 0; pq.push({0, s});\n    while (!pq.empty()) {\n        auto [du, u] = pq.top(); pq.pop();\n        if (du > d[u]) continue;                 // 오래된 항목 건너뛰기\n        for (auto [v, w] : g[u])\n            if (d[u] + w < d[v]) { d[v] = d[u] + w; pq.push({d[v], v}); }\n    }\n    return d;\n}\n```\n\n위 코드의 `Bfs` 에서 `dist` 의 값 -1은 아직 방문하지 않은 정점을 뜻합니다. 이웃을 큐에 **넣을 때** 거리를 기록하므로, 정점 하나가 큐에 두 번 들어가지 않습니다.\n\n`Dijkstra` 는 `std::greater<>` 비교자를 주어 `std::priority_queue` 를 최소 힙으로 씁니다. 한 정점의 거리가 여러 번 갱신되면 같은 정점이 큐에 여러 번 들어가는데, 꺼낸 거리 `du` 가 이미 기록된 `d[u]` 보다 크면 오래된 항목이므로 건너뜁니다.\n\n### 흔한 함정\n\n- BFS에서 방문 표시를 큐에서 **꺼낼 때** 합니다. 그러면 같은 정점이 큐에 여러 번 들어가서 시간과 메모리 사용이 크게 늘어납니다. 방문 표시는 큐에 넣을 때 합니다.\n- `std::priority_queue` 를 최소 힙으로 착각합니다. 기본은 최대 힙이므로, 최소 힙이 필요하면 `std::greater<>` 비교자를 주거나 값에 음수를 붙여 넣습니다.\n- 해시맵 조회를 항상 O(1)로 단정합니다. 해시 충돌이 한 버킷에 몰리면 최악 O(n)이 되고, 재해시가 일어나는 순간에는 큰 비용과 반복자 무효화가 따릅니다. 원소 수를 미리 알면 `reserve` 함수로 공간을 미리 잡아 둡니다.\n\n### 면접 질문\n\n1. **`std::map` 과 `std::unordered_map` 중 무엇을 쓰나요?**\n   키 순서대로 순회하거나 범위 질의를 해야 하면 트리 기반인 `std::map` 을 씁니다. 단순 조회가 대부분이면 해시 기반인 `std::unordered_map` 을 씁니다. 다만 원소가 적거나 자주 순회한다면, 정렬된 배열이 캐시 측면에서 두 컨테이너보다 나을 수 있습니다. 언리얼의 `TSortedMap` 이 이런 정렬된 배열 방식입니다.\n2. **BFS와 DFS는 어떻게 다르고, 각각 어디에 쓰나요?**\n   BFS는 큐를 써서 가까운 정점부터 넓혀 가므로, 가중치 없는 그래프에서 최단 거리를 보장합니다. DFS는 한 경로를 끝까지 따라간 뒤 되돌아오는 방식이라 사이클 검출, 위상 정렬, 연결 요소 찾기에 적합합니다. 재귀로 DFS를 구현하면 깊은 그래프에서 스택 오버플로가 날 수 있으므로 주의합니다.\n3. **안정 정렬은 언제 필요한가요?**\n   여러 키로 차례로 정렬할 때 필요합니다. 예를 들어 점수로 정렬하되, 점수가 같은 원소는 이전 정렬 순서를 유지해야 하는 경우입니다. 같은 키를 가진 원소의 원래 순서가 의미를 가질 때도 필요합니다. `std::sort` 는 안정성을 보장하지 않으므로 이때는 `std::stable_sort` 를 씁니다.\n\n### 실습 과제\n\n- 백준이나 프로그래머스에서 다음 유형을 각각 2~3문제씩 풉니다: 격자 BFS 최단 거리, 연결 요소 개수(DFS/BFS), 다익스트라 최단 경로, 위상 정렬, 힙을 이용한 상위 k개, 해시맵을 이용한 빈도 세기, 정렬과 투 포인터.\n- 정수 10만 개에 대해 `std::vector` 선형 탐색, `std::map`, `std::unordered_map`, 정렬된 배열과 `std::lower_bound` 의 조회 시간을 n=16, 1,000, 100,000에서 비교합니다.\n\n### 더 읽을 곳\n\n- cppreference.com: \"Containers library\", \"std::sort\", \"std::priority_queue\"\n- 『Game Engine Architecture』: 컨테이너와 자료구조 부분\n- 『A Tour of C++』: 컨테이너, 알고리즘 장\n\n---\n\n## 9. 간격 반복 카드\n\n| 질문 | 답 |\n|---|---|\n| 지역 객체들은 어떤 순서로 소멸하나요? | 생성된 순서의 반대로 소멸합니다. |\n| 클래스 멤버의 초기화 순서는 무엇이 정하나요? | 클래스 안의 선언 순서가 정하며, 초기화 목록의 순서와는 무관합니다. |\n| 소멸자에서 예외가 빠져나가면 어떻게 되나요? | 소멸자는 기본으로 `noexcept` 이므로 `std::terminate` 가 호출됩니다. |\n| rvalue를 이루는 두 값 범주는 무엇인가요? | prvalue와 xvalue입니다. |\n| `std::move` 함수는 실제로 무엇을 하나요? | rvalue 참조로 캐스팅만 합니다. 실제 이동은 이동 생성자와 이동 대입이 합니다. |\n| 이동 생성자에 `noexcept` 가 없으면 `std::vector` 는 재할당할 때 어떻게 하나요? | 강한 예외 보장을 지키려고 이동 대신 복사합니다. |\n| 0의 규칙이란 무엇인가요? | 자원을 직접 관리하지 않는 클래스는 특수 멤버 함수를 하나도 직접 정의하지 않는다는 규칙입니다. |\n| `std::forward` 함수는 언제 쓰나요? | 전달 참조로 받은 인자를 원래 값 범주 그대로 넘길 때 씁니다. |\n| `return std::move(local);` 은 무엇이 문제인가요? | 반환값 최적화(NRVO)를 막을 수 있습니다. |\n| 가상 호출의 가장 큰 숨은 비용은 무엇인가요? | 인라인할 수 없다는 점이고, 간접 참조에 따른 캐시 미스도 있습니다. |\n| 다형적 기반 클래스에 꼭 필요한 것은 무엇인가요? | 가상 소멸자입니다. |\n| 생성자 안에서 가상 함수를 호출하면 어느 버전이 불리나요? | 지금 생성 중인 클래스의 버전이 불립니다. |\n| `override` 지정자를 쓰면 무엇이 좋은가요? | 시그니처가 맞지 않는 실수를 컴파일 오류로 잡아 줍니다. |\n| `final` 지정자는 성능에 어떤 이점이 있나요? | 탈가상화가 가능해져 직접 호출과 인라인을 할 수 있습니다. |\n| 템플릿 정의를 헤더에 두는 이유는 무엇인가요? | 사용하는 지점에서 정의가 보여야 인스턴스화되기 때문입니다. |\n| 함수 템플릿은 부분 특수화할 수 있나요? | 할 수 없습니다. 오버로딩으로 대신합니다. |\n| `if constexpr` 구문은 어떤 효과가 있나요? | 거짓인 분기를 인스턴스화하지 않습니다(C++17). |\n| `struct { char a; int b; char c; }` 의 흔한 크기와 줄이는 방법은 무엇인가요? | 12바이트이며, 큰 멤버부터 배치하면 8바이트가 됩니다. |\n| 일반적인 x86-64 CPU의 캐시 라인 크기는 얼마인가요? | 64바이트입니다. |\n| SoA 방식은 언제 유리한가요? | 많은 개체의 일부 필드에 같은 연산을 일괄로 적용할 때 유리합니다. |\n| 거짓 공유란 무엇인가요? | 다른 스레드들이 같은 캐시 라인의 서로 다른 변수에 써서 생기는 캐시 일관성 트래픽입니다. |\n| `shared_ptr` 의 제어 블록에는 무엇이 들어 있나요? | 강한 참조 수, 약한 참조 수, 삭제자, 할당기가 들어 있습니다. |\n| `std::make_shared` 함수의 장점은 무엇인가요? | 객체와 제어 블록을 한 번에 할당합니다. |\n| 순환 참조를 끊는 도구는 무엇인가요? | `std::weak_ptr` 이며, 역방향 참조를 약한 참조로 바꿉니다. |\n| `UObject` 에 std 스마트 포인터를 쓰지 않는 이유는 무엇인가요? | 엔진 GC가 도달 가능성으로 수명을 관리하므로 참조 카운팅과 충돌합니다. |\n| `UPROPERTY` 없이 `UObject*` 멤버를 들고 있으면 어떤 위험이 있나요? | GC가 그 참조를 모르고 객체를 수거해서 댕글링 포인터가 됩니다. |\n| `UObject` 가 아닌 데이터에 쓰는 언리얼 스마트 포인터는 무엇인가요? | `TUniquePtr`, `TSharedPtr`, `TSharedRef`, `TWeakPtr` 입니다. |\n| 부호 있는 정수 오버플로는 어떻게 취급되나요? | 정의되지 않은 동작입니다. 부호 없는 정수는 감싸기로 정의되어 있습니다. |\n| `std::vector` 가 재할당된 뒤 기존 반복자는 어떻게 되나요? | 모두 무효가 됩니다. |\n| `std::unordered_map` 이 재해시된 뒤 원소 참조는 어떻게 되나요? | 유효합니다. 반복자만 무효가 됩니다. |\n| `std::sort` 함수는 안정 정렬인가요? | 아닙니다. 안정성이 필요하면 `std::stable_sort` 를 씁니다. |\n| BFS에서 방문 표시는 언제 하나요? | 큐에 넣을 때 합니다. |\n| `std::priority_queue` 의 기본 힙은 무엇인가요? | 최대 힙입니다. 최소 힙은 `std::greater<>` 로 만듭니다. |\n| 이진 힙을 쓰는 다익스트라의 복잡도는 얼마인가요? | O((V+E) log V)입니다. |\n| 템플릿 안의 `static_assert(false)` 를 지금 써도 되나요? | 됩니다. P2593R1(CWG2518, 결함 보고)에 따라 GCC 13, Clang 17, MSVC 19.40부터 허용되며 이전 표준 모드에도 적용됩니다. |\n| GCC에서 `std::hardware_destructive_interference_size` 를 헤더에 노출하면 어떤 문제가 생기나요? | 값이 `-mtune` 에 따라 달라져서 ABI가 어긋날 수 있으며, `-Winterference-size` 경고가 이를 알립니다. |\n| UE 5.8에서 언리얼 `TSharedPtr` 의 기본 `ESPMode` 는 무엇인가요? | `ThreadSafe` 입니다. |\n| `TSortedMap` 은 어떻게 구현되어 있고 복잡도는 얼마인가요? | 정렬된 `TArray<TPair>` 이며, 검색은 O(log n), 추가와 삭제는 O(n)입니다. |\n| `TQueue` 의 소비자는 몇 개인가요? | 항상 하나입니다. 기본은 Spsc이고 Mpsc도 가능합니다. |\n\n---\n\n## 10. 필기 대비 문제\n\n> 먼저 종이에 답을 쓴 다음 \"정답과 풀이\"를 펼칩니다. 출력을 예측하는 문제의 정답은 MSVC 19.44(`/std:c++20`)로 컴파일하고 실행해서 확인했습니다(2026-11-21). 구현 정의 값(`sizeof`)은 x86-64 기준입니다.\n\n### 문제 1. 생성·소멸 순서 (1절)\n\n다음 프로그램의 출력을 순서대로 쓰십시오.\n\n```cpp\n#include <cstdio>\nstruct A { A() { std::puts(\"A\"); } ~A() { std::puts(\"~A\"); } };\nstruct B { B() { std::puts(\"B\"); } ~B() { std::puts(\"~B\"); } };\nstruct C : A {\n    B b;\n    C() { std::puts(\"C\"); }\n    ~C() { std::puts(\"~C\"); }\n};\nint main() { C c; }\n```\n\n**답:** `A` `B` `C` `~C` `~B` `~A`\n\n객체는 기반 클래스 → 멤버(선언 순서) → 생성자 본문 순서로 만들어집니다. 소멸은 정확히 그 반대 순서로 일어납니다.\n\n### 문제 2. 멤버 초기화 목록의 함정 (1절)\n\n`S s(5);` 를 실행한 뒤 `s.b` 의 값은 무엇입니까?\n\n```cpp\nstruct S {\n    int b;\n    int a;\n    S(int x) : a(x), b(a * 2) {}\n};\n```\n\n**답:** 정해지지 않습니다. 초기화되지 않은 값을 읽는 정의되지 않은 동작입니다.\n\n멤버는 초기화 목록에 적은 순서가 아니라 **선언 순서**(`b` → `a`)로 초기화됩니다. 그래서 `b(a * 2)` 가 실행되는 시점에 `a` 는 아직 초기화되지 않았습니다. 고치려면 선언 순서를 `a`, `b` 로 바꾸거나, `b(x * 2)` 처럼 매개변수를 직접 씁니다.\n\n### 문제 3. 이동 생성자와 `noexcept` (2절)\n\n다음 프로그램의 출력을 쓰십시오.\n\n```cpp\n#include <cstdio>\n#include <vector>\nstruct T {\n    T() = default;\n    T(const T&) { std::puts(\"copy\"); }\n    T(T&&) { std::puts(\"move\"); }\n};\nstruct U {\n    U() = default;\n    U(const U&) { std::puts(\"copy\"); }\n    U(U&&) noexcept { std::puts(\"move\"); }\n};\nint main() {\n    std::vector<T> v; v.reserve(1); v.emplace_back(); v.emplace_back();\n    std::puts(\"--\");\n    std::vector<U> w; w.reserve(1); w.emplace_back(); w.emplace_back();\n}\n```\n\n**답:** `copy` `--` `move`\n\n두 번째 `emplace_back` 에서 용량이 모자라 재할당이 일어나고, 기존 원소 하나를 새 버퍼로 옮깁니다. `T` 의 이동 생성자는 `noexcept` 가 아니므로, `std::vector` 는 강한 예외 보장을 지키려고 복사를 고릅니다(`std::move_if_noexcept`). `U` 의 이동 생성자는 `noexcept` 이므로 이동합니다. 새 원소는 새 버퍼 안에서 바로 생성되므로 아무것도 출력하지 않습니다.\n\n### 문제 4. `const` 객체와 `std::move` (2절)\n\n다음 코드를 실행한 뒤 `s` 와 `t` 의 값은 무엇입니까?\n\n```cpp\nconst std::string s = \"hello\";\nstd::string t = std::move(s);\n```\n\n**답:** `s` 는 `\"hello\"` 이고, `t` 도 `\"hello\"` 입니다.\n\n`std::move(s)` 의 결과는 `const std::string&&` 입니다. 이동 생성자는 `std::string&&` 를 받으므로 이 인자와 맞지 않고, `const std::string&` 를 받는 복사 생성자가 선택됩니다. 결국 오류 없이 조용히 복사가 일어납니다.\n\n### 문제 5. 생성자 안의 가상 호출 (3절)\n\n다음 프로그램의 출력을 쓰십시오.\n\n```cpp\n#include <cstdio>\nstruct Base {\n    Base() { Hi(); }\n    virtual void Hi() { std::puts(\"Base\"); }\n    virtual ~Base() = default;\n};\nstruct D : Base {\n    D() { Hi(); }\n    void Hi() override { std::puts(\"D\"); }\n};\nint main() { D d; Base& r = d; r.Hi(); }\n```\n\n**답:** `Base` `D` `D`\n\n`Base` 생성자가 실행되는 동안에는 객체의 동적 타입이 `Base` 로 취급되므로 `Base::Hi` 가 불립니다. `D` 생성자 본문에서의 호출과, 생성이 끝난 뒤 `r` 을 통한 호출은 모두 `D::Hi` 를 부릅니다.\n\n### 문제 6. `override` 컴파일 오류 (3절)\n\n`(1)`~`(3)` 중 컴파일 오류가 나는 줄을 모두 고르고 이유를 쓰십시오.\n\n```cpp\nstruct B {\n    virtual void F(int) const;\n    virtual void G();\n    void H();\n    virtual ~B() = default;\n};\nstruct D : B {\n    void F(int) override;      // (1)\n    void G() override;         // (2)\n    void H() override;         // (3)\n};\n```\n\n**답:** (1), (3)\n\n(1)은 `const` 한정자가 달라서 다른 함수가 되므로, 재정의할 대상이 없습니다. (3)은 `B::H` 가 가상 함수가 아니므로 재정의할 수 없습니다. 두 줄 모두 MSVC에서 C3668 오류가 납니다. `override` 가 없었다면 두 함수는 오류 없이 조용히 새 함수가 되었을 것입니다.\n\n### 문제 7. 구조체 크기 (5절)\n\nx86-64에서 `sizeof(X)` 와 `sizeof(Y)` 를 쓰고, 두 값이 다른 이유를 설명하십시오.\n\n```cpp\nstruct X { char a; double b; char c; };\nstruct Y { double b; char a; char c; };\n```\n\n**답:** `sizeof(X) == 24`, `sizeof(Y) == 16`\n\n`double` 의 정렬이 8이므로 구조체의 정렬도 8입니다. `X` 는 `a`(1) + 패딩 7 + `b`(8) + `c`(1) + 끝 패딩 7 = 24바이트입니다. `Y` 는 `b`(8) + `a`(1) + `c`(1) + 끝 패딩 6 = 16바이트입니다. 정렬 요구가 큰 멤버부터 두면 패딩이 줄어듭니다.\n\n### 문제 8. 정의되지 않은 동작 고르기 (7절)\n\n다음 중 정의되지 않은 동작(UB)을 모두 고르십시오.\n\n- (a) `unsigned u = UINT_MAX; u = u + 1;`\n- (b) `int i = INT_MAX; i = i + 1;`\n- (c) `std::vector<int> v{1, 2, 3}; int& r = v[0]; v.push_back(4); r = 9;`\n- (d) `int* p = new int[3]; delete p;`\n- (e) `std::unordered_map<int, int> m; int& r = m[1]; for (int k = 2; k < 1000; ++k) m[k] = k; r = 5;`\n\n**답:** (b), (c), (d)\n\n- (a)는 부호 없는 정수이므로 모듈로 산술에 따라 0이 됩니다. 정의된 동작입니다.\n- (b)는 부호 있는 정수의 오버플로이므로 UB입니다.\n- (c)는 크기가 3인 벡터에 `push_back` 하면 재할당이 일어날 수 있고, 그러면 `r` 이 해제된 메모리를 가리킵니다. 재할당 여부가 용량에 달려 있으므로 이런 코드는 UB로 봅니다.\n- (d)는 `new[]` 로 할당한 메모리를 `delete` 로 해제했습니다. `delete[]` 를 써야 합니다.\n- (e)는 재해시가 일어나도 `std::unordered_map` 의 원소 참조와 포인터는 유지되므로 정의된 동작입니다. 무효가 되는 것은 반복자뿐입니다.\n\n### 문제 9. 오버로드와 템플릿 선택 (4절)\n\n다음 프로그램의 출력을 쓰십시오.\n\n```cpp\n#include <cstdio>\ntemplate <typename T> const char* K(T)  { return \"T\"; }\ntemplate <typename T> const char* K(T*) { return \"T*\"; }\nconst char* K(int) { return \"int\"; }\nint main() {\n    int i = 0; double d = 0;\n    std::printf(\"%s %s %s\\n\", K(i), K(&i), K(d));\n}\n```\n\n**답:** `int T* T`\n\n`K(i)` 는 일반 함수와 템플릿이 똑같이 정확하게 맞는데, 이때는 일반 함수가 우선합니다. `K(&i)` 는 두 템플릿 가운데 더 특수화된 `K(T*)` 가 선택됩니다. `K(d)` 는 `double` 을 받는 일반 함수가 없으므로 `K(T)` 가 `T = double` 로 인스턴스화됩니다. `int` 로 변환해서 일반 함수를 부르는 것보다 정확히 맞는 템플릿이 낫기 때문입니다.\n\n### 문제 10. `shared_ptr` 와 `weak_ptr` 의 수 (6절)\n\n다음 프로그램의 출력을 쓰십시오.\n\n```cpp\n#include <cstdio>\n#include <memory>\nint main() {\n    auto a = std::make_shared<int>(1);\n    auto b = a;\n    std::weak_ptr<int> w = a;\n    a.reset();\n    std::printf(\"%ld %d\\n\", b.use_count(), (int)w.expired());\n    b.reset();\n    std::printf(\"%d\\n\", (int)w.expired());\n}\n```\n\n**답:** 첫 줄은 `1 0` 이고, 다음 줄은 `1` 입니다.\n\n`weak_ptr` 는 강한 참조 수에 포함되지 않습니다. `a.reset()` 뒤에는 `b` 하나만 남으므로 참조 수가 1이고, 객체가 살아 있으므로 `expired()` 는 거짓(0)입니다. `b.reset()` 으로 강한 참조가 0이 되면 객체가 소멸하고 `expired()` 가 참(1)이 됩니다. `make_shared` 로 만들었으므로, 메모리 블록 자체는 `w` 가 사라질 때까지 남아 있습니다.\n\n### 문제 11. 시간 복잡도 (8절)\n\n다음 연산의 시간 복잡도를 쓰십시오.\n\n- (a) `std::vector::push_back`\n- (b) `std::map::find`\n- (c) `std::priority_queue` 의 `top` 과 `pop`\n- (d) `std::sort`\n- (e) `TSortedMap::Add`\n- (f) 인접 리스트로 표현한 그래프의 BFS\n\n**답:**\n\n- (a) 상각 O(1)입니다. 재할당이 일어나는 한 번은 O(n)입니다.\n- (b) O(log n)입니다. 균형 이진 탐색 트리이기 때문입니다.\n- (c) `top` 은 O(1), `pop` 은 O(log n)입니다.\n- (d) O(n log n)입니다. C++11부터는 최악의 경우도 보장합니다.\n- (e) O(n)입니다. 정렬된 배열에 끼워 넣으므로 뒤 원소들을 밀어야 합니다(검색은 O(log n)).\n- (f) O(V + E)입니다.\n\n### 문제 12. BFS 코드의 결함 (8절)\n\n다음 BFS는 거리 결과는 맞지만, 큰 그래프에서 매우 느리고 메모리를 많이 씁니다. 원인을 쓰고 코드를 고치십시오.\n\n```cpp\nstd::vector<int> Bfs(const std::vector<std::vector<int>>& adj, int s) {\n    std::vector<int> dist(adj.size(), -1);\n    std::queue<int> q; q.push(s);\n    int level = 0;\n    while (!q.empty()) {\n        int n = (int)q.size();\n        for (int k = 0; k < n; ++k) {\n            int u = q.front(); q.pop();\n            if (dist[u] >= 0) continue;   // 꺼낼 때 방문 표시\n            dist[u] = level;\n            for (int v : adj[u]) q.push(v);\n        }\n        ++level;\n    }\n    return dist;\n}\n```\n\n**답:** 방문 표시를 큐에서 **꺼낼 때** 하기 때문입니다. 아직 꺼내지 않은 정점이 이웃마다 한 번씩 중복으로 큐에 들어가므로, 최악에는 큐에 O(E)개가 넘는 항목이 쌓입니다.\n\n방문 표시를 큐에 **넣을 때** 하도록 고칩니다.\n\n```cpp\ndist[s] = 0; q.push(s);\nwhile (!q.empty()) {\n    int u = q.front(); q.pop();\n    for (int v : adj[u])\n        if (dist[v] < 0) { dist[v] = dist[u] + 1; q.push(v); }\n}\n```\n\n### 문제 13. 안정 정렬 (8절)\n\n플레이어 목록을 이름순으로 정렬해 둔 뒤, `std::sort` 로 점수 내림차순 정렬을 했습니다. 점수가 같은 플레이어들이 이름순으로 남는다고 보장됩니까? 보장되지 않는다면 무엇을 써야 합니까?\n\n**답:** 보장되지 않습니다. `std::sort` 는 안정 정렬이 아니기 때문입니다.\n\n같은 키를 가진 원소의 기존 순서를 지키려면 `std::stable_sort` 를 씁니다. 또는 비교 함수에 두 번째 키인 이름을 넣어서 한 번에 정렬합니다. 언리얼에서는 `Algo::StableSort` 와 `Algo::StableSortBy` 가 같은 역할을 합니다.\n"}, {"id": "02-unreal-core", "tab": "언리얼 코어", "title": "02. 언리얼 코어 학습 노트 (UE5 C++)", "md": "# 02. 언리얼 코어 학습 노트 (UE5 C++)\n\n> 이 노트는 UE5 C++ 게임 클라이언트 프로그래머의 기술 면접과 필기 테스트를 준비하기 위한 노트입니다.\n> 기준 엔진은 UE 5.8입니다. 2026-11-21에 \"(확인 필요)\"로 표시해 두었던 항목을 UE 5.8 엔진 소스(`<엔진 설치 폴더>\\Engine\\Source`)와 대조해 고쳤습니다. 엔진 근거 경로는 모두 `Engine/Source/` 를 기준으로 적었습니다. 소스만으로 확인할 수 없는 내용, 주로 \"몇 버전부터 그랬는지\"는 \"(확인 필요)\"로 남겨 두었습니다.\n\n## 한 장 요약\n\n| # | 주제 | 한 줄 핵심 | 면접 빈출도 |\n|---|---|---|---|\n| 1 | 리플렉션과 UHT | 매크로로 표시한 선언을 UHT가 읽어 `.generated.h`와 `.gen.cpp`를 만들고, GC·직렬화·블루프린트·리플리케이션은 모두 이 메타데이터를 바탕으로 동작합니다. | 상 |\n| 2 | GC와 도달성 | GC는 루트에서 UPROPERTY 참조를 따라가 도달하지 못한 UObject를 수거하며(mark-sweep), 리플렉션 밖에 있는 참조는 알지 못합니다. | 상 |\n| 3 | 포인터 종류 | 소유하고 GC가 추적해야 하면 `UPROPERTY TObjectPtr`, 관찰만 하면 `TWeakObjectPtr`, 나중에 로드하려면 `TSoft*Ptr`, UObject가 아니면 스마트 포인터를 씁니다. | 상 |\n| 4 | Actor 수명주기 | 스폰한 액터와 맵에서 로드한 액터는 초기화 경로가 다르고, Destroy는 즉시 해제가 아니라 표시해 두었다가 다음 GC에서 해제하는 동작입니다. | 상 |\n| 5 | ActorComponent 수명주기 | 컴포넌트 등록(OnRegister), 초기화(InitializeComponent), 게임 시작(BeginPlay)은 서로 다른 단계입니다. | 중 |\n| 6 | 서브시스템 | 서브시스템은 수명이 맞는 바깥 객체(Engine, GameInstance, World, LocalPlayer)에 붙어 자동으로 만들어지는 싱글턴입니다. | 중 |\n| 7 | 델리게이트 | 싱글·멀티·다이나믹 델리게이트가 어떻게 다른지, 바인딩한 대상이 사라질 때 무엇이 안전한지가 핵심입니다. | 상 |\n| 8 | 모듈과 빌드 | Build.cs 의존성의 Public/Private 구분, 모듈 로딩 단계, `_API` 내보내기, 전방 선언으로 컴파일 시간을 관리합니다. | 중 |\n\n---\n\n## 1. 리플렉션과 UHT\n\n### 핵심\n\n#### 리플렉션 정보는 빌드 전에 코드로 만들어집니다\n\n리플렉션(reflection)은 프로그램이 실행 중에 자기 타입의 정보, 예를 들어 클래스 이름이나 멤버 목록을 알아내는 기능입니다. C++에는 이런 런타임 리플렉션이 없습니다. 그래서 언리얼은 `UCLASS`, `USTRUCT`, `UENUM`, `UPROPERTY`, `UFUNCTION` 매크로로 표시한 선언을 **UHT(Unreal Header Tool)** 가 빌드 전에 읽어 들이고, 그 정보를 담은 `X.generated.h`와 `X.gen.cpp`를 만들어 냅니다.\n\n```cpp\n#include \"CoreMinimal.h\"\n#include \"Components/ActorComponent.h\"\n#include \"WeaponComponent.generated.h\" // 반드시 마지막 include입니다.\n\nUCLASS(meta = (BlueprintSpawnableComponent))\nclass UWeaponComponent : public UActorComponent\n{\n    GENERATED_BODY()\n\npublic:\n    UPROPERTY(EditDefaultsOnly)\n    float MaxAmmo = 30.f;\n};\n```\n\n위 코드에서 `UCLASS`와 `UPROPERTY`는 \"이 클래스와 이 멤버를 엔진에 알려 달라\"는 표시입니다. `GENERATED_BODY()`는 UHT가 만든 코드를 클래스 본문 안으로 펼치는 자리입니다. 그리고 `#include \"X.generated.h\"`는 헤더의 **마지막 include**여야 합니다. 이것은 UHT가 정한 규칙입니다.\n\n#### UPROPERTY를 붙이는 것은 표기 문제가 아닙니다\n\nUHT가 만든 메타데이터(`UClass`, `FProperty`, `UFunction`)는 엔진 곳곳에서 쓰입니다. GC의 참조 추적, 직렬화(serialization), 에디터의 디테일 패널, 블루프린트 노출, 리플리케이션, RPC가 모두 이 정보를 바탕으로 동작합니다.\n\n쉽게 말하면 `UPROPERTY`를 붙이느냐 마느냐는 보기 좋게 적는 문제가 아니라, **엔진이 그 멤버의 존재를 아느냐**의 문제입니다. 표시하지 않은 멤버는 GC도, 저장 시스템도, 네트워크도 알지 못합니다.\n\n#### CDO: 클래스마다 하나씩 있는 기본값 객체\n\n모든 UCLASS에는 **CDO(Class Default Object)** 가 하나씩 있습니다. CDO는 그 클래스의 기본값을 담아 두는 특별한 인스턴스입니다. 생성자는 게임 중에 액터를 만들 때뿐 아니라 이 CDO를 만들 때도 실행되며, 이렇게 정해진 기본값이 모든 인스턴스와 블루프린트 기본값의 원본이 됩니다.\n\n하지만 CDO는 월드도 다른 액터도 없는 상태에서 만들어집니다. 그래서 생성자에서는 **기본값을 정하는 일만** 해야 합니다.\n\n#### 생성자에서 해도 되는 일과 하면 안 되는 일\n\n생성자에서 해도 되는 일은 다음과 같습니다.\n\n- `CreateDefaultSubobject`로 기본 컴포넌트를 만듭니다.\n- 멤버에 기본값을 대입합니다.\n- 틱 설정을 합니다.\n- `ConstructorHelpers`를 씁니다. 다만 이 도구는 생성자에서만 쓸 수 있고 에셋 경로를 코드에 직접 적게 되므로, 실제 제품 코드에서는 피하는 편이 좋습니다.\n\n생성자에서 하면 안 되는 일은 다음과 같습니다.\n\n- `GetWorld()`에 의존하는 작업을 합니다.\n- 다른 액터를 검색하거나 스폰합니다.\n- 게임 객체를 대상으로 타이머나 델리게이트를 바인딩합니다.\n- 가상 함수의 다형성에 기댑니다.\n- 게임플레이 상태를 읽습니다.\n\n```cpp\nUWeaponComponent::UWeaponComponent()\n{\n    // 기본값만 정합니다. 월드나 다른 액터는 아직 없을 수 있습니다.\n    bWantsInitializeComponent = true;\n    SetIsReplicatedByDefault(true);\n}\n```\n\n위 코드에서 생성자는 \"초기화 단계에서 불러 달라\"는 플래그와 \"기본으로 복제한다\"는 설정만 해 둡니다. 실제로 월드나 권한(authority)을 확인해야 하는 초기화는 나중 단계인 `InitializeComponent`에서 합니다.\n\n#### 정리\n\n언리얼은 매크로로 표시한 선언을 UHT가 읽어 리플렉션 정보를 코드로 만들어 넣고, 엔진의 주요 기능은 모두 이 정보를 바탕으로 동작합니다. 클래스마다 CDO가 하나씩 있고 생성자는 CDO를 만들 때도 실행되므로, 생성자에서는 기본값 설정만 하고 월드가 필요한 일은 나중 단계로 미룹니다.\n\n### 흔한 함정\n- 생성자에서 `GetWorld()`나 `GetOwner()`를 통해 게임 상태를 읽으면 안 됩니다. CDO를 만드는 시점에는 월드가 없으므로 null이 나오거나 의미 없는 값이 나옵니다.\n- 생성자의 기본값을 바꿨는데, 이미 저장해 둔 블루프린트나 레벨 인스턴스의 값은 그대로인 경우가 있습니다. 언리얼은 기본값과 다른 값만 저장하는 델타 직렬화를 쓰기 때문에, 직렬화된 값이 CDO 기본값을 덮어씁니다.\n- UObject 포인터 멤버에 UPROPERTY를 붙이지 않으면 에디터에 보이지 않는 것으로 끝나지 않습니다. GC가 그 참조를 알지 못하게 됩니다(2절 참고).\n\n### 면접 질문\n1. **UHT는 무엇을 생성하고, 왜 필요한가?**\n   UHT는 매크로로 표시한 선언을 읽어 두 가지 파일을 만듭니다. `generated.h`에는 클래스 본문 매크로와 `StaticClass` 같은 함수가 들어가고, `gen.cpp`에는 UClass와 FProperty를 등록하는 코드가 들어갑니다. C++에는 리플렉션이 없기 때문에, GC나 직렬화, 블루프린트, 리플리케이션이 쓸 타입 정보를 빌드 시점에 코드로 만들어 넣는 것입니다.\n2. **CDO란 무엇이고 어디에 쓰이나?**\n   CDO는 클래스마다 하나씩 있는 기본값 인스턴스이며, 생성자를 실행해서 만듭니다. 새 인스턴스를 만들 때 초기값을 복사해 오는 원본이 되고, 델타 직렬화에서 무엇이 바뀌었는지 비교하는 기준이 됩니다. 또 DeveloperSettings처럼 `GetDefault<T>()`로 설정값을 읽을 때도 CDO를 씁니다.\n3. **생성자 대신 어디에서 초기화해야 하나?**\n   컴포넌트 생성과 기본값 설정은 생성자에서 합니다. 에디터에서 배치할 때 반응해야 하는 것은 `OnConstruction`, 컴포넌트끼리 연결하는 일은 `PostInitializeComponents`, 게임플레이를 시작하는 일은 `BeginPlay`에서 합니다. 월드나 다른 액터가 필요한 작업은 모두 생성자 이후 단계로 미룹니다.\n\n### 실습 과제\n1. 빈 프로젝트에 `AMyActor`를 만들고 생성자에 `UE_LOG(LogTemp, Warning, TEXT(\"Ctor %s World=%p CDO=%d\"), *GetName(), GetWorld(), HasAnyFlags(RF_ClassDefaultObject))`를 넣습니다. 에디터를 시작할 때 `Default__MyActor`가 찍히는 것과, 레벨에 배치하거나 PIE를 시작할 때 다시 찍히는 것을 확인합니다.\n2. `UPROPERTY` 하나를 추가하거나 삭제한 뒤 `MyActor.generated.h`와 `MyActor.gen.cpp`를 열어, 생성 코드가 어떻게 바뀌는지 diff로 비교합니다. UE 5.8에서 이 파일들은 `<프로젝트>/Intermediate/Build/<플랫폼>/<AppName>/Inc/<모듈>/UHT/` 에 있습니다. 예를 들면 `Intermediate/Build/Win64/UnrealEditor/Inc/<모듈>/UHT/<클래스>.gen.cpp` 입니다(근거: UBT `UEBuildModuleCPP.cs:332`). 중단점은 `UClass::GetDefaultObject`와 `UClass::CreateDefaultObject`에 겁니다. `CreateDefaultObject`는 protected virtual 함수입니다(근거: `Runtime/CoreUObject/Public/UObject/Class.h:4519`, `:4894-4899`).\n\n### 더 읽을 곳\n- Epic 문서의 'Unreal Engine Reflection System', 'Objects', 'Properties', 'UFunctions'\n- Tom Looman 블로그의 UE C++ 입문·UPROPERTY 관련 글\n\n---\n\n## 2. GC와 도달성\n\n### 핵심\n\n#### 마크 앤 스윕: 닿지 않는 객체를 거둬 갑니다\n\n언리얼 GC는 **마크 앤 스윕(mark and sweep)** 방식으로 동작합니다. 먼저 루트 집합(root set)에서 출발해 참조를 차례로 따라가며 닿을 수 있는 UObject에 표시를 합니다. 그다음 표시가 없는, 즉 도달할 수 없는(unreachable) 객체를 수거합니다. 그래서 언리얼 GC를 이해하는 핵심은 \"이 객체가 루트에서 닿을 수 있는가\"라는 도달성(reachability) 판정입니다.\n\n#### GC는 리플렉션이 아는 참조만 따라갑니다\n\nGC가 따라가는 참조는 **리플렉션이 아는 참조**뿐입니다. 구체적으로는 `UPROPERTY`가 붙은 UObject 포인터와 `TObjectPtr`, `TArray<TObjectPtr<>>`나 `TMap` 같은 UPROPERTY 컨테이너, 그리고 `AddReferencedObjects`로 직접 보고한 참조입니다.\n\n```cpp\nUCLASS()\nclass AMyActor : public AActor\n{\n    GENERATED_BODY()\n\n    UMyObject* RawRef;                   // GC가 모르는 참조입니다.\n\n    UPROPERTY()\n    TObjectPtr<UMyObject> TrackedRef;    // GC가 따라가는 참조입니다.\n};\n```\n\n위 코드에서 `TrackedRef`가 가리키는 객체는 `AMyActor`가 살아 있는 동안 수거되지 않습니다. 하지만 `RawRef`는 GC에게 보이지 않습니다. 다른 곳에서 그 객체를 붙잡고 있지 않다면 GC가 객체를 수거하고, `RawRef`는 이미 사라진 메모리를 가리키는 댕글링(dangling) 포인터가 됩니다.\n\n#### 루트 집합에 직접 넣는 방법\n\nUPROPERTY로 붙잡을 수 없는 경우에는 객체를 직접 루트처럼 붙잡아 둘 수 있습니다. 방법은 세 가지입니다.\n\n- `AddToRoot()`와 `RemoveFromRoot()`를 씁니다. 객체가 전역 수명을 갖게 되므로, 반드시 해제 호출과 짝을 맞춰야 합니다.\n- UObject가 아닌 C++ 객체라면 `FGCObject`를 상속하고 `AddReferencedObjects`를 구현해 참조를 보고합니다.\n- `TStrongObjectPtr`를 씁니다. 내부에서 참조를 등록해 두는 RAII 래퍼라서, 래퍼가 사라질 때 참조도 함께 풀립니다.\n\n#### 클러스터와 Garbage Elimination\n\n클러스터(cluster)는 함께 살고 함께 사라지는 객체 묶음, 주로 쿠킹된 에셋을 한 단위로 취급해 마킹 비용을 줄이는 최적화입니다. 면접에서는 개념만 알면 충분합니다.\n\nUE5에서는 예전의 pending kill 개념이 \"garbage 표시(`MarkAsGarbage`)\"로 바뀌었습니다. GC는 garbage로 표시된 객체를 가리키는 리플렉션 참조를 nullptr로 지우고, 그 객체를 수거합니다. 이 동작을 Garbage Elimination이라고 부릅니다.\n\n이 동작은 `gc.GarbageEliminationEnabled` 설정으로 켜고 끕니다. 기본값은 켜짐이고, ini 섹션은 `[/Script/Engine.GarbageCollectionSettings]` 입니다. 옛 이름인 `gc.PendingKillEnabled` 는 deprecated 상태이며, 명령줄 인자 `-DisableGarbageElimination` 으로 끌 수도 있습니다(근거: `Runtime/CoreUObject/Private/UObject/ObjectBaseUtility.cpp:168-199`, `GarbageCollection.cpp:3030`, `:3069-3073`).\n\n#### 증분 도달성 분석\n\n도달성 분석을 여러 프레임에 나누어 하는 증분(incremental) 방식도 있습니다. `gc.AllowIncrementalReachability`(기본 0, 실험 기능)와 `gc.IncrementalReachabilityTimeLimit` 으로 켭니다(근거: `GarbageCollection.cpp:303-316`). 이 기능이 들어온 버전은 소스에 적혀 있지 않습니다. 5.4 무렵으로 기억하지만 (확인 필요)입니다.\n\n#### 정리\n\n언리얼 GC는 루트에서 리플렉션 참조를 따라가 닿지 않는 UObject를 수거합니다. UPROPERTY가 없는 원시 포인터는 GC가 모르므로 댕글링이 될 수 있습니다. UPROPERTY를 쓸 수 없는 곳에서는 `FGCObject`, `TStrongObjectPtr`, `AddToRoot()`로 객체를 붙잡습니다.\n\n### 흔한 함정\n- UPROPERTY가 없는 `UObject*` 멤버를 \"다른 곳에서 참조하고 있으니 괜찮다\"고 생각하고 두는 경우입니다. 그 다른 참조가 끊기는 순간 포인터는 댕글링이 됩니다. 크래시가 GC 주기에 따라 났다 안 났다 하므로 원인을 찾기도 어렵습니다.\n- `AddToRoot()`를 호출한 뒤 `RemoveFromRoot()`를 빠뜨리는 경우입니다. 객체가 누수되어 레벨을 전환한 뒤에도 남아 있습니다. PIE를 여러 번 반복할 때 특히 잘 드러납니다.\n- UObject가 아닌 구조체나 람다, UPROPERTY가 아닌 `TMap`에 UObject 포인터를 담는 경우입니다. 1절과 같은 문제가 생깁니다. USTRUCT라도 그 USTRUCT 자체가 UPROPERTY로 소유되어 있어야 안쪽의 참조가 추적됩니다.\n\n### 면접 질문\n1. **언리얼 GC는 어떤 객체를 수거하나?**\n   루트 집합에서 출발해 리플렉션 참조와 `AddReferencedObjects`로 보고된 참조를 따라갔을 때, 도달할 수 없는 UObject를 수거합니다. 참조 카운트 방식이 아니므로, 서로를 가리키는 순환 참조가 있어도 루트에서 끊기면 함께 수거됩니다.\n2. **UObject가 아닌 클래스가 UObject를 붙잡으려면?**\n   `FGCObject`를 상속하고 `AddReferencedObjects(FReferenceCollector&)`에서 참조를 보고하거나, `TStrongObjectPtr`를 멤버로 둡니다. UE 5.8에서는 `GetReferencerName()` 도 `AddReferencedObjects` 와 함께 순수 가상 함수라서 반드시 구현해야 합니다(근거: `Runtime/CoreUObject/Public/UObject/GCObject.h:195`, `:198`). 이것이 필수가 된 버전은 (확인 필요)입니다. 짧은 범위에서 잠깐 붙잡을 때는 `TStrongObjectPtr`, 여러 객체를 관리하는 매니저라면 `FGCObject`가 자연스럽습니다.\n3. **Destroy한 액터의 메모리는 언제 해제되나?**\n   Destroy는 액터를 월드에서 제거하고 garbage로 표시할 뿐입니다. 실제 메모리 해제는 그 뒤에 GC가 돌 때 `BeginDestroy` → `FinishDestroy` → 소멸자 순서로 일어납니다. 그 사이에 원시 포인터로 접근하면 메모리에는 있지만 무효인 객체를 건드리게 되므로, `IsValid`로 검사해야 합니다.\n\n### 실습 과제\n1. **댕글링 재현**: `AMyActor`에 `UMyObject* RawRef;`(UPROPERTY 없음)와 `UPROPERTY() TObjectPtr<UMyObject> TrackedRef;`를 두고, BeginPlay에서 각각 `NewObject`로 채웁니다. 콘솔에서 `obj gc`를 실행하거나 `GEngine->ForceGarbageCollection(true)`를 호출한 뒤, 두 포인터의 `GetName()`을 찍어 RawRef만 깨지는 것을 확인합니다. 결과는 크래시일 수도, 쓰레기 값일 수도 있으며 실행할 때마다 다를 수 있습니다. `UMyObject::BeginDestroy`에 로그를 넣으면 수거 시점을 볼 수 있습니다. 중단점은 `CollectGarbage`와 `UObject::ConditionalBeginDestroy`에 겁니다.\n2. `obj refs name=<객체 이름 또는 경로> [shortest|longest|all|external|direct|full|minimal]` 콘솔 명령으로 어떤 참조 경로가 객체를 붙잡고 있는지 출력해 봅니다(근거: `Runtime/CoreUObject/Private/UObject/Obj.cpp:5159`, `:5375-5420`). 또 객체를 `TStrongObjectPtr` 지역 변수로 감싼 동안 GC를 돌려, 객체가 살아남는지 확인합니다.\n\n### 더 읽을 곳\n- Epic 문서의 'Garbage Collection'(Objects 하위 문서), 'Unreal Object Handling'\n- Tom Looman 블로그의 메모리·GC 관련 글\n\n---\n\n## 3. 포인터 종류 비교\n\n### 핵심\n\n#### 두 가지 기준으로 고릅니다\n\nUObject를 가리키는 포인터는 두 가지 기준으로 고릅니다. 첫째는 \"누가 대상의 수명을 정하는가\", 즉 GC가 대상을 살려 두어야 하는가입니다. 둘째는 \"대상을 언제 로드하는가\", 즉 하드 참조인가 소프트 참조인가입니다. UObject가 아닌 일반 C++ 객체에는 표준 스마트 포인터에 해당하는 `TSharedPtr`와 `TUniquePtr`를 씁니다.\n\n#### TObjectPtr: 멤버 UPROPERTY에 권장하는 표기\n\n`TObjectPtr<T>`는 UE5에서 멤버 UPROPERTY에 쓰도록 권장하는 표기입니다. 에디터 빌드에서는 접근 추적, 지연 해석(late resolve), 타입 안전 검사가 덧붙습니다.\n\n하지만 이 기능을 켜는 `UE_WITH_OBJECT_HANDLE_LATE_RESOLVE`, `UE_WITH_OBJECT_HANDLE_TRACKING`, `UE_WITH_OBJECT_HANDLE_TYPE_SAFETY` 는 모두 `WITH_EDITORONLY_DATA` 일 때만 켜집니다. 그래서 쿠킹된 게임에서 `TObjectPtr`는 원시 포인터와 같습니다(근거: `Runtime/CoreUObject/Public/UObject/ObjectHandleDefines.h:11`, `:16`, `:21`). 지역 변수와 함수 인자에는 보통 원시 포인터를 씁니다.\n\n#### 소프트 참조와 TSubclassOf\n\n`TSoftObjectPtr`와 `TSoftClassPtr`는 에셋의 경로만 들고 있습니다. 그래서 이 참조를 가지고 있다는 이유만으로 에셋이 로드되지는 않습니다. 메모리와 로딩 시간을 관리하고 싶을 때 쓰며, 필요한 순간에 `LoadSynchronous`로 바로 로드하거나 `FStreamableManager`로 비동기 로드합니다.\n\n`TSubclassOf<T>`는 `UClass*`에 \"T의 하위 클래스만 담을 수 있다\"는 제약을 건 하드 참조입니다. 에디터에서는 드롭다운 목록이 T의 하위 클래스로 걸러져 보입니다.\n\n#### 관찰만 하는 참조: TWeakObjectPtr\n\n`TWeakObjectPtr`는 대상의 수명에 관여하지 않고 관찰만 합니다. 대상이 사라지면 `Get()`이 null을 돌려주므로, 한 번 `Get()`해서 확인한 뒤 씁니다.\n\n```cpp\nif (AActor* Causer = DamageInfo.Causer.Get())\n{\n    // 이 블록 안에서만 Causer를 씁니다.\n}\n```\n\n위 코드에서 `Causer`가 이미 사라졌다면 `Get()`이 null을 돌려주어 블록에 들어가지 않습니다. 예를 들어 적에게 피해를 준 투사체가 먼저 사라졌더라도 안전하게 넘어갈 수 있습니다.\n\n| 종류 | GC가 수명 유지? | 대상이 사라지면 | 주 용도 |\n|---|---|---|---|\n| `T*` 원시 포인터(UPROPERTY 없음) | 아니오 | 댕글링이 됩니다 | 함수 인자, 지역 변수, 한 호출 안에서만 씁니다 |\n| `UPROPERTY() TObjectPtr<T>` | 예(강한 참조). 단, garbage로 표시된 대상은 붙잡지 못합니다 | Destroy 시 garbage로 표시되고, 다음 GC에서 null로 정리됩니다(`gc.GarbageEliminationEnabled` 켜짐 기준) | 소유하거나 의존하는 객체 멤버 |\n| `TWeakObjectPtr<T>` | 아니오 | `Get()`이 null, `IsValid()`가 false입니다 | 관찰만 하는 참조, 람다 캡처, 캐시 |\n| `TSoftObjectPtr<T>` / `TSoftClassPtr<T>` | 로드 전에는 상관없고, 로드 후에는 별도의 강한 참조가 필요합니다 | 경로만 남습니다 | 큰 에셋이나 선택적 콘텐츠의 지연 로드 |\n| `TSubclassOf<T>` | 예(UClass 하드 참조) | - | 스폰할 클래스, BP 클래스 지정 |\n| `TStrongObjectPtr<T>` | 예(루트처럼 붙잡습니다) | - | 비 UObject 코드가 잠시 붙잡을 때 |\n| `TSharedPtr`/`TSharedRef`/`TWeakPtr` | UObject에는 쓰지 않습니다 | 참조 카운트가 0이 되면 소멸합니다 | Slate 위젯, 일반 C++ 객체 공유 |\n| `TUniquePtr<T>` | UObject에는 쓰지 않습니다 | 소유자가 소멸할 때 함께 소멸합니다 | 단독 소유하는 일반 C++ 객체 |\n\n#### 정리\n\nUObject 포인터는 GC가 수명을 지켜야 하는지와 언제 로드할지를 기준으로 고릅니다. 소유하는 멤버는 `UPROPERTY TObjectPtr`, 관찰만 하면 `TWeakObjectPtr`, 나중에 로드할 에셋은 소프트 포인터를 씁니다. UObject가 아닌 객체에는 `TSharedPtr`나 `TUniquePtr`를 씁니다.\n\n### 흔한 함정\n- `TWeakObjectPtr`를 `Get()` 없이 여러 번 역참조하는 경우입니다. 역참조할 때마다 검사는 하지만, 그 사이에 상태가 바뀔 수 있습니다. 한 번 `Get()`해서 지역 원시 포인터에 받아 두고, 그 포인터로 일을 끝냅니다.\n- `TSoftObjectPtr::LoadSynchronous()`로 로드한 결과를 아무도 강하게 참조하지 않는 경우입니다. 그러면 다음 GC에서 에셋이 다시 내려갑니다. 로드한 뒤에는 UPROPERTY 강한 참조나 `FStreamableHandle`을 유지해야 합니다.\n- UObject를 `TSharedPtr`로 감싸는 경우입니다. GC와 참조 카운트가 서로 수명을 정하려고 충돌합니다. UObject에는 `TSharedPtr`를 쓰지 않습니다.\n\n### 면접 질문\n1. **TWeakObjectPtr는 어떻게 대상의 소멸을 아나?**\n   `TWeakObjectPtr`는 객체 포인터 대신 전역 객체 배열의 인덱스와 시리얼 번호를 저장합니다. 대상이 사라지고 그 슬롯이 다른 객체에 재사용되면 시리얼 번호가 달라지므로, 무효로 판정합니다. 그래서 같은 메모리 자리에 새 객체가 들어와도 원래 대상으로 착각하지 않습니다.\n2. **하드 참조와 소프트 참조의 차이는?**\n   하드 참조(`TObjectPtr`, `TSubclassOf`)는 참조하는 쪽이 로드될 때 대상도 함께 로드합니다. 소프트 참조는 경로만 들고 있으므로 명시적으로 로드해야 합니다. 그 대신 참조가 줄줄이 이어지면서 메모리가 불어나는 것을 막을 수 있습니다.\n3. **TObjectPtr와 원시 포인터는 언제 구분하나?**\n   UCLASS나 USTRUCT의 UPROPERTY 멤버에는 `TObjectPtr`를 쓰고, 함수 인자와 반환값, 지역 변수에는 원시 포인터를 쓰는 것이 Epic이 권장하는 방식입니다. 이때 GC 추적 여부를 정하는 것은 `TObjectPtr`가 아니라 UPROPERTY라는 점을 함께 말합니다.\n\n### 실습 과제\n1. 액터 A가 액터 B를 `TWeakObjectPtr`와 원시 포인터로 각각 저장하게 합니다. B를 `Destroy()`한 직후와 GC를 돌린 직후에 `IsValid(Raw)`, `Weak.IsValid()`, `Weak.Get()`을 찍고, 차이를 표로 정리합니다.\n2. `TSoftObjectPtr<UStaticMesh>` UPROPERTY에 메시를 지정하고 `FStreamableManager::RequestAsyncLoad`로 로드합니다. 그다음 핸들을 버렸을 때와 유지했을 때, GC를 돌린 뒤의 `IsValid()` 결과를 비교합니다. 중단점은 `FStreamableManager::RequestAsyncLoad`와 `TSoftObjectPtr::LoadSynchronous`에 겁니다.\n\n### 더 읽을 곳\n- Epic 문서의 'Smart Pointer Library', 'Referencing Assets'(Asynchronous Asset Loading 포함), 'TObjectPtr' 관련 이주(migration) 문서\n- Tom Looman 블로그의 소
