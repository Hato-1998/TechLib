프트 참조·비동기 로딩 글\n\n---\n\n## 4. Actor 수명주기\n\n### 핵심\n\n#### 스폰 경로: SpawnActor는 어떤 순서로 액터를 준비하는가\n\n게임 중에 `UWorld::SpawnActor`로 액터를 만들면, 엔진은 아래 순서로 액터를 준비합니다. 순서는 UE 5.8 소스를 기준으로 했습니다.\n\n1. **객체 생성(생성자)**: 메모리에 객체가 만들어지고 생성자가 실행됩니다. 이 시점에는 `CreateDefaultSubobject`로 만든 기본 컴포넌트와 기본값만 준비되어 있습니다.\n2. **`PostSpawnInitialize` 안에서 컴포넌트 등록 → `PostActorCreated`**: 먼저 `RegisterAllComponents`가 각 컴포넌트의 `OnRegister`를 부르며 컴포넌트를 월드에 등록하고, 그다음 `PostActorCreated`가 호출됩니다. 즉 `PostActorCreated`가 불릴 때는 컴포넌트 등록이 이미 끝나 있습니다.\n3. **`FinishSpawning` → `ExecuteConstruction`**: 지연 스폰이 아니라면 같은 호출 안에서 바로 `FinishSpawning`이 이어지고, SCS와 블루프린트 Construction Script가 실행된 뒤 `OnConstruction`이 불립니다. 이 단계가 끝나면 블루프린트에서 추가한 컴포넌트까지 갖춰집니다.\n4. **`PostActorConstruction` 안에서 `PreInitializeComponents` → `InitializeComponents` → `PostInitializeComponents`**: 각 컴포넌트의 `InitializeComponent`가 이 사이에 불립니다. 이 단계가 끝나면 모든 컴포넌트가 초기화되어 서로 연결해도 되는 상태가 됩니다. 단, 이 초기화 단계는 `World->AreActorsInitialized()` 가 참일 때만 실행됩니다.\n5. **`DispatchBeginPlay` → `BeginPlay`**: 월드가 이미 BeginPlay를 시작했고, 복제를 기다려야 하는 대상이 아니라면 곧바로 `BeginPlay`가 호출됩니다. 이 시점부터 액터는 게임플레이에 참여합니다.\n\n(근거: `Runtime/Engine/Private/Actor.cpp:4276`(PostSpawnInitialize), `:4336`(RegisterAllComponents), `:4354`(PostActorCreated), `:4430-4449`(PostActorConstruction 안의 PreInitializeComponents), `ActorConstruction.cpp:939`, `:1007`)\n\n#### 지연 스폰: BeginPlay 전에 값을 넣는 표준 방법\n\n`SpawnActorDeferred`는 위 순서 중 객체 생성까지만 하고 멈춥니다. 호출자가 필요한 값을 넣은 뒤 `FinishSpawning`을 부르면, Construction 이후 단계가 이어서 진행됩니다. 그래서 \"생성 직후, BeginPlay 전에 값을 주입\"하고 싶을 때 쓰는 표준 방법입니다.\n\n```cpp\nAProjectile* Projectile = GetWorld()->SpawnActorDeferred<AProjectile>(ProjectileClass, SpawnTransform);\nProjectile->Damage = 25.f;                 // BeginPlay 전에 값을 넣습니다.\nProjectile->FinishSpawning(SpawnTransform); // 여기서 Construction 이후 단계가 진행됩니다.\n```\n\n위 코드에서 `Damage`는 `FinishSpawning`보다 먼저 들어가므로, 투사체의 `PostInitializeComponents`와 `BeginPlay`는 이미 정해진 피해량을 보고 동작할 수 있습니다.\n\n#### 맵 로드 경로: 레벨에 배치한 액터는 다르게 만들어집니다\n\n하지만 레벨에 저장되어 있던 액터는 스폰이 아니라 역직렬화로 만들어집니다. 이때는 `PostLoad`를 거치고 `PostActorCreated`는 호출되지 않습니다.\n\n쿠킹된 게임에서는 Construction Script가 다시 실행되지 않고, 저장해 둔 결과를 그대로 씁니다. `RerunConstructionScripts` 는 `WITH_EDITOR` 에서만 존재하고, 월드는 `!FPlatformProperties::RequiresCookedData()` 일 때만 재실행을 요청하기 때문입니다(근거: `ActorConstruction.cpp:253-254`, `World.cpp:3872`).\n\n그 뒤 월드를 초기화할 때 `ULevel::RouteActorInitialize`가 `PreInitializeComponents`와 `PostInitializeComponents`를 호출하고, 게임 모드가 매치를 시작하면 `BeginPlay`가 호출됩니다(근거: `Level.cpp:3838`).\n\n#### 종료: EndPlay와 그 이유\n\n액터가 게임에서 빠질 때는 `EndPlay(EEndPlayReason)`가 호출됩니다. 이유는 다음 다섯 가지입니다.\n\n- `Destroyed`: 명시적으로 파괴했습니다.\n- `LevelTransition`: 다른 맵으로 이동했습니다.\n- `EndPlayInEditor`: PIE를 종료했습니다.\n- `RemovedFromWorld`: 레벨 스트리밍으로 레벨이 내려갔습니다.\n- `Quit`: 앱을 종료했습니다.\n\n정리 코드는 `BeginDestroy`나 소멸자보다 `EndPlay`에 두는 것이 원칙입니다. `EndPlay` 시점에는 월드가 아직 유효하기 때문입니다.\n\n#### Destroy와 메모리 해제 사이\n\n`Destroy()`를 부르면 `EndPlay`가 호출되고, 컴포넌트 등록이 해제되며, 액터가 garbage로 표시됩니다. 하지만 메모리는 이때 풀리지 않습니다. 다음 GC에서 `BeginDestroy` → (`IsReadyForFinishDestroy`가 true일 때) `FinishDestroy` → 소멸자 순서로 풀립니다.\n\n그 사이 객체는 메모리에 남아 있지만 무효인 상태입니다. `IsValid(Obj)`는 포인터가 null이거나 garbage로 표시되어 있으면 false를 돌려줍니다. 액터가 파괴 진행 중인지는 `IsActorBeingDestroyed()`로 판정합니다.\n\n#### 정리\n\n스폰한 액터는 생성자, 컴포넌트 등록, Construction, 컴포넌트 초기화, BeginPlay 순서로 준비되고, 레벨에 배치한 액터는 역직렬화로 만들어져 `PostActorCreated`를 건너뜁니다. BeginPlay 전에 값을 넣으려면 `SpawnActorDeferred`와 `FinishSpawning`을 씁니다. 정리 코드는 `EndPlay`에 두고, Destroy 이후에는 메모리가 다음 GC까지 남아 있으므로 `IsValid`로 검사합니다.\n\n### 흔한 함정\n- `BeginPlay`에서 다른 액터의 `BeginPlay`가 이미 끝났다고 가정하는 경우입니다. 액터끼리의 BeginPlay 순서는 보장되지 않습니다. 서로 의존한다면 이벤트나 지연 바인딩으로 풀어야 합니다.\n- `EndPlay`나 `BeginPlay`를 오버라이드하면서 `Super::` 호출을 빠뜨리는 경우입니다. 컴포넌트의 EndPlay나 타이머 정리 같은 엔진 처리가 빠집니다.\n- `Destroy()` 직후 같은 프레임에서 포인터가 아직 non-null이니 안전하다고 판단하는 경우입니다. 반드시 `IsValid`로 검사해야 합니다. 또 클라이언트에서 리플리케이트된 액터를 Destroy하는 것은 권한 위반입니다.\n\n### 면접 질문\n1. **SpawnActor 시 호출 순서를 말해 보라.**\n   생성자 → 컴포넌트 등록(`OnRegister`) → `PostActorCreated` → `OnConstruction` 순서로 진행됩니다. 그다음 `PostActorConstruction` 안에서 `PreInitializeComponents` → 컴포넌트별 `InitializeComponent` → `PostInitializeComponents`가 호출되고, 마지막으로 `BeginPlay`가 호출됩니다. BeginPlay 전에 값을 넣어야 한다면 `SpawnActorDeferred`로 만들고 값을 넣은 뒤 `FinishSpawning`을 부릅니다.\n2. **레벨에 배치된 액터와 스폰한 액터의 차이는?**\n   레벨에 배치된 액터는 역직렬화로 만들어지므로 `PostLoad`를 거치고, `PostActorCreated`는 호출되지 않습니다. 두 경우 모두 `PostInitializeComponents`와 `BeginPlay`는 거칩니다. 다만 배치된 액터의 BeginPlay는 월드가 플레이를 시작할 때 한꺼번에 호출됩니다.\n3. **EndPlay와 BeginDestroy의 차이는?**\n   `EndPlay`는 게임플레이 수준의 종료 콜백으로, 월드와 다른 액터가 아직 유효한 시점에 불리며 종료 이유(`EEndPlayReason`)를 함께 받습니다. `BeginDestroy`는 GC가 메모리를 정리하기 시작할 때 불리는 UObject 수준의 콜백입니다. 그래서 `BeginDestroy`에는 게임 로직을 두면 안 됩니다.\n\n### 실습 과제\n1. `AMyActor`에서 생성자, `PostActorCreated`, `OnConstruction`, `PostLoad`, `PreInitializeComponents`, `PostInitializeComponents`, `BeginPlay`, `EndPlay`, `Destroyed`, `BeginDestroy`, `FinishDestroy`를 모두 오버라이드하고, `GFrameCounter`와 함께 로그를 찍습니다. 그리고 (a) 레벨에 배치한 뒤 PIE 시작, (b) `SpawnActor`, (c) `SpawnActorDeferred` 후 잠시 기다렸다가 `FinishSpawning`, (d) `Destroy()` 후 `obj gc`의 네 경우에서 호출 순서를 비교합니다.\n2. 중단점은 `UWorld::SpawnActor`, `AActor::PostSpawnInitialize`, `AActor::FinishSpawning`, `AActor::PostActorConstruction`, `AActor::DispatchBeginPlay`, `UWorld::DestroyActor`, `AActor::RouteEndPlay`에 겁니다. `Destroyed()` 는 `RouteEndPlay(EEndPlayReason::Destroyed)` 를 부르고, 그 안에서 `EndPlay` → `UninitializeComponents` 순서로 진행됩니다(근거: `Actor.cpp:3221-3255`).\n\n### 더 읽을 곳\n- Epic 문서의 'Actor Lifecycle', 'Spawning Actors'\n- Tom Looman 블로그의 액터 수명주기·BeginPlay 순서 관련 글\n- (네트워크 맥락의 스폰·파괴) Cedric Neukirchen의 Multiplayer Network Compendium\n\n---\n\n## 5. ActorComponent 수명주기\n\n### 핵심\n\n#### 컴포넌트가 거치는 단계\n\n액터 컴포넌트(ActorComponent)는 액터에 붙어 기능 하나를 나누어 맡는 객체입니다. 예를 들어 플레이어 캐릭터의 체력, 무기 슬롯, 화면 패널을 각각 컴포넌트로 만들 수 있습니다. 컴포넌트도 액터처럼 정해진 순서로 만들어지고 사라집니다.\n\n1. **생성자**: 보통 소유 액터의 생성자에서 `CreateDefaultSubobject`로 만들어집니다.\n2. **등록(registration)**: `OnRegister`가 불립니다. 컴포넌트를 월드에 연결하는 단계이며, 씬 컴포넌트라면 이때 렌더 상태와 물리 상태를 만듭니다.\n3. **초기화**: `InitializeComponent`가 불립니다. 단, `bWantsInitializeComponent = true`인 컴포넌트만 이 호출을 받으며, 시점은 액터의 `PostInitializeComponents` 직전입니다.\n4. **게임 시작**: `BeginPlay`가 불립니다.\n5. **종료**: `EndPlay` → `UninitializeComponent` → `OnUnregister` → `OnComponentDestroyed` 순서로 불립니다.\n\n#### 등록과 게임 시작은 서로 다른 단계입니다\n\n컴포넌트를 월드에 등록하는 일과 게임을 시작하는 일은 서로 다른 단계입니다. 에디터 뷰포트에 액터를 배치하기만 해도 컴포넌트는 등록되고 `OnRegister`가 불립니다. 하지만 이때 게임은 시작하지 않으므로 `BeginPlay`는 불리지 않습니다.\n\n그래서 `OnRegister`에는 게임플레이 로직을 두지 않습니다. 예를 들어 `OnRegister`에서 적을 찾아 공격 타이머를 걸면, 게임을 실행하지 않았는데도 에디터에서 그 코드가 돌게 됩니다.\n\n#### 런타임에 컴포넌트를 만드는 경우\n\n게임 도중에 코드로 만드는 컴포넌트는 `NewObject`로 만든 뒤 `RegisterComponent()`를 직접 호출해야 동작합니다.\n\n```cpp\nUMyComp* Comp = NewObject<UMyComp>(Owner);\nComp->RegisterComponent();\n```\n\n위 코드에서 `NewObject`의 인자로 소유 액터 `Owner`를 넘겼습니다. 등록을 하지 않으면 컴포넌트는 메모리에만 있을 뿐 월드에 연결되지 않습니다. 컴포넌트를 없앨 때는 `DestroyComponent()`를 호출합니다.\n\n이미 `BeginPlay`가 끝난 액터에 컴포넌트를 붙이면, 등록 과정에서 `InitializeComponent`와 `BeginPlay`까지 이어서 불립니다. 호출 경로는 `RegisterComponent` → `RegisterComponentWithWorld` → `AActor::HandleRegisterComponentWithWorld`입니다. 이 함수는 액터가 이미 초기화되었고 `bWantsInitializeComponent`가 켜져 있으면 `InitializeComponent`를 부르고, 액터가 BeginPlay를 시작한 상태라면 틱을 등록하고 `BeginPlay`를 부릅니다. (근거: `Runtime/Engine/Private/Components/ActorComponent.cpp:2051`, `Actor.cpp:6427-6452`)\n\n#### 왜 중요할까요?\n\n\"어느 콜백에서 무엇이 준비되어 있는가\"를 모르면 버그가 생깁니다. 소유자가 아직 null인 시점에 소유자를 쓰거나, 같은 이벤트에 두 번 바인딩하거나, 에디터에서만 터지는 오류가 대표적입니다.\n\n#### 정리\n\n컴포넌트는 생성 → 등록 → 초기화 → BeginPlay 순서로 준비됩니다. 등록은 에디터에서도 일어나므로 게임플레이 로직은 `BeginPlay`에 둡니다. 런타임에 만든 컴포넌트는 `RegisterComponent()`를 직접 불러야 동작합니다.\n\n### 흔한 함정\n- `InitializeComponent`를 오버라이드하고 `bWantsInitializeComponent`를 켜지 않으면, 그 함수는 호출되지 않습니다.\n- `NewObject`로 만든 컴포넌트에 `RegisterComponent`를 빠뜨리면 틱도 돌지 않고 렌더링도 되지 않습니다. 반대로 소유 액터를 지정하지 않고 만들면 엉뚱한 Outer에 붙습니다.\n- 블루프린트 Construction Script는 에디터에서 여러 번 다시 실행되며, 그때마다 컴포넌트를 다시 등록할 수 있습니다. 그래서 `OnRegister`에서 걸어 둔 바인딩이 중복될 수 있습니다.\n\n### 면접 질문\n1. **OnRegister와 BeginPlay의 차이는 무엇인가요?**\n   `OnRegister`는 컴포넌트가 월드에 연결될 때 불리며, 에디터에서 액터를 배치할 때도 불립니다. `BeginPlay`는 게임이 시작될 때만 불립니다. 그래서 렌더 상태나 물리 상태처럼 컴포넌트가 존재하기 위한 준비는 등록 단계에서 하고, 게임플레이 로직은 `BeginPlay`에 둡니다.\n2. **InitializeComponent는 언제 쓰나요?**\n   소유 액터의 다른 컴포넌트가 모두 만들어진 뒤, BeginPlay보다 먼저 한 번 초기화해야 할 때 씁니다. 이 함수를 받으려면 생성자에서 `bWantsInitializeComponent`를 켜야 합니다. 호출 시점은 액터의 `PostInitializeComponents`보다 앞입니다.\n3. **런타임에 컴포넌트를 추가하는 절차를 말해 주세요.**\n   먼저 소유 액터를 Outer로 해서 `NewObject`로 만듭니다. 필요하면 `SetupAttachment`나 `AttachToComponent`로 부착하고, 마지막으로 `RegisterComponent`를 호출합니다. 에디터 표시와 직렬화에 포함시키려면 인스턴스별 컴포넌트 목록 `InstanceComponents`에 넣는 `AddInstanceComponent`를 호출합니다(`Runtime/Engine/Classes/GameFramework/Actor.h:4338-4348`). 복제가 필요하다면 이와 별개로 `SetIsReplicated(true)`를 설정합니다.\n\n### 실습 과제\n1. `UMyComp`의 생성자, `OnRegister`, `InitializeComponent`, `BeginPlay`, `EndPlay`, `UninitializeComponent`, `OnUnregister`, `OnComponentDestroyed`에 로그를 찍습니다. 그리고 (a) 에디터에서 액터를 배치하고 이동할 때, (b) PIE를 시작하고 끝낼 때, (c) 런타임에 `NewObject`와 `RegisterComponent`로 만들 때의 순서를 비교합니다. 마지막으로 `bWantsInitializeComponent`를 끄고 다시 실행해 봅니다.\n2. 중단점을 `UActorComponent::RegisterComponentWithWorld`, `AActor::InitializeComponents`, `UActorComponent::UnregisterComponent`에 걸어 호출 경로를 확인합니다.\n\n### 더 읽을 곳\n- Epic 문서의 'Components', 'Actor Lifecycle'의 컴포넌트 부분\n- Tom Looman 블로그의 컴포넌트 설계 글\n\n---\n\n## 6. 서브시스템\n\n### 핵심\n\n#### 서브시스템이란\n\n서브시스템(subsystem)은 바깥 객체(outer)의 수명에 맞추어 엔진이 자동으로 만들고 없애는 싱글턴 형태의 UObject입니다. 쉽게 말하면 \"엔진이 알아서 하나씩 만들어 주는 관리자 객체\"입니다.\n\n서브시스템은 직접 `NewObject`로 만들지 않습니다. 대신 `Initialize(FSubsystemCollectionBase&)`와 `Deinitialize()`를 구현해 생성과 해제 때 할 일을 적습니다. 생성 여부를 조건으로 거르고 싶으면 `ShouldCreateSubsystem`을 구현합니다.\n\n#### 네 종류의 수명 차이\n\n서브시스템은 어느 객체에 속하느냐에 따라 수명이 다릅니다.\n\n- **`UEngineSubsystem`**: 엔진 전체와 수명이 같습니다. `UEngine::Init`에서 `EngineSubsystemCollection.Initialize`로 만들어집니다. 이 종류는 `UDynamicSubsystem`이므로, 엔진 초기화 뒤에 로드되는 모듈에 든 엔진 서브시스템은 그 모듈이 로드될 때 추가로 만들어집니다. 이 일은 `FSubsystemModuleWatcher`가 맡습니다. (근거: `Runtime/Engine/Private/UnrealEngine.cpp:2354`, `Subsystems/SubsystemCollection.cpp:20-30`)\n- **`UGameInstanceSubsystem`**: 게임 인스턴스와 수명이 같으므로 **맵을 이동해도 남아 있습니다.** 세션, 세이브, 게임 흐름 관리에 씁니다.\n- **`UWorldSubsystem`**: `UWorld`마다 하나씩 있으므로 맵이 바뀌면 새로 만들어집니다. 에디터 월드와 프리뷰 월드에도 생길 수 있어서, `ShouldCreateSubsystem`에서 `IsGameWorld()` 등으로 거르는 경우가 많습니다. 월드가 플레이를 시작할 때 불리는 `OnWorldBeginPlay` 훅이 있고, 틱이 필요하면 `UTickableWorldSubsystem`을 씁니다.\n- **`ULocalPlayerSubsystem`**: 로컬 플레이어마다 하나씩 있습니다. 분할 화면이면 여러 개가 생기고, 데디케이티드 서버에는 로컬 플레이어가 없으므로 생기지 않습니다. UI와 입력 설정에 알맞습니다.\n\n#### 어떻게 고를까요?\n\n먼저 \"이 상태가 언제 사라져야 맞는가\"를 묻습니다. 맵 단위로 사라져야 하는지, 접속 단위로 남아야 하는지, 플레이어마다 따로 있어야 하는지를 따집니다. 다음으로 \"서버에도 필요한가\"를 묻습니다.\n\n하지만 서브시스템은 리플리케이트되지 않는다는 점도 기억해야 합니다. 클라이언트와 서버가 같은 값을 공유해야 한다면 서브시스템만으로는 부족합니다.\n\n#### 정리\n\n서브시스템은 바깥 객체의 수명을 따라 엔진이 만들고 없애는 관리자 객체입니다. 맵을 넘어 남아야 하면 GameInstance, 맵과 함께 사라져야 하면 World, 플레이어마다 따로 있어야 하면 LocalPlayer를 고릅니다. 서브시스템은 리플리케이트되지 않습니다.\n\n### 흔한 함정\n- WorldSubsystem이 에디터 월드에도 만들어져, 에디터에서 게임 로직이 돌 수 있습니다. `ShouldCreateSubsystem`에서 월드 종류를 확인합니다.\n- GameInstanceSubsystem에 액터 포인터를 강하게 보관하면, 맵을 이동한 뒤에도 이전 월드의 액터를 붙잡아 누수나 댕글링 포인터가 생깁니다. 약한 참조로 두거나 맵 전환 때 비웁니다.\n- 서브시스템끼리의 초기화 순서를 가정하면 안 됩니다. `Collection.InitializeDependency<T>()`로 명시하지 않으면 순서는 보장되지 않습니다.\n\n### 면접 질문\n1. **GameInstanceSubsystem과 WorldSubsystem은 어떻게 고르나요?**\n   맵을 이동한 뒤에도 남아야 하는 상태는 GameInstance 서브시스템에 둡니다. 세션, 세이브, 결과 전달이 그런 예입니다. 그 맵의 객체들과 함께 생기고 사라져야 하는 상태, 예를 들어 레지스트리나 월드 매니저는 World 서브시스템에 둡니다. 수명이 맞지 않으면 누수가 생기거나 이전 상태가 남는 버그가 납니다.\n2. **싱글턴 UObject나 전역 변수 대신 서브시스템을 쓰는 이유는 무엇인가요?**\n   서브시스템은 엔진이 수명을 관리하므로, PIE를 여러 인스턴스로 실행하거나 맵을 이동해도 올바르게 만들어지고 없어집니다. 또한 GC 대상이고, 블루프린트에서 바로 접근하는 노드가 생깁니다. 반면 전역 static 변수는 PIE에서 여러 월드가 함께 쓰게 되어 버그가 납니다.\n3. **데디케이티드 서버에서 LocalPlayerSubsystem은 어떻게 되나요?**\n   데디케이티드 서버에는 로컬 플레이어가 없으므로 LocalPlayerSubsystem은 만들어지지 않습니다. 그래서 서버에도 필요한 로직은 World 서브시스템이나 GameInstance 서브시스템, 또는 게임 모드에 둡니다.\n\n### 실습 과제\n1. 네 종류의 서브시스템을 하나씩 만들고 `Initialize`와 `Deinitialize`에서 `this`와 outer 이름을 찍습니다. 맵 A에서 B로 `OpenLevel` 할 때와, PIE를 2인(분할 화면 또는 넷 모드 클라이언트 2명)으로 실행할 때 각각 몇 개가 언제 생기는지 표로 정리합니다.\n2. WorldSubsystem의 `ShouldCreateSubsystem`을 비워 둔 채 에디터를 열고, 에디터 월드에서도 만들어지는지 확인합니다. 중단점은 `FSubsystemCollectionBase::Initialize`와 `FSubsystemCollectionBase::AddAndInitializeValidatedSubsystem`에 겁니다. 일반 생성 경로는 `Initialize` → `AddAndInitializeSubsystems`(복수형) → `AddAndInitializeValidatedSubsystem`입니다. 단수형 `AddAndInitializeSubsystem`은 주로 `InitializeDependency`에서 불립니다. (근거: `SubsystemCollection.cpp:216`, `:260`, `:389`, `:472`)\n\n### 더 읽을 곳\n- Epic 문서의 'Programming Subsystems'\n- Tom Looman 블로그의 서브시스템 소개 글\n- (UI 쪽 LocalPlayer 서브시스템 활용) benui.ca\n\n---\n\n## 7. 델리게이트\n\n### 핵심\n\n#### 델리게이트의 종류\n\n델리게이트(delegate)는 \"나중에 부를 함수\"를 담아 두는 객체입니다. 예를 들어 무기가 탄을 다 쓰면 UI와 사운드에 알려야 할 때, 무기는 델리게이트를 호출하기만 하고 누가 듣는지는 몰라도 됩니다. 언리얼의 델리게이트는 크게 세 종류입니다.\n\n| 종류 | 선언 매크로 | 바인딩 수 | 반환값 | 호출 함수 |\n|---|---|---|---|---|\n| 싱글캐스트 | `DECLARE_DELEGATE_*` | 하나 | 가능 | `Execute`, `ExecuteIfBound` |\n| 멀티캐스트 | `DECLARE_MULTICAST_DELEGATE_*` | 여러 개 | 없음 | `Broadcast` |\n| 다이나믹 | `DECLARE_DYNAMIC_(MULTICAST_)DELEGATE_*` | 싱글은 하나, 멀티캐스트는 여러 개 | 싱글만 가능(`DECLARE_DYNAMIC_DELEGATE_RetVal`) | UFUNCTION 이름으로 바인딩 |\n\n멀티캐스트 델리게이트의 `Add*` 함수는 `FDelegateHandle`을 돌려주며, 나중에 이 핸들로 바인딩을 지울 수 있습니다.\n\n다이나믹 델리게이트는 UFUNCTION의 이름으로 바인딩합니다(`AddDynamic`, `BindDynamic`). 그래서 직렬화할 수 있고, `BlueprintAssignable`로 블루프린트에 노출할 수 있습니다. 하지만 이름으로 함수를 찾기 때문에 네이티브 델리게이트보다 느립니다.\n\n참고로 `DECLARE_EVENT`는 선언한 클래스만 Broadcast할 수 있는 멀티캐스트입니다.\n\n#### 바인딩 대상이 사라지면 어떻게 될까요?\n\n델리게이트에 함수를 걸어 둔 객체가 먼저 사라질 수 있습니다. 이때 안전한지는 바인딩 방법에 따라 다릅니다.\n\n- `AddUObject`, `BindUObject`, `AddDynamic`은 대상 UObject를 **약하게** 참조합니다. 멀티캐스트의 Broadcast는 사라진 UObject의 바인딩을 건너뜁니다. 싱글캐스트에서는 대상이 사라진 뒤 `Execute`를 부르면 위험하므로 `ExecuteIfBound`를 씁니다.\n- `AddSP`, `BindSP`는 `TWeakPtr`로 UObject가 아닌 공유 객체를 안전하게 참조합니다.\n- `AddLambda`, `BindLambda`, `CreateLambda`는 **수명을 추적하지 않습니다.**\n\n마지막 경우가 가장 위험합니다. 람다가 `[this]`를 캡처했는데 `this`가 수거된 뒤 호출되면, 이미 해제된 메모리를 쓰는 use-after-free가 일어납니다. 이때는 `AddWeakLambda(this, ...)`나 `CreateWeakLambda`를 씁니다. 첫 인자로 넘긴 UObject가 무효이면 람다가 호출되지 않습니다.\n\n```cpp\nSource->OnChanged.AddWeakLambda(this, [this]() { Refresh(); });\n```\n\n위 코드에서 첫 인자 `this`가 수명 기준 객체입니다. 위젯이 수거되면 `Source`가 Broadcast해도 이 람다는 불리지 않습니다.\n\n#### 그래도 정리는 해야 합니다\n\n약한 바인딩은 크래시를 막아 주지만, 호출 목록에는 죽은 항목이 남습니다. 또 같은 객체가 다시 바인딩하면 중복으로 호출됩니다. 그래서 `EndPlay`나 `Deinitialize`에서 `Remove(Handle)`나 `RemoveAll(this)`로 바인딩을 지웁니다.\n\n```cpp\nSource->OnChanged.RemoveAll(this);\n```\n\n#### 정리\n\n싱글캐스트는 바인딩 하나와 반환값을, 멀티캐스트는 여러 바인딩을, 다이나믹은 블루프린트 노출과 직렬화를 지원합니다. `AddLambda`는 수명을 추적하지 않으므로 `this`를 캡처할 때는 `AddWeakLambda`를 씁니다. 약한 바인딩이라도 종료 시점에 `Remove`나 `RemoveAll`로 정리합니다.\n\n### 흔한 함정\n- `AddLambda([this]{...})`로 바인딩한 뒤 객체가 먼저 사라지면, 언제 터질지 모르는 크래시가 납니다. `AddWeakLambda`나 `AddUObject`로 바꿉니다.\n- `AddDynamic`의 대상 함수에 `UFUNCTION()`을 빠뜨리면 런타임에 바인딩이 실패하고, 에디터 로그나 ensure로 드러납니다. 또 같은 함수를 두 번 `AddDynamic` 하면 ensure가 발생하므로 `AddUniqueDynamic`을 고려합니다.\n- Broadcast 도중에 바인딩을 추가하거나 지울 때의 동작이 델리게이트 종류마다 같다고 가정하면 안 됩니다. UE 5.8 기준으로 네이티브와 다이나믹은 다르게 동작합니다.\n\n#### 네이티브 멀티캐스트: Broadcast 도중의 Add와 Remove\n\n네이티브 멀티캐스트는 Broadcast 동안 호출 목록을 잠그고 뒤에서부터 역순으로 호출합니다. 도중에 `Remove`나 `RemoveAll`을 하면 그 항목은 바인딩만 풀리고, 목록을 압축하는 일은 나중으로 미뤄집니다. 따라서 크래시는 없고, 지운 항목은 이번 회차에 불리지 않습니다.\n\n도중에 `Add`한 항목도 이번 Broadcast에서는 불리지 않고 다음 Broadcast부터 불립니다. (근거: `Runtime/Core/Public/Delegates/MulticastDelegateBase.h:178-188`, `:288-318`, `:347-361`)\n\n#### 다이나믹 멀티캐스트: 복사본을 돈다\n\n다이나믹 멀티캐스트는 호출 목록의 복사본을 돌면서 호출합니다. 그래서 도중에 Remove한 항목도 이번 회차에는 불릴 수 있습니다. (근거: `Runtime/Core/Public/UObject/ScriptDelegates.h:1429-1457`)\n\n| 상황 | 네이티브 멀티캐스트 | 다이나믹 멀티캐스트 |\n|---|---|---|\n| 호출 목록을 도는 방식 | 목록을 잠그고 역순으로 호출합니다 | 목록의 복사본을 돕니다 |\n| 도중에 Remove한 항목 | 이번 회차에 불리지 않습니다 | 이번 회차에 불릴 수 있습니다 |\n\n#### 그러면 어떻게 할까요?\n\n두 경우 모두 동작은 정의되어 있습니다. 하지만 콜백 안에서 리스너 목록이나 대상의 수명을 바꾸는 코드는 읽기 어렵습니다. 그런 변경은 다음 틱으로 미루는 편이 안전합니다.\n\n### 면접 질문\n1. **다이나믹 델리게이트와 일반 델리게이트의 차이는 무엇인가요?**\n   다이나믹 델리게이트는 UFUNCTION의 이름으로 바인딩하므로 직렬화할 수 있고 블루프린트와 연결할 수 있습니다. 하지만 이름으로 함수를 찾기 때문에 느리고, UObject의 멤버 함수만 바인딩할 수 있습니다. 일반 델리게이트, 즉 네이티브 델리게이트는 빠르고 람다, 정적 함수, SP 등 다양한 바인딩을 지원합니다. 대신 블루프린트에 노출되지 않습니다.\n2. **AddUObject와 AddLambda는 안전성 면에서 어떻게 다른가요?**\n   `AddUObject`는 대상의 약한 참조를 보관하므로, 대상이 수거되면 호출을 건너뜁니다. `AddLambda`는 람다가 무엇을 캡처했는지 엔진이 모르기 때문에, 캡처한 `this`가 사라지면 댕글링 포인터가 됩니다. 그래서 `this`를 캡처할 때는 `AddWeakLambda`로 수명 기준 객체를 지정해야 합니다.\n3. **멀티캐스트 델리게이트에 반환값이 없는 이유는 무엇인가요?**\n   리스너가 여러 개이면 각 리스너의 반환값을 어떻게 합칠지 정할 방법이 없기 때문입니다. 결과가 필요하면 싱글캐스트 델리게이트를 쓰거나, 참조 인자로 결과를 누적하는 방식을 씁니다.\n\n### 실습 과제\n1. `AMyBroadcaster`의 멀티캐스트 델리게이트에 `AMyListener`를 (a) `AddUObject`, (b) `AddLambda([this])`, (c) `AddWeakLambda(this, ...)`로 각각 바인딩합니다. 리스너를 `Destroy()`하고 `obj gc`를 실행한 뒤 Broadcast해서, (b)만 문제가 생기는 것을 확인합니다.\n   - ASan이나 `-stompmalloc` 같은 메모리 검사 옵션을 켜면 문제를 재현하기 쉽습니다. `-stompmalloc`은 Shipping이 아닌 Win64, Mac, Linux 빌드에서 `WITH_MALLOC_STOMP=1`일 때 쓸 수 있습니다. (근거: `Runtime/Core/Core.Build.cs:365-374`, `Private/Windows/WindowsPlatformMemory.cpp:210-214`)\n   - 중단점은 `TMulticastDelegate::Broadcast`와 `TBaseUObjectMethodDelegateInstance::IsSafeToExecute`에 겁니다. 뒤의 함수는 대상의 `UserObject.Get()`이 null이 아닌지 검사합니다. (근거: `DelegateInstancesImpl.h:580-583`)\n2. 같은 함수를 `AddDynamic`으로 두 번 바인딩했을 때 나오는 ensure와 `AddUniqueDynamic`의 차이를 확인합니다. 이 ensure는 `DO_ENSURE` 빌드에서만 납니다. 다이나믹 델리게이트는 위의 네이티브 경로를 타지 않으므로, 중단점은 `TMulticastScriptDelegate::ProcessMulticastDelegate`와 중복 바인딩 ensure가 나는 `AddInternal`에 겁니다. (근거: `ScriptDelegates.h:1463`, `:1544-1551`)\n\n### 더 읽을 곳\n- Epic 문서의 'Delegates', 'Dynamic Delegates', 'Multi-cast Delegates', 'Events'\n- Tom Looman 블로그의 델리게이트·이벤트 바인딩 글\n- (UI 이벤트 바인딩) benui.ca의 UMG 델리게이트 관련 글\n\n---\n\n## 8. 모듈과 빌드\n\n### 핵심\n\n#### 모듈과 빌드 파일\n\n모듈(module)은 언리얼 코드를 빌드하고, 링크하고, 로드하는 단위입니다. 각 모듈은 `X.Build.cs` 파일에 의존성과 설정을 선언합니다. 이 파일은 C#으로 쓰며 UBT가 읽습니다. 실행 파일을 어떤 모듈들로 묶을지는 `X.Target.cs`가 정합니다.\n\n#### Public 의존성과 Private 의존성\n\n`PublicDependencyModuleNames`는 내 **Public 헤더**가 그 모듈의 타입을 노출할 때 씁니다. 이 경우 내 모듈을 쓰는 쪽도 그 모듈의 include 경로가 필요하기 때문입니다. `PrivateDependencyModuleNames`는 내 `.cpp`나 Private 폴더에서만 그 모듈을 쓸 때 씁니다.\n\n왜 구분할까요? Private으로 둔 의존성은 다른 모듈로 전파되지 않습니다. 그만큼 다른 모듈이 컴파일하고 링크해야 하는 범위가 줄어듭니다.\n\n#### 내보내기 매크로와 폴더 구분\n\n다른 모듈에서 내 클래스나 함수를 쓰려면 `MYMODULE_API` 내보내기 매크로가 필요합니다. 모듈형 빌드에서는 모듈마다 DLL이 나뉘므로, DLL 경계를 넘는 심볼은 내보내야 하기 때문입니다. Public 폴더에는 다른 모듈에 보여 줄 헤더를 두고, Private 폴더에는 내부 구현을 둡니다.\n\n#### 모듈 로딩 단계\n\n모듈은 .uproject나 .uplugin에 적은 로딩 단계(`LoadingPhase`)에 맞추어 로드됩니다. 단계에는 `PostConfigInit`, `PreDefault`, `Default`, `PostDefault`, `PostEngineInit` 등이 있습니다. 엔진 초기화가 끝난 뒤에야 쓸 수 있는 기능이 필요하면, 단계를 늦추거나 `FCoreDelegates::OnPostEngineInit`을 씁니다.\n\n각 모듈은 `StartupModule`과 `ShutdownModule`을 가집니다. 게임의 기본 모듈은 `IMPLEMENT_PRIMARY_GAME_MODULE`로 등록합니다.\n\n#### 컴파일 시간 줄이기\n\n헤더에서 포인터나 참조로만 쓰는 타입은 **전방 선언(forward declaration)** 하고, include는 .cpp로 옮깁니다. 이렇게 필요한 곳에서만 include하는 방식을 IWYU(Include What You Use)라고 합니다.\n\n하지만 완전한 타입이 필요한 경우에는 include해야 합니다. 값 멤버, 상속, 일부 템플릿 연산자가 그런 경우입니다. 또 유니티 빌드(unity build)는 여러 파일을 합쳐서 컴파일하므로, 빠진 include가 우연히 가려질 수 있습니다.\n\n#### 정리\n\n모듈은 `Build.cs`에 의존성을 선언하며, 공개 헤더가 노출하는 모듈은 Public으로, 구현에서만 쓰는 모듈은 Private으로 둡니다. 다른 모듈에 보여 줄 심볼에는 `_API` 매크로를 붙입니다. 헤더에는 가능한 한 전방 선언을 쓰되, 완전한 타입이 필요하면 include합니다.\n\n### 흔한 함정\n- Public 헤더에서 쓰는 타입의 모듈을 Private 의존성으로만 넣으면, 내 모듈은 빌드되지만 내 헤더를 include하는 다른 모듈에서 include 오류가 납니다.\n- `_API` 매크로를 빠뜨리면 같은 모듈 안에서는 잘 동작하다가, 다른 모듈에서 쓸 때 링크 오류(unresolved external)가 납니다.\n- 유니티 빌드에서만 컴파일되는 코드는 비유니티 빌드로 바꾸거나 파일 묶음이 달라질 때 깨집니다. 그래서 주기적으로 비유니티 빌드로 확인합니다. UE 5.8에서는 명령줄의 `-DisableUnity`, Target.cs의 `bUseUnityBuild = false`, 모듈 단위로는 Build.cs의 `bUseUnity = false`로 설정합니다. (근거: UBT `TargetDescriptor.cs:138-139`, `TargetRules.cs:1838`, `ModuleRules.cs:1069`)\n\n### 면접 질문\n1. **Public 의존성과 Private 의존성의 차이는 무엇인가요?**\n   Public 의존성은 내 공개 헤더가 그 모듈의 타입을 노출해서, 내 모듈을 쓰는 쪽에도 의존이 전파되어야 하는 경우에 씁니다. Private 의존성은 구현에서만 그 모듈을 쓰는 경우에 씁니다. 가능한 한 Private으로 두어 전파를 줄이면 빌드 시간과 모듈 사이의 결합도가 줄어듭니다.\n2. **전방 선언은 언제 쓸 수 있고 언제 쓸 수 없나요?**\n   포인터나 참조, `TObjectPtr` 멤버, 함수 선언의 인자와 반환형에는 전방 선언을 쓸 수 있습니다. 하지만 값 멤버나 상속, `sizeof`가 필요한 경우에는 include해야 합니다. 템플릿이 완전한 타입을 요구할 때도 마찬가지이며, `TSubclassOf`의 일부 연산이나 `TUniquePtr` 소멸자의 위치가 그런 예입니다.\n3. **모듈 로딩 단계를 바꿔야 하는 경우는 언제인가요?**\n   셰이더 디렉터리 매핑이나 커스텀 에셋 타입처럼 다른 모듈보다 먼저 등록되어야 하는 것은 이른 단계에 둡니다. 엔진과 에셋이 모두 준비된 뒤에 해야 하는 일은 `PostEngineInit` 단계나 그 델리게이트를 씁니다. 대부분의 게임 모듈은 `Default`로 충분합니다.\n\n### 실습 과제\n1. 빈 프로젝트에 두 번째 런타임 모듈 `MyCore`를 추가합니다. 그리고 `MyGame`에서 `MyCore`의 클래스를 (a) `_API` 없이 쓸 때와 (b) Private 의존성으로 넣은 채 Public 헤더에서 노출할 때 각각 어떤 오류가 나는지 기록합니다.\n2. 자주 include되는 헤더에서 include 하나를 전방 선언으로 바꿉니다. 그 헤더를 고쳤을 때 다시 컴파일되는 파일 수가 바꾸기 전과 어떻게 다른지 UBT 로그로 비교합니다. 중단점은 `FModuleManager::LoadModule`과 내 모듈의 `StartupModule`에 겁니다.\n\n### 더 읽을 곳\n- Epic 문서의 'Unreal Engine Modules', 'Module Properties', 'Build Configuration', 'Include What You Use (IWYU)'\n- Tom Looman 블로그의 C++ 빌드 시간·모듈 관련 글\n\n---\n\n## 간격 반복 카드\n\n| # | 질문 | 답 |\n|---|---|---|\n| 1 | UHT가 만드는 두 파일은 무엇인가요? | `X.generated.h`와 `X.gen.cpp`입니다 |\n| 2 | `generated.h`는 어디에 include하나요? | 헤더의 마지막 include로 둡니다 |\n| 3 | CDO란 무엇인가요? | 클래스마다 하나 있는 기본값 객체로, 생성자를 실행해 만들며 인스턴스 초기값과 델타 직렬화의 기준이 됩니다 |\n| 4 | 생성자에서 `GetWorld()`가 위험한 이유는 무엇인가요? | CDO를 만들 때는 월드가 없고, 생성자는 게임 시작 전에도 실행되기 때문입니다 |\n| 5 | `CreateDefaultSubobject`는 어디에서만 쓰나요? | 생성자 안에서만 씁니다 |\n| 6 | 코드에서 CDO 값을 읽는 함수는 무엇인가요? | `GetDefault<T>()`와 `Class->GetDefaultObject<T>()`입니다 |\n| 7 | 언리얼 GC는 어떤 방식인가요? | 루트에서 도달할 수 있는지를 따지는 마크 앤 스윕입니다 |\n| 8 | GC가 따라가는 참조는 무엇인가요? | UPROPERTY 참조(컨테이너 포함)와 `AddReferencedObjects`로 보고된 참조입니다 |\n| 9 | UObject가 아닌 클래스가 UObject를 붙잡는 두 방법은 무엇인가요? | `FGCObject`를 상속해 `AddReferencedObjects`로 보고하거나, `TStrongObjectPtr`를 씁니다 |\n| 10 | `AddToRoot`와 짝을 이루는 함수는 무엇인가요? | `RemoveFromRoot`이며, 빠뜨리면 누수가 생깁니다 |\n| 11 | GC 클러스터란 무엇인가요? | 함께 살고 함께 죽는 객체 묶음을 한 단위로 마킹하는 최적화입니다 |\n| 12 | UE5에서 pending kill을 대체한 개념은 무엇인가요? | garbage 표시(`MarkAsGarbage`)이며, 검사는 `IsValid`로 합니다 |\n| 13 | `IsValid(Obj)`가 false인 경우는 언제인가요? | null이거나 garbage(파괴 대기)로 표시된 경우입니다 |\n| 14 | `TWeakObjectPtr`는 무효를 어떻게 판정하나요? | 객체 배열 인덱스와 시리얼 번호를 비교합니다 |\n| 15 | 소프트 참조가 필요한 이유는 무엇인가요? | 참조만으로 에셋을 로드하지 않으므로 메모리와 로딩 시간을 관리할 수 있습니다 |\n| 16 | 소프트 참조로 로드한 객체가 GC되는 이유는 무엇인가요? | 아무도 강하게 참조하지 않아서이며, UPROPERTY나 `FStreamableHandle`로 붙잡아야 합니다 |\n| 17 | `TSubclassOf<T>`란 무엇인가요? | T의 하위 클래스만 허용하는 `UClass*` 하드 참조입니다 |\n| 18 | UObject에 `TSharedPtr`를 쓰면 어떻게 되나요? | GC와 참조 카운트가 수명을 두고 충돌하므로 쓰지 않습니다 |\n| 19 | GC 추적 여부를 정하는 것은 TObjectPtr인가요, UPROPERTY인가요? | UPROPERTY입니다 |\n| 20 | SpawnActor의 주요 호출 순서는 무엇인가요? | 생성자 → 컴포넌트 등록(OnRegister) → PostActorCreated → OnConstruction → PostActorConstruction 안에서 PreInitializeComponents → InitializeComponent → PostInitializeComponents → BeginPlay |\n| 21 | BeginPlay 전에 값을 넣는 스폰 방법은 무엇인가요? | `SpawnActorDeferred` → 값 설정 → `FinishSpawning` |\n| 22 | 맵에서 로드한 액터에 오지 않는 콜백은 무엇인가요? | `PostActorCreated`이며, 대신 `PostLoad`가 옵니다 |\n| 23 | EEndPlayReason의 다섯 가지 값은 무엇인가요? | Destroyed, LevelTransition, EndPlayInEditor, RemovedFromWorld, Quit입니다 |\n| 24 | Destroy 후 메모리는 어떤 순서로 해제되나요? | 다음 GC에서 BeginDestroy → FinishDestroy → 소멸자 순서입니다 |\n| 25 | 파괴가 진행 중인 액터인지 판정하는 함수는 무엇인가요? | `IsActorBeingDestroyed()`입니다 |\n| 26 | 액터 사이의 BeginPlay 순서는 보장되나요? | 보장되지 않습니다 |\n| 27 | `InitializeComponent`가 호출되는 조건은 무엇인가요? | `bWantsInitializeComponent = true`일 때입니다 |\n| 28 | OnRegister와 BeginPlay는 어떻게 다른가요? | OnRegister는 월드에 연결될 때(에디터 포함), BeginPlay는 게임이 시작될 때 불립니다 |\n| 29 | 런타임에 컴포넌트를 추가하는 절차는 무엇인가요? | `NewObject(Owner)` → 부착 → `RegisterComponent()` |\n| 30 | 맵 이동을 넘어 살아남는 서브시스템은 무엇인가요? | `UGameInstanceSubsystem`입니다 |\n| 31 | WorldSubsystem을 게임 월드에만 만들려면 어떻게 하나요? | `ShouldCreateSubsystem`에서 `IsGameWorld()`를 확인합니다 |\n| 32 | 데디케이티드 서버에 LocalPlayerSubsystem이 있나요? | 로컬 플레이어가 없으므로 없습니다 |\n| 33 | 서브시스템 초기화 순서를 강제하려면 어떻게 하나요? | `Collection.InitializeDependency<T>()`를 씁니다 |\n| 34 | 멀티캐스트 델리게이트에 반환값이 없는 이유는 무엇인가요? | 여러 리스너의 반환값을 합칠 규칙이 없기 때문입니다 |\n| 35 | 다이나믹 델리게이트의 장점과 단점은 무엇인가요? | 블루프린트 노출과 직렬화가 장점이고, 느리며 UFUNCTION만 바인딩할 수 있다는 점이 단점입니다 |\n| 36 | `AddLambda([this])`는 무엇이 위험한가요? | 수명을 추적하지 않아 this가 사라진 뒤 호출되면 use-after-free가 납니다 |\n| 37 | 람다에 수명 기준 객체를 거는 방법은 무엇인가요? | `AddWeakLambda(Obj, ...)`나 `CreateWeakLambda`를 씁니다 |\n| 38 | 싱글캐스트 델리게이트를 안전하게 호출하는 함수는 무엇인가요? | `ExecuteIfBound`입니다 |\n| 39 | Public 모듈 의존성과 Private 모듈 의존성은 어떻게 다른가요? | Public은 공개 헤더가 노출할 때 쓰며 전파되고, Private은 구현 전용이라 전파되지 않습니다 |\n| 40 | 다른 모듈에서 쓸 때 링크 오류(unresolved external)가 나는 흔한 원인은 무엇인가요? | `_API` 내보내기 매크로 누락이나 의존성 누락입니다 |\n| 41 | garbage로 표시된 객체를 가리키는 참조를 GC가 null로 지우는 기능과 CVar는 무엇인가요? | Garbage Elimination이며, CVar는 `gc.GarbageEliminationEnabled`(기본 켜짐)입니다 |\n| 42 | 쿠킹된 게임에서 `TObjectPtr`의 비용은 어느 정도인가요? | 원시 포인터와 같습니다(추적과 지연 해석은 `WITH_EDITORONLY_DATA` 전용) |\n| 43 | 스폰할 때 컴포넌트의 `OnRegister`와 `PostActorCreated` 중 무엇이 먼저인가요? | `OnRegister`가 먼저입니다(`PostSpawnInitialize` 안의 `RegisterAllComponents`) |\n| 44 | 네이티브 멀티캐스트에서 Broadcast 도중 Add한 바인딩은 언제 불리나요? | 이번 회차에는 불리지 않습니다 |\n| 45 | 쿠킹된 게임에서 맵에서 로드한 액터의 Construction Script가 다시 도나요? | 다시 돌지 않습니다(`RerunConstructionScripts`는 `WITH_EDITOR` 전용) |\n\n---\n\n## 9. 필기 대비 문제\n\n> 먼저 종이에 답을 쓴 뒤에 \"정답과 풀이\"를 펼칩니다. 정답의 근거는 이 노트의 1~8절과, 각 절에 적은 UE 5.8 엔진 소스 위치입니다. 실행해서 확인하는 실습은 연습 프로젝트(UECoreLab)에서 합니다.\n\n### 문제 1. 스폰 시 호출 순서 (4·5절)\n\n`UWorld::SpawnActor`로 액터 하나를 스폰했습니다. 월드는 이미 플레이 중입니다. 다음 함수들을 호출되는 순서대로 나열하세요.\n\n`BeginPlay`, `PostActorCreated`, `OnConstruction`, `PostInitializeComponents`, 생성자, 컴포넌트의 `OnRegister`, `PreInitializeComponents`, 컴포넌트의 `InitializeComponent`(`bWantsInitializeComponent = true`)\n\n**답:** 생성자 → `OnRegister` → `PostActorCreated` → `OnConstruction` → `PreInitializeComponents` → `InitializeComponent` → `PostInitializeComponents` → `BeginPlay`\n\n컴포넌트 등록(`RegisterAllComponents`)은 `PostSpawnInitialize` 안에서 일어나며, `PostActorCreated`보다 먼저입니다. `PreInitializeComponents`부터 `PostInitializeComponents`까지는 `PostActorConstruction` 안에서 호출됩니다. 월드가 이미 BeginPlay를 시작했으므로, 마지막에 `BeginPlay`까지 이어서 불립니다.\n\n### 문제 2. GC가 추적하는 참조 (2·3절)\n\n다음 멤버 중 GC가 참조를 아는(추적하는) 것을 모두 고르고, 나머지 멤버의 위험을 쓰세요.\n\n```cpp\nUCLASS()\nclass AMyActor : public AActor\n{\n    GENERATED_BODY()\n    UMyData* Cache;                                  // (1)\n    UPROPERTY() TObjectPtr<UMyData> Data;            // (2)\n    TArray<UMyData*> List;                           // (3)\n    UPROPERTY() TArray<TObjectPtr<UMyData>> Owned;   // (4)\n    TWeakObjectPtr<UMyData> Observed;                // (5)\n};\n```\n\n**답:** (2), (4)\n\nGC가 추적할지는 `UPROPERTY`가 정합니다. (1)과 (3)은 GC가 모르는 참조입니다. 다른 곳의 참조가 끊기면 객체가 수거되고, 이 멤버는 댕글링 포인터가 됩니다. 크래시는 GC 주기에 따라 언제 날지 모르게 납니다.\n\n(5)는 추적되지 않지만, 원래 수명을 붙잡지 않고 관찰만 하는 용도입니다. 대상이 수거되면 `Get()`이 null을 돌려주므로 안전합니다.\n\n### 문제 3. 생성자의 잘못 (1절)\n\n다음 생성자의 문제를 쓰고 고치세요.\n\n```cpp\nAMyActor::AMyActor()\n{\n    Target = GetWorld()->SpawnActor<AOther>();\n}\n```\n\n**답:** 생성자는 CDO를 만들 때도 실행됩니다. 그때는 월드가 없어 `GetWorld()`가 null이므로 크래시가 납니다. 생성자에서는 기본값 설정과 `CreateDefaultSubobject`만 합니다.\n\n스폰 코드는 `BeginPlay`로 옮깁니다. 스폰 직후, BeginPlay보다 먼저 값을 넣어야 한다면 `SpawnActorDeferred` → 값 설정 → `FinishSpawning` 순서를 씁니다.\n\n### 문제 4. Destroy 직후의 검사 (2·4절)\n\n같은 프레임에서 다음 두 값은 각각 무엇인가요?\n\n```cpp\nAActor* A = GetWorld()->SpawnActor<AActor>();\nA->Destroy();\nconst bool b1 = (A != nullptr);\nconst bool b2 = IsValid(A);\n```\n\n**답:** `b1 == true`, `b2 == false`\n\n`Destroy()`는 메모리를 바로 해제하지 않습니다. 액터를 월드에서 제거한 뒤 garbage로 표시할 뿐이며, 메모리는 다음 GC에서 `BeginDestroy` → `FinishDestroy` → 소멸자 순서로 해제됩니다.\n\n그래서 포인터는 아직 null이 아니지만, `IsValid`는 garbage 표시를 보고 거짓을 돌려줍니다. null 비교만으로 안전하다고 판단하면 안 됩니다.\n\n### 문제 5. 델리게이트 바인딩의 위험 (7절)\n\n다음 코드의 위험을 쓰고, 고치는 방법을 두 가지 쓰세요.\n\n```cpp\nvoid UMyWidget::NativeConstruct()\n{\n    Super::NativeConstruct();\n    Source->OnChanged.AddLambda([this]() { Refresh(); });\n}\n```\n\n**답:** `AddLambda`는 캡처한 `this`의 수명을 추적하지 않습니다. 위젯이 먼저 수거된 뒤 `Source`가 Broadcast하면, 이미 해제된 `this`로 `Refresh()`를 호출하게 됩니다(use-after-free).\n\n고치는 방법은 다음과 같습니다.\n\n- `AddUObject(this, &UMyWidget::Refresh)`나 `AddWeakLambda(this, [this]() { Refresh(); })`로 바꿉니다. 그러면 대상이 무효일 때 호출되지 않습니다.\n- 받은 `FDelegateHandle`을 저장해 두고 `NativeDestruct`에서 `Remove(Handle)`하거나 `RemoveAll(this)`합니다. 약한 바인딩만으로는 목록에 죽은 항목이 남고, 위젯이 다시 구성되면 중복으로 바인딩되기 때문입니다.\n\n### 문제 6. 서브시스템 고르기 (6절)\n\n다음 상태를 둘 서브시스템 종류를 `UGameInstanceSubsystem`, `UWorldSubsystem`, `ULocalPlayerSubsystem` 중에서 고르세요.\n\n- (a) 맵을 이동한 뒤에도 남아야 하는 지난 판 결과\n- (b) 현재 레벨에 있는 적 목록 레지스트리\n- (c) 플레이어마다 따로 쌓이는 화면 알림 큐(분할 화면 지원)\n- (d) 데디케이티드 서버에서도 필요한 판정용 레지스트리\n\n**답:** (a) GameInstance, (b) World, (c) LocalPlayer, (d) World(또는 GameInstance)\n\n(d)에서 LocalPlayer를 고르면 안 됩니다. 데디케이티드 서버에는 로컬 플레이어가 없으므로 LocalPlayer 서브시스템이 만들어지지 않습니다. 고르는 기준은 \"이 상태가 언제 사라져야 맞는가\"와 \"서버에도 필요한가\"입니다.\n\n### 문제 7. 호출되지 않는 `InitializeComponent` (5절)\n\n컴포넌트에서 `InitializeComponent`를 오버라이드했는데 호출되지 않습니다. 가장 흔한 원인은 무엇인가요?\n\n**답:** 생성자에서 `bWantsInitializeComponent = true;`를 켜지 않았습니다.\n\n이 플래그를 켠 컴포넌트만 액터의 `InitializeComponents` 단계에서 `InitializeComponent`를 받습니다. 런타임에 만든 컴포넌트라면 `RegisterComponent()`를 빠뜨리지 않았는지도 확인합니다.\n\n### 문제 8. 모듈 오류 진단 (8절)\n\n`LabCore` 모듈의 클래스 `FLabMath`를 게임 모듈 `UECoreLab`에서 씁니다. 각 상황에서 나는 오류의 원인을 쓰세요.\n\n- (a) `UECoreLab`는 컴파일되지만, 링크 단계에서 `FLabMath::Add`에 대한 unresolved external symbol 오류가 납니다. `UECoreLab.Build.cs`에는 `LabCore` 의존성이 있습니다.\n- (b) `UECoreLab`의 Public 헤더가 `LabCore`의 헤더를 include하고 있고, `UECoreLab`는 `LabCore`를 Private 의존성으로 넣었습니다. `UECoreLab`는 빌드되지만, `UECoreLab`에 의존하는 세 번째 모듈에서 include 오류가 납니다.\n\n**답:**\n\n- (a) `FLabMath`에 `LABCORE_API` 내보내기 매크로가 없습니다. 모듈형 빌드에서는 DLL 경계를 넘는 심볼을 내보내야 다른 모듈이 링크할 수 있습니다.\n- (b) Public 헤더가 노출하는 타입의 모듈은 Public 의존성으로 넣어야, 사용하는 쪽에도 include 경로가 전파됩니다. Private 의존성은 전파되지 않습니다.\n\n### 문제 9. 소프트 참조로 로드한 에셋이 사라짐 (3절)\n\n다음 코드로 메시를 로드해 지역 변수에만 두었더니, 잠시 뒤 메시가 메모리에서 내려갔습니다. 원인과 해결책은 무엇인가요?\n\n```cpp\nUStaticMesh* Mesh = MeshRef.LoadSynchronous();   // TSoftObjectPtr<UStaticMesh>\n```\n\n**답:** 로드한 객체를 강하게 참조하는 곳이 없어서 다음 GC에서 수거되었습니다. 소프트 포인터는 경로만 들고 있을 뿐 수명을 붙잡지 않습니다.\n\n해결하려면 로드한 결과를 `UPROPERTY` 강한 참조(`TObjectPtr`)에 저장합니다. 비동기 로드라면 `FStreamableManager`가 돌려준 `FStreamableHandle`을 유지합니다.\n\n### 문제 10. `TObjectPtr`의 비용 (3절)\n\n\"`TObjectPtr`는 원시 포인터보다 무거우니 핫패스 멤버에는 원시 포인터를 써야 한다\"는 주장을 평가하세요.\n\n**답:** 쿠킹된 게임에서는 틀린 주장입니다.\n\n접근 추적, 지연 해석, 타입 안전 검사는 `WITH_EDITORONLY_DATA`일 때만 켜집니다(`UE_WITH_OBJECT_HANDLE_*`). 쿠킹된 게임에서 `TObjectPtr`는 원시 포인터와 같습니다.\n\n게다가 UPROPERTY 멤버를 원시 포인터로 바꿔도 GC 추적은 `UPROPERTY`가 정하므로 안전성은 달라지지 않고, Epic이 권장하는 표기만 어기게 됩니다. 지역 변수와 함수 인자에는 원래 원시 포인터를 씁니다.\n\n### 문제 11. Broadcast 도중의 추가 (7절)\n\n네이티브 멀티캐스트 델리게이트의 리스너 A가 `Broadcast` 처리 중에, 같은 델리게이트에 리스너 B를 `AddUObject`로 추가했습니다. B는 이번 `Broadcast`에서 호출되나요?\n\n**답:** 호출되지 않습니다.\n\n네이티브 멀티캐스트는 Broadcast 동안 호출 목록을 잠그고 돕니다. 도중에 추가한 항목은 다음 Broadcast부터 호출됩니다. 다이나믹 멀티캐스트는 목록의 복사본을 돌기 때문에 도중에 제거한 항목이 이번 회차에 불릴 수 있다는 차이도 함께 기억합니다.\n\n### 문제 12. 클라이언트에서의 Destroy (4절)\n\n리플리케이트되는 액터를 클라이언트 코드에서 `Destroy()`하는 것이 왜 문제인가요?\n\n**답:** 리플리케이트되는 액터의 생성과 파괴는 권한을 가진 서버가 결정합니다. 클라이언트가 액터를 지우면 이 권한을 어기는 것이고, 서버 상태와 어긋나게 됩니다.\n\n파괴가 필요하면 서버 RPC로 요청하거나 서버 쪽 로직에서 처리합니다. 권한 판정은 `HasAuthority()`로 합니다. 넷 모드 검사(`GetNetMode()`)와 권한 검사는 서로 다른 질문이라는 점도 구분합니다.\n\n"}]</script>
<script>
/* 노트에 쓰는 마크다운 문법만 다루는 작은 변환기(외부 라이브러리 없이 오프라인에서도 동작). */
var MiniMD = (function () {
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push('<code>' + esc(c) + '</code>'); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[+i]; });
    return s;
  }
  function splitRow(line) {
    var t = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    var cells = [], cur = '', inCode = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (ch === '\\' && t[i + 1] === '|') { cur += '|'; i++; continue; }
      if (ch === '`') inCode = !inCode;
      if (ch === '|' && !inCode) { cells.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }
  var LIST_RE = /^(\s*)([-*]|\d+\.)\s+(.*)$/;
  function renderList(lines, start) {
    // lines[start] 은 목록 항목. 들여쓰기로 중첩을 판단한다.
    var first = LIST_RE.exec(lines[start]);

  } else { sampleState = 'absent'; }

  function rulesTurn() {
    return '너는 학습 튜터다. 학습자는 UE5 C++ 게임 클라이언트 프로그래머로서 필기 테스트와 기술 면접을 준비하고 있다. 아래 [학습 노트]가 이 대화의 맥락이다.\n' +
      '규칙:\n' +
      '- 한국어로 답하고, 핵심을 먼저 말한 뒤 필요한 만큼만 덧붙인다. 필요하면 짧은 코드 예를 든다.\n' +
      '- 학습자가 노트의 구절을 선택해 물으면, 그 구절이 노트의 어느 절과 맥락에 있는지 고려해 설명한다.\n' +
      '- "어떻게 동작하고 왜 그렇게 하는가"를 면접에서 말로 설명할 수 있는 수준으로 풀어 준다.\n' +
      '- 노트 내용이 틀렸거나 부족하다고 판단되면 분명히 지적한다. 확실하지 않은 내용은 지어내지 말고 "(확인 필요)"라고 표시한다.\n' +
      '- 언리얼 엔진 기준 버전은 UE 5.8이다.\n' +
      '- 서식은 굵게, 목록, 코드 블록, 표만 쓴다.\n\n' +
      '[학습 노트: ' + current.title + ']\n' + current.md;
  }
  function toTurn(m) {
    if (m.role === 'assistant') return { role: 'assistant', content: m.content };
    var c = m.content;
    if (m.quote) c = '[노트에서 선택한 구절 · 절: ' + (m.section || '알 수 없음') + ']\n"""\n' + m.quote + '\n"""\n\n질문: ' + c;
    return { role: 'user', content: c };
  }

  function bubble(m) {
    var d = el('div', 'msg ' + m.role);
    d.appendChild(el('div', 'who', m.role === 'user' ? '나' : (m.via || 'Claude')));
    if (m.quote) d.appendChild(el('div', 'quote', (m.section ? '[' + m.section + '] ' : '') + m.quote));
    var body = el('div', 'body');
    if (m.role === 'user') body.textContent = m.content; else body.innerHTML = MiniMD.render(m.content);
    d.appendChild(body);
    return { node: d, body: body };
  }
  function renderLog(msgs) {
    chatLog.innerHTML = '';
    if (!msgs.length) {
      chatLog.appendChild(el('p', 'chat-empty', '본문에서 모르는 부분을 드래그하면 "이 부분 질문하기" 버튼이 나옵니다. 구절을 고르지 않고 바로 질문해도 됩니다. 대화는 지금 보고 있는 노트 전체를 맥락으로 삼습니다.'));
      return;
    }
    msgs.forEach(function (m) { chatLog.appendChild(bubble(m).node); });
    chatLog.scrollTop = chatLog.scrollHeight;
  }
  function renderAttach() {
    chatAttach.hidden = !pendingQuote;
    chatAttachText.textContent = pendingQuote ? '[' + pendingQuote.section + '] ' + pendingQuote.quote : '';
  }
  function setBusy(b) { busy = b; chatStop.hidden = !b; updateAvail(); }
  function errCopy(e) {
    switch (e && e.code) {
      case 'rate_limited': return '요청이 너무 많거나 사용량 한도에 닿았습니다. 잠시 뒤에 다시 보내세요.';
      case 'session_expired': return 'claude.ai 로그인이 만료되었습니다. 다시 로그인한 뒤 보내세요.';
      case 'prompt_too_large': return '대화가 너무 길어졌습니다. "대화 지우기" 후 다시 질문하세요.';
      case 'refused': return '이 질문에는 답을 받지 못했습니다. 질문을 바꿔 보세요.';
      case 'empty_completion': return '빈 답이 돌아왔습니다. 질문을 조금 바꿔 다시 보내세요.';
      default: return '연결 문제로 답을 받지 못했습니다. 다시 보내 보세요.';
    }
  }
  function openChat() { chatEl.classList.add('open'); }

  chatForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy || !current) return;
    if (!copyMode() && !sampleFn) return;
    var q = chatInput.value.trim();
    if (!q && !pendingQuote) return;
    if (!q) q = '이 부분을 더 자세히 설명해 줘.';
    var msgs = loadMsgs();
    var um = { role: 'user', content: q };
    if (pendingQuote) { um.quote = pendingQuote.quote; um.section = pendingQuote.section; }
    msgs.push(um); saveMsgs(msgs);
    pendingQuote = null; renderAttach(); chatInput.value = '';
    renderLog(msgs);
    if (copyMode()) { gptAsk(msgs); return; }
    var b = bubble({ role: 'assistant', content: '' });
    b.body.textContent = '생각하는 중입니다...';
    chatLog.appendChild(b.node); chatLog.scrollTop = chatLog.scrollHeight;
    chatStatus.textContent = '';
    setBusy(true);
    ctl = new AbortController();
    var turns = [{ role: 'user', content: rulesTurn() }].concat(msgs.slice(-12).map(toTurn));
    var noteAtSend = current.id;
    sampleFn(turns, { cache: false, signal: ctl.signal, onText: function (u) { b.body.innerHTML = MiniMD.render(u.text); chatLog.scrollTop = chatLog.scrollHeight; } })
      .then(function (res) {
        var all = store.get('chat:' + noteAtSend, []);
        all.push({ role: 'assistant', content: res.text + (res.truncated ? '\n\n(답이 길이 제한으로 잘렸습니다. 더 좁혀서 물어보세요.)' : '') });
        store.set('chat:' + noteAtSend, all.slice(-40));
        if (current.id === noteAtSend) renderLog(all);
      }, function (e) {
        var all = store.get('chat:' + noteAtSend, []);
        if (e && e.text) { all.push({ role: 'assistant', content: e.text + '\n\n(중간에 멈췄습니다.)' }); store.set('chat:' + noteAtSend, all.slice(-40)); }
        if (current.id === noteAtSend) renderLog(all);
        var code = e && e.code;
        if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') { sampleState = 'denied'; }
        else if (code !== 'cancelled') { chatStatus.textContent = '질문 실패: ' + errCopy(e); }
      })
      .then(function () { setBusy(false); });
  });
  chatInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); chatForm.requestSubmit(); } });
  chatStop.addEventListener('click', function () { if (ctl) ctl.abort(); });
  document.getElementById('chatAttachRemove').addEventListener('click', function () { pendingQuote = null; renderAttach(); });
  document.getElementById('chatClose').addEventListener('click', function () { chatEl.classList.remove('open'); });
  document.getElementById('chatFab').addEventListener('click', function () { chatEl.classList.toggle('open'); });
  chatClear.addEventListener('click', function () {
    if (!clearArmed) {
      chatClear.textContent = '한 번 더 누르면 삭제';
      clearArmed = setTimeout(function () { clearArmed = null; chatClear.textContent = '대화 지우기'; }, 3000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; chatClear.textContent = '대화 지우기';
    saveMsgs([]); renderLog([]);
    main.querySelectorAll('mark.hl').forEach(function (m) { m.replaceWith(document.createTextNode(m.textContent)); });
  });

  // 본문 드래그 → "이 부분 질문하기"
  function sectionOf(node) {
    var e = node && (node.nodeType === 1 ? node : node.parentElement);
    return e ? e.closest('section.topic, .intro') : null;
  }
  function onSelect() {
    setTimeout(function () {
      var s = window.getSelection();
      if (!s || s.isCollapsed || !s.rangeCount) { askSel.hidden = true; return; }
      var text = s.toString().replace(/\s+\n/g, '\n').trim();
      var r = s.getRangeAt(0);
      var sec = sectionOf(r.commonAncestorContainer);
      if (text.length < 2 || !sec || !main.contains(sec)) { askSel.hidden = true; return; }
      var rect = r.getBoundingClientRect();
      var w = document.documentElement.clientWidth;
      askSel.style.top = (rect.bottom + window.scrollY + 8) + 'px';
      askSel.style.left = Math.max(8, Math.min(rect.left + window.scrollX, w - 170 + window.scrollX)) + 'px';
      askSel.hidden = false;
      selState = { range: r.cloneRange(), text: text.slice(0, 1500), sec: sec };
    }, 0);
  }
  main.addEventListener('mouseup', onSelect);
  main.addEventListener('keyup', onSelect);
  main.addEventListener('touchend', onSelect);
  document.addEventListener('mousedown', function (e) { if (e.target !== askSel) askSel.hidden = true; });
  askSel.addEventListener('mousedown', function (e) { e.preventDefault(); });
  askSel.addEventListener('click', function () {
    if (!selState) return;
    var h = selState.sec.querySelector('h2');
    var title = h ? h.textContent.trim() : '머리말';
    try { var mk = document.createElement('mark'); mk.className = 'hl'; selState.range.surroundContents(mk); } catch (e) { /* 여러 요소에 걸친 선택은 표시만 생략한다 */ }
    var s = window.getSelection(); if (s) s.removeAllRanges();
    pendingQuote = { quote: selState.text, section: title };
    selState = null; askSel.hidden = true;
    renderAttach(); openChat(); chatInput.focus();
  });

  function highlightQuote(quote, sectionTitle) {
    var secs = main.querySelectorAll('section.topic');
    for (var i = 0; i < secs.length; i++) {
      var h = secs[i].querySelector('h2');
      if (!h || h.textContent.trim() !== sectionTitle) continue;
      var walker = document.createTreeWalker(secs[i], NodeFilter.SHOW_TEXT);
      var n;
      while ((n = walker.nextNode())) {
        var idx = n.nodeValue.indexOf(quote);
        if (idx === -1 || (n.parentElement && n.parentElement.closest('mark.hl'))) continue;
        var mid = n.splitText(idx); mid.splitText(quote.length);
        var mk = document.createElement('mark'); mk.className = 'hl';
        mid.parentNode.insertBefore(mk, mid); mk.appendChild(mid);
        return;
      }
    }
  }
  function chatOnShow() {
    if (!current) return;
    document.getElementById('chatCtx').textContent = '맥락: ' + current.title;
    pendingQuote = null; renderAttach();
    var msgs = loadMsgs();
    renderLog(msgs);
    msgs.forEach(function (m) { if (m.quote && m.section) highlightQuote(m.quote, m.section); });
    gptBox.hidden = true;
    setProvider(provider);
  }

  function applyAnswers() { main.querySelectorAll('details.ans').forEach(function (d) { d.open = answersOpen; }); }
  var tBtn = document.getElementById('toggleAnswers');
  tBtn.addEventListener('click', function () { answersOpen = !answersOpen; tBtn.setAttribute('aria-pressed', String(answersOpen)); tBtn.textContent = answersOpen ? '답 모두 접기' : '답 모두 펼치기'; applyAnswers(); });

  function route() { var id = location.hash.replace('#', ''); show(id); }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
